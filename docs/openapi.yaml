openapi: 3.1.0
info:
  title: Auction API
  version: 1.0.0
  description: |
    Hono REST API for auctions, bids, payments, and users. Auth at `/api/auth/*` (Better Auth).
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      summary: Liveness and dependency checks
      responses:
        "200":
          description: OK
        "503":
          description: Degraded (DB or Redis failure)
  /metrics:
    get:
      summary: Basic counters (e.g. active auctions)
      responses:
        "200":
          description: JSON metrics
  /auctions:
    get:
      summary: List auctions (filters via query)
    post:
      summary: Create draft auction (auth)
  /auctions/{id}:
    get:
      summary: Get auction by id
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /auctions/{id}/bids:
    get:
      summary: Bid history (sealed + active hides bids except admin)
  /auctions/{id}/publish:
    post:
      summary: Publish draft → scheduled and schedule BullMQ jobs (seller, auth)
  /auctions/{id}/cancel:
    post:
      summary: Cancel auction (seller or admin, auth)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
  /bids:
    post:
      summary: Place bid (auth). Optional header Idempotency-Key (24h dedupe).
  /payments:
    post:
      summary: Create pending payment for winner (auth). When Xero is connected, response includes checkoutUrl for online invoice.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      paymentId:
                        type: string
                        format: uuid
                      clientSecret:
                        type: string
                        nullable: true
                      checkoutUrl:
                        type: string
                        nullable: true
                        description: Xero online invoice URL when configured and connected
  /admin/integrations/xero/status:
    get:
      summary: Xero connection summary (admin, auth)
  /admin/integrations/xero/oauth/consent-url:
    get:
      summary: Start Xero OAuth — returns consent URL (admin, auth)
  /admin/integrations/xero/oauth/complete:
    post:
      summary: Complete Xero OAuth with full callback URL (admin, auth)
  /admin/integrations/xero/disconnect:
    post:
      summary: Remove stored Xero tokens (admin, auth)
  /admin/payments/{id}/xero-sync:
    post:
      summary: Pull invoice state from Xero and update local payment if paid (admin, auth)
  /webhooks/xero:
    post:
      summary: Xero webhooks (signed with X-Xero-Signature); configure XERO_WEBHOOK_KEY on API
  /payments/{id}/refund:
    post:
      summary: Refund payment (admin only, auth; DB status only until a gateway is integrated)
  /categories:
    get:
      summary: List categories
  /users/me/notifications:
    get:
      summary: List notifications (auth)
