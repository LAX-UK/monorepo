# Single-droplet stack: Identity, Bid API, Shop Identity app, WS, Web, and dependencies.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-auction}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auction} -d ${POSTGRES_DB:-auction}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL_AUTH: ${DATABASE_URL_AUTH:?set DATABASE_URL_AUTH to auth_app role URL}
      DATABASE_URL: ${DATABASE_URL_AUTH}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lax-bid-api}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      AUTH_DEK_KEY: ${AUTH_DEK_KEY:?set AUTH_DEK_KEY in .env}
      IDENTITY_MACHINE_CLIENT_ID: ${IDENTITY_MACHINE_CLIENT_ID:?set IDENTITY_MACHINE_CLIENT_ID}
      IDENTITY_MACHINE_CLIENT_SECRET: ${IDENTITY_MACHINE_CLIENT_SECRET:?set IDENTITY_MACHINE_CLIENT_SECRET}
      API_INTERNAL_BASE_URL: http://api:3001
      IDENTITY_EMAIL_ENQUEUE_TIMEOUT_MS: ${IDENTITY_EMAIL_ENQUEUE_TIMEOUT_MS:-3000}
      IDENTITY_SUBJECT_USAGE_TIMEOUT_MS: ${IDENTITY_SUBJECT_USAGE_TIMEOUT_MS:-1500}
      IDENTITY_MERGE_ENABLED: ${IDENTITY_MERGE_ENABLED:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL_API:?set DATABASE_URL_API to api_app role URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL in .env}
      OIDC_INTERNAL_BASE_URL: http://auth:3003
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lax-bid-api}
      IDENTITY_MACHINE_CLIENT_ID: ${IDENTITY_MACHINE_CLIENT_ID:?set IDENTITY_MACHINE_CLIENT_ID}
      IDENTITY_MACHINE_CLIENT_SECRET: ${IDENTITY_MACHINE_CLIENT_SECRET:?set IDENTITY_MACHINE_CLIENT_SECRET}
      REDIS_URL: redis://redis:6379
      CHECK_IN_TOKEN_SECRET: ${CHECK_IN_TOKEN_SECRET:?set CHECK_IN_TOKEN_SECRET in .env}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      VERIFY_ORIGIN: ${VERIFY_ORIGIN:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MARKETING_ATTRIBUTION_ENABLED: ${MARKETING_ATTRIBUTION_ENABLED:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Xero (optional — set in root `.env`; see `.env.example` / `.env.production.example`)
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      XERO_REDIRECT_URI: ${XERO_REDIRECT_URI:-}
      XERO_WEBHOOK_KEY: ${XERO_WEBHOOK_KEY:-}
      XERO_DEFAULT_REVENUE_ACCOUNT_CODE: ${XERO_DEFAULT_REVENUE_ACCOUNT_CODE:-200}
      XERO_DEFAULT_TAX_TYPE: ${XERO_DEFAULT_TAX_TYPE:-NONE}
      XERO_INVOICE_DUE_DAYS: ${XERO_INVOICE_DUE_DAYS:-14}
      XERO_INVOICE_BLOCKING: ${XERO_INVOICE_BLOCKING:-false}
      XERO_POST_CONNECT_WEB_REDIRECT: ${XERO_POST_CONNECT_WEB_REDIRECT:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env (sk_live_ in production)}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?set STRIPE_PUBLISHABLE_KEY in .env}
      VERIFF_API_KEY: ${VERIFF_API_KEY:?set VERIFF_API_KEY in .env}
      VERIFF_SHARED_SECRET: ${VERIFF_SHARED_SECRET:?set VERIFF_SHARED_SECRET in .env}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:?set STRIPE_CONNECT_WEBHOOK_SECRET in .env}
      STRIPE_TRANSFERS_WEBHOOK_SECRET: ${STRIPE_TRANSFERS_WEBHOOK_SECRET:?set STRIPE_TRANSFERS_WEBHOOK_SECRET in .env}
      STRIPE_PAYMENTS_WEBHOOK_SECRET: ${STRIPE_PAYMENTS_WEBHOOK_SECRET:?set STRIPE_PAYMENTS_WEBHOOK_SECRET in .env}
      CRON_INTERNAL_SECRET: ${CRON_INTERNAL_SECRET:?set CRON_INTERNAL_SECRET in .env (min 32 chars)}
      KYC_THRESHOLD_AMOUNT: ${KYC_THRESHOLD_AMOUNT:-1000}
      KYC_THRESHOLD_CURRENCY: ${KYC_THRESHOLD_CURRENCY:-GBP}
      APP_ENV: production
      STRICT_BID_ELIGIBILITY_ENABLED: ${STRICT_BID_ELIGIBILITY_ENABLED:-false}
      ENGLISH_ONLY_AUCTIONS: ${ENGLISH_ONLY_AUCTIONS:-true}
      OPS_SUPPORT_EMAIL: ${OPS_SUPPORT_EMAIL:?set OPS_SUPPORT_EMAIL in .env}
      OPS_ONCALL_EMAIL: ${OPS_ONCALL_EMAIL:?set OPS_ONCALL_EMAIL in .env}
      WEB_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: "3004"
      DATABASE_URL: ${DATABASE_URL_WORKER:?set DATABASE_URL_WORKER to worker_app role URL}
      DATABASE_URL_WORKER: ${DATABASE_URL_WORKER:?set DATABASE_URL_WORKER to worker_app role URL}
      REDIS_URL: redis://redis:6379
      API_INTERNAL_BASE_URL: http://api:3001
      API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      CRON_INTERNAL_SECRET: ${CRON_INTERNAL_SECRET:?set CRON_INTERNAL_SECRET in .env (min 32 chars)}
      ADMIN_EMAIL_ADDRESS: ${ADMIN_EMAIL_ADDRESS:?set ADMIN_EMAIL_ADDRESS in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-postmark}
      EMAIL_FROM: ${EMAIL_FROM:-LAX.BID by London Art Exchange <no-reply@mail.lax.bid>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      POSTMARK_TRANSACTIONAL_STREAM: ${POSTMARK_TRANSACTIONAL_STREAM:-outbound}
      POSTMARK_BROADCAST_STREAM: ${POSTMARK_BROADCAST_STREAM:-broadcast}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_URL: ${CLAMAV_URL:-}
      VERIFF_API_KEY: ${VERIFF_API_KEY:-}
      VERIFF_SHARED_SECRET: ${VERIFF_SHARED_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      XERO_CLIENT_ID: ${XERO_CLIENT_ID:-}
      XERO_CLIENT_SECRET: ${XERO_CLIENT_SECRET:-}
      XERO_REDIRECT_URI: ${XERO_REDIRECT_URI:-}
      DOMAIN_EVENT_PUBLISH_VALIDATE: ${DOMAIN_EVENT_PUBLISH_VALIDATE:-enforce}
      WEBHOOK_EVENTS_PROCESS: ${WEBHOOK_EVENTS_PROCESS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${WEB_ORIGIN}
      API_URL: http://api:3001
      OIDC_ISSUER: ${OIDC_ISSUER_URL}
      JWKS_URL: http://auth:3003/.well-known/jwks.json
      WS_JWT_AUDIENCE: ${WS_JWT_AUDIENCE:-lax-ws}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  shop-identity:
    build:
      context: .
      dockerfile: apps/shop-identity/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3010"
      DATABASE_URL_SHOP: ${DATABASE_URL_SHOP:?set DATABASE_URL_SHOP to shop_app role URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_INTERNAL_BASE_URL: http://auth:3003
      OIDC_CLIENT_ID: lax-shop-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?set OIDC_REDIRECT_URI in .env}
      OIDC_POST_LOGOUT_REDIRECT_URI: ${OIDC_POST_LOGOUT_REDIRECT_URI:?set OIDC_POST_LOGOUT_REDIRECT_URI in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    depends_on:
      auth:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL}
        NEXT_PUBLIC_WS_URL: ${WS_PUBLIC_URL}
        NEXT_PUBLIC_ENGLISH_ONLY_AUCTIONS: ${NEXT_PUBLIC_ENGLISH_ONLY_AUCTIONS:-true}
        NEXT_PUBLIC_SETTLEMENTS_EMAIL: ${NEXT_PUBLIC_SETTLEMENTS_EMAIL:-}
        NEXT_PUBLIC_SETTLEMENTS_PHONE: ${NEXT_PUBLIC_SETTLEMENTS_PHONE:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-G-GDG4D2YELR}
        NEXT_PUBLIC_MARKETING_ATTRIBUTION_ENABLED: ${NEXT_PUBLIC_MARKETING_ATTRIBUTION_ENABLED:-false}
        NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-.lax.bid}
      secrets:
        - sentry_auth_token
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: "3000"
      STRICT_BID_ELIGIBILITY_ENABLED: ${STRICT_BID_ELIGIBILITY_ENABLED:-false}
      INTERNAL_API_URL: http://api:3001
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OIDC_INTERNAL_BASE_URL: http://auth:3003
      OIDC_CLIENT_SECRET_LAX_BID_WEB: ${OIDC_CLIENT_SECRET_LAX_BID_WEB:?set OIDC_CLIENT_SECRET_LAX_BID_WEB}
      BID_BFF_SESSION_ENCRYPTION_KEY: ${BID_BFF_SESSION_ENCRYPTION_KEY:?set BID_BFF_SESSION_ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-G-GDG4D2YELR}
      NEXT_PUBLIC_MARKETING_ATTRIBUTION_ENABLED: ${NEXT_PUBLIC_MARKETING_ATTRIBUTION_ENABLED:-false}
      NEXT_PUBLIC_COOKIE_DOMAIN: ${NEXT_PUBLIC_COOKIE_DOMAIN:-.lax.bid}
      KYC_ONBOARDING_ENABLED: ${KYC_ONBOARDING_ENABLED:-false}
      FULL_BUYER_ONBOARDING_ENABLED: ${FULL_BUYER_ONBOARDING_ENABLED:-false}
      MARKETING_PROMPTS_ENABLED: ${MARKETING_PROMPTS_ENABLED:-false}
    depends_on:
      api:
        condition: service_healthy

  event:
    build:
      context: .
      dockerfile: apps/event/Dockerfile
      args:
        VITE_API_BASE: ${API_PUBLIC_URL}
        VITE_WEB_ORIGIN: ${WEB_ORIGIN}
        VITE_EVENT_ORIGIN: ${EVENT_ORIGIN:-https://event.lax.bid}
        VITE_CDN_BASE: ${VITE_CDN_BASE:-https://cdn.lax.bid}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PUBLISH_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - auth
      - ws
      - worker
      - shop-identity
      - event

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

volumes:
  postgres_data:
  redis_data:
