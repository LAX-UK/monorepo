name: Terraform plan
description: Create a Terraform plan and summarize it
inputs:
  working-directory:
    required: true
  plan-name:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform plan -input=false -out="${{ inputs.plan-name }}.tfplan"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform show -no-color "${{ inputs.plan-name }}.tfplan" > "${{ inputs.plan-name }}.txt"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.plan-name }}
        path: |
          ${{ inputs.working-directory }}/${{ inputs.plan-name }}.tfplan
          ${{ inputs.working-directory }}/${{ inputs.plan-name }}.txt
