name: App Platform deploy
description: Create a deployment, poll to a terminal phase, and collect diagnostics
inputs:
  app-id:
    required: true
  timeout-seconds:
    required: false
    default: "1200"
  poll-interval-seconds:
    required: false
    default: "10"
  expected-releases:
    description: JSON object keyed by readiness URL with expected release values
    required: false
    default: "{}"
  readiness-urls:
    description: JSON array of HTTPS URLs that must return status ok
    required: false
    default: "[]"
  rolling-image-tag:
    description: >-
      When set, pin prebuilt Bid DOCR services (api, ws, worker, web, migrate,
      clamav) to this immutable tag via digitalocean/app_action/deploy@v2.
      Test auth uses standalone lax-identity images; do not set IMAGE_TAG_AUTH here.
      That action runs a full deployment; do not follow with create-deployment
      (a second deploy can supersede the pin before web traffic moves).
    required: false
    default: ""
  do-token:
    description: DigitalOcean API token (required when rolling-image-tag is set)
    required: false
    default: ""
outputs:
  deployment_id:
    description: Exact App Platform deployment ID
    value: ${{ steps.resolve-deployment.outputs.deployment_id }}
  phase:
    description: Terminal App Platform deployment phase
    value: ${{ steps.poll.outputs.phase }}
runs:
  using: composite
  steps:
    - name: Resolve App Platform app name
      id: meta
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        app_json="$(doctl apps get "$APP_ID" --output json)"
        app_name="$(
          jq -r 'if type == "array" then .[0].spec.name else .spec.name end // empty' <<<"$app_json"
        )"
        test -n "$app_name"
        echo "name=$app_name" >> "$GITHUB_OUTPUT"

    - name: Pin prebuilt component image tags
      id: pin
      if: inputs.rolling-image-tag != ''
      uses: digitalocean/app_action/deploy@v2
      env:
        IMAGE_TAG_API: ${{ inputs.rolling-image-tag }}
        IMAGE_TAG_WS: ${{ inputs.rolling-image-tag }}
        IMAGE_TAG_WORKER: ${{ inputs.rolling-image-tag }}
        IMAGE_TAG_WEB: ${{ inputs.rolling-image-tag }}
        IMAGE_TAG_MIGRATE: ${{ inputs.rolling-image-tag }}
        IMAGE_TAG_CLAMAV: ${{ inputs.rolling-image-tag }}
      with:
        token: ${{ inputs.do-token }}
        app_name: ${{ steps.meta.outputs.name }}
        print_deploy_logs: true

    - name: Create App Platform deployment
      id: create
      if: inputs.rolling-image-tag == ''
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        deployment_json="$(doctl apps create-deployment "$APP_ID" --output json)"
        deployment_id="$(
          jq -r 'if type == "array" then .[0].id else .id end // empty' <<<"$deployment_json"
        )"
        test -n "$deployment_id"
        echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

    - name: Resolve deployment ID
      id: resolve-deployment
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PINNED: ${{ inputs.rolling-image-tag != '' && 'true' || 'false' }}
        CREATE_DEPLOYMENT_ID: ${{ steps.create.outputs.deployment_id }}
      run: |
        set -euo pipefail
        if test "$PINNED" = "true"; then
          deployment_id="$(
            doctl apps list-deployments "$APP_ID" --output json |
              jq -r 'if type == "array" then .[0].id else .id end // empty'
          )"
        else
          deployment_id="$CREATE_DEPLOYMENT_ID"
        fi
        test -n "$deployment_id"
        echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

    - name: Poll deployment to terminal phase
      id: poll
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        DEPLOYMENT_ID: ${{ steps.resolve-deployment.outputs.deployment_id }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
      run: |
        set -euo pipefail
        deadline=$((SECONDS + TIMEOUT_SECONDS))
        phase=""
        while (( SECONDS < deadline )); do
          deployment="$(doctl apps get-deployment "$APP_ID" "$DEPLOYMENT_ID" --output json)"
          phase="$(
            jq -r 'if type == "array" then .[0].phase else .phase end // empty' <<<"$deployment"
          )"
          case "$phase" in
            ACTIVE) break ;;
            ERROR|CANCELED|SUPERSEDED)
              echo "::error::App Platform deployment ended in phase $phase"
              doctl apps get-deployment "$APP_ID" "$DEPLOYMENT_ID" --output json |
                jq -r '
                  (if type == "array" then .[0].progress.steps[]? else .progress.steps[]? end)
                  | select(.status == "ERROR")
                  | "\(.name): \(.reason // .message // "unknown")"
                ' || true
              for component in auth shop shop-identity api ws worker web; do
                doctl apps logs "$APP_ID" "$component" \
                  --type run --tail 200 --deployment "$DEPLOYMENT_ID" || true
              done
              exit 1
              ;;
          esac
          sleep "$POLL_INTERVAL_SECONDS"
        done
        echo "phase=$phase" >> "$GITHUB_OUTPUT"
        if test "$phase" != "ACTIVE"; then
          echo "::error::App Platform deployment $DEPLOYMENT_ID timed out in phase ${phase:-unknown}"
          doctl apps get-deployment "$APP_ID" "$DEPLOYMENT_ID" --output json || true
          for component in auth shop shop-identity api ws worker web; do
            doctl apps logs "$APP_ID" "$component" \
              --type run --tail 200 --deployment "$DEPLOYMENT_ID" || true
          done
          exit 1
        fi

    - name: Verify readiness URLs
      if: inputs.readiness-urls != '[]'
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        READINESS_URLS: ${{ inputs.readiness-urls }}
        EXPECTED_RELEASES: ${{ inputs.expected-releases }}
      run: |
        set -euo pipefail
        mapfile -t urls < <(jq -r '.[]' <<<"$READINESS_URLS")
        for url in "${urls[@]}"; do
          expected_release="$(jq -r --arg url "$url" '.[$url] // empty' <<<"$EXPECTED_RELEASES")"
          for _ in $(seq 1 60); do
            body="$(curl --fail --silent --max-time 10 "$url" || true)"
            actual_release="$(jq -r '.release // empty' <<<"$body" 2>/dev/null || true)"
            status="$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)"
            if test "$status" = "ok" &&
              { test -z "$expected_release" || test "$actual_release" = "$expected_release"; }; then
              break
            fi
            sleep 10
          done
          actual_release="$(jq -r '.release // empty' <<<"$body" 2>/dev/null || true)"
          status="$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)"
          test "$status" = "ok" &&
            { test -z "$expected_release" || test "$actual_release" = "$expected_release"; } || {
            echo "::error::Readiness contract failed for $url: expected release ${expected_release:-any}, actual ${actual_release:-missing}"
            if test -n "${APP_ID:-}"; then
              doctl apps get "$APP_ID" --output json |
                jq -r '
                  (if type == "array" then .[0].spec.services[]? else .spec.services[]? end)
                  | select(.name == "web")
                  | "web image tag: \(.image.tag // "unknown") registry: \(.image.registry // "unknown")"
                ' || true
              doctl apps list-deployments "$APP_ID" --output json |
                jq -r 'if type == "array" then .[0] else . end | "latest deployment: \(.id) phase \(.phase)"' ||
                true
            fi
            exit 1
          }
        done
