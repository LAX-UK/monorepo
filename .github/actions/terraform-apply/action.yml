name: Terraform apply
description: Apply Terraform and back up state
inputs:
  working-directory:
    required: true
  state-key:
    required: true
  verify-plan-safe:
    required: false
    default: "false"
  allowed-delete-addresses:
    description: JSON array of exact resource addresses allowed to be deleted
    required: false
    default: "[]"
  app-id:
    description: Optional App Platform ID used for failure diagnostics
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform plan -input=false -out=tfapply.tfplan
    - name: Back up Terraform state before apply
      shell: bash
      run: |
        set -euo pipefail
        ts="$(date -u +%Y%m%dT%H%M%SZ)"
        source="s3://${STATE_BUCKET_NAME:-lax-tf-state}/${{ inputs.state-key }}/terraform.tfstate"
        destination="s3://${STATE_BUCKET_NAME:-lax-tf-state}/${{ inputs.state-key }}/backups/pre-apply-${ts}.tfstate"
        error_file="$RUNNER_TEMP/${{ inputs.state-key }}-pre-apply-backup-error.txt"
        if aws --endpoint-url "https://lon1.digitaloceanspaces.com" \
          s3 cp "$source" "$destination" 2>"$error_file"; then
          rm -f "$error_file"
        elif grep -Eq '404|NoSuchKey|does not exist' "$error_file"; then
          rm -f "$error_file"
          echo "No pre-existing remote state object; this is an initial state."
        else
          cat "$error_file" >&2
          exit 1
        fi
    - name: Render redacted Terraform plan evidence
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform show -no-color tfapply.tfplan > "$RUNNER_TEMP/${{ inputs.state-key }}-plan.txt"
    - name: Retain redacted Terraform plan
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan-${{ inputs.state-key }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/${{ inputs.state-key }}-plan.txt
        if-no-files-found: error
        retention-days: 30
    - shell: bash
      if: inputs.verify-plan-safe == 'true'
      working-directory: ${{ inputs.working-directory }}
      env:
        TF_ALLOWED_DELETE_ADDRESSES: ${{ inputs.allowed-delete-addresses }}
      run: node "$GITHUB_WORKSPACE/scripts/ci/verify-terraform-plan-safe.mjs" tfapply.tfplan
    - name: Snapshot App Platform deployments before apply
      if: inputs.app-id != ''
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        doctl apps list-deployments "$APP_ID" --output json |
          jq '[.[].id]' > "$RUNNER_TEMP/${{ inputs.state-key }}-deployments-before.json"
    - id: apply
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform apply -input=false tfapply.tfplan
    - name: Capture exact App Platform deployment diagnostics
      if: always() && inputs.app-id != ''
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
      run: |
        set -euo pipefail
        before="$RUNNER_TEMP/${{ inputs.state-key }}-deployments-before.json"
        deployments="$RUNNER_TEMP/${{ inputs.state-key }}-deployments-after.json"
        evidence="$RUNNER_TEMP/${{ inputs.state-key }}-app-platform-diagnostics.json"
        doctl apps list-deployments "$APP_ID" --output json > "$deployments" || true
        deployment_id="$(
          jq -r --slurpfile before "$before" --arg outcome "$APPLY_OUTCOME" '
            ($before[0] // []) as $prior |
            [.[] | select(.id as $id | ($prior | index($id) | not))] as $new |
            if ($new | length) == 0 then empty
            elif $outcome == "failure" then
              ([$new[] | select(.phase == "ERROR")] | sort_by(.created_at) | last | .id)
                // ($new | sort_by(.created_at) | last | .id)
            else
              ($new | sort_by(.created_at) | last | .id)
            end // empty
          ' "$deployments"
        )"
        # A no-op apply creates no deployment; retain the current one for evidence.
        if test -z "$deployment_id"; then
          deployment_id="$(jq -r 'sort_by(.created_at) | last | .id // empty' "$deployments")"
        fi
        jq -n --arg appId "$APP_ID" --arg deploymentId "$deployment_id" \
          --arg applyOutcome "${{ steps.apply.outcome }}" \
          '{appId: $appId, deploymentId: $deploymentId, applyOutcome: $applyOutcome}' > "$evidence"
        if test -n "$deployment_id"; then
          doctl apps get-deployment "$APP_ID" "$deployment_id" --output json \
            > "$RUNNER_TEMP/${{ inputs.state-key }}-deployment-${deployment_id}.json" || true
          for component in auth shop shop-identity shop-api api ws worker web; do
            for log_type in run run_restarted; do
              doctl apps logs "$APP_ID" "$component" --type "$log_type" --tail 200 \
                --deployment "$deployment_id" \
                > "$RUNNER_TEMP/${{ inputs.state-key }}-${component}-${log_type}.log" 2>&1 || true
            done
          done
        fi
    - name: Retain App Platform diagnostics
      if: always() && inputs.app-id != ''
      uses: actions/upload-artifact@v4
      with:
        name: app-platform-diagnostics-${{ inputs.state-key }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/${{ inputs.state-key }}-*
        if-no-files-found: warn
        retention-days: 30
    - name: Capture post-apply state addresses
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform state list > "$RUNNER_TEMP/${{ inputs.state-key }}-state-addresses.txt" || true
    - name: Retain post-apply state diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: terraform-state-addresses-${{ inputs.state-key }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/${{ inputs.state-key }}-state-addresses.txt
        if-no-files-found: warn
        retention-days: 30
    - name: Back up Terraform state after apply attempt
      if: always()
      shell: bash
      env:
        APPLY_OUTCOME: ${{ steps.apply.outcome }}
      run: |
        set -euo pipefail
        ts="$(date -u +%Y%m%dT%H%M%SZ)"
        source="s3://${STATE_BUCKET_NAME:-lax-tf-state}/${{ inputs.state-key }}/terraform.tfstate"
        destination="s3://${STATE_BUCKET_NAME:-lax-tf-state}/${{ inputs.state-key }}/backups/post-${APPLY_OUTCOME}-${ts}.tfstate"
        error_file="$RUNNER_TEMP/${{ inputs.state-key }}-post-apply-backup-error.txt"
        if aws --endpoint-url "https://lon1.digitaloceanspaces.com" \
          s3 cp "$source" "$destination" 2>"$error_file"; then
          rm -f "$error_file"
        elif test "$APPLY_OUTCOME" = "failure" &&
          grep -Eq '404|NoSuchKey|does not exist' "$error_file"; then
          rm -f "$error_file"
          echo "No remote state was created by the failed initial apply."
        else
          cat "$error_file" >&2
          exit 1
        fi
    - name: Fail when Terraform apply failed
      if: steps.apply.outcome == 'failure'
      shell: bash
      run: exit 1
