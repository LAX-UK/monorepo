name: Await test deploy turn
description: >-
  FIFO queue for the shared test app lock. GitHub concurrency keeps one running and ONE pending
  run per group and cancels any older pending run, so queued deploys and "Terraform test up"
  dispatches evict each other. Callers run this in a job WITHOUT a concurrency group, then take
  the real group in a following job; because only the head of the queue gets there, nothing
  is ever pending behind another pending run.
inputs:
  github-token:
    description: Token with actions:read.
    required: true
  workflows:
    description: Space-separated workflow files that take turns on the test app.
    required: false
    default: app-deploy-test.yml terraform-test-up.yml
  timeout-minutes:
    description: Give up waiting after this many minutes.
    required: false
    default: "120"
runs:
  using: composite
  steps:
    - name: Wait until every earlier run has finished
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOWS: ${{ inputs.workflows }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        set -euo pipefail
        mine="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.created_at')"
        deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))
        while true; do
          ahead=0
          for wf in $WORKFLOWS; do
            for status in queued in_progress waiting; do
              n="$(gh api -X GET "repos/$REPO/actions/workflows/$wf/runs" -f status="$status" -f per_page=100 \
                --jq "[.workflow_runs[] | select(.id != $RUN_ID) | select(.created_at < \"$mine\" or (.created_at == \"$mine\" and .id < $RUN_ID))] | length")"
              ahead=$(( ahead + n ))
            done
          done
          if [ "$ahead" -eq 0 ]; then
            echo "No earlier run ahead; taking the test deploy lock."
            exit 0
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::error::Still $ahead earlier test deploy run(s) ahead after ${TIMEOUT_MINUTES}m"
            exit 1
          fi
          echo "$ahead earlier test deploy run(s) ahead; waiting."
          sleep 30
        done
