name: Identity extraction rehearsal

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Install deterministic history filter
        run: pipx install git-filter-repo==2.47.0
      - name: Install history secret scanner
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSLf https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz |
            tar -xz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - run: pnpm ci:identity-extraction-rehearsal
        env:
          IDENTITY_REHEARSAL_TMPDIR: ${{ runner.temp }}/identity-rehearsal
      - name: Upload rehearsal diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: identity-rehearsal-diagnostics
          path: ${{ runner.temp }}/identity-rehearsal
          if-no-files-found: error
