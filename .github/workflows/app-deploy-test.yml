name: App deploy test
on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/actions/app-platform-deploy/**
      - .github/workflows/app-deploy-test.yml
      - scripts/ci/verify-prebuilt-web-for-deploy.mjs
      - scripts/ci/assert-app-platform-spec.mjs
      - scripts/ci/assert-app-platform-spec.test.mjs
      - scripts/ci/verify-readiness-contract.mjs
      - scripts/ci/parse-docker-image-pin.mjs
      - scripts/ci/resolve-immutable-shop-deploy-pins.mjs
      - scripts/ci/registry-tag-poll.mjs
  workflow_dispatch:
    inputs:
      deploy_shop:
        description: Force immutable Shop deploy on this commit (requires AUTO_DEPLOY_SHOP_TEST)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: app-deploy-test
  cancel-in-progress: false
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      immutable_boundary_changed: ${{ steps.changes.outputs.immutable_boundary_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        name: Detect changes requiring immutable staging cutover
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed=false
          if test "${{ github.event_name }}" = "workflow_dispatch" &&
            test "${{ inputs.deploy_shop }}" = "true"; then
            changed=true
          elif test "${{ github.event_name }}" = "push" &&
            git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- \
              apps/shop apps/shop-identity apps/shop-api; then
            changed=false
          elif test "${{ github.event_name }}" = "push"; then
            changed=true
          fi
          echo "immutable_boundary_changed=$changed" >> "$GITHUB_OUTPUT"
          if test "$changed" = "true"; then
            {
              echo "Shop boundary changed on this commit."
              if test "${{ vars.AUTO_DEPLOY_SHOP_TEST }}" = "true"; then
                echo "AUTO_DEPLOY_SHOP_TEST is enabled; immutable Shop deploy runs after build-images."
              else
                echo "Bid-only App Platform deploy runs; enable repo variable AUTO_DEPLOY_SHOP_TEST or use staging-recovery-test.yml for Shop."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if test "${{ vars.AUTO_DEPLOY_SHOP_TEST }}" != "true"; then
              echo "::warning::Shop boundary changed but AUTO_DEPLOY_SHOP_TEST is not enabled; Bid App Platform deploy runs and test-shop stays on the previous Shop release."
            fi
          fi

  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require green CI on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/require-ci-success-for-sha.mjs
  sentry-release:
    uses: ./.github/workflows/sentry-release.yml
    with:
      environment: test
      git_sha: ${{ github.sha }}
    secrets: inherit
  # Prebuilt images (api, auth, ws, worker, migrate, web) pushed to DOCR so App
  # Platform only pulls. Runs in parallel with sentry-release. Gated on the
  # repository variable USE_PREBUILT_IMAGES_TEST (caller jobs cannot bind an
  # environment, so only repo/org vars are visible in the `if:`).
  build-images:
    needs: ci-gate
    if: ${{ vars.USE_PREBUILT_IMAGES_TEST == 'true' }}
    uses: ./.github/workflows/build-images.yml
    with:
      environment: test
      git_sha: ${{ github.sha }}
    secrets: inherit

  resolve-shop-immutable-pins:
    runs-on: ubuntu-latest
    needs: [classify, ci-gate, build-images]
    if: >-
      ${{
        always() &&
        needs.classify.outputs.immutable_boundary_changed == 'true' &&
        vars.AUTO_DEPLOY_SHOP_TEST == 'true' &&
        needs.ci-gate.result == 'success' &&
        needs.build-images.result == 'success'
      }}
    environment: test
    outputs:
      identity_sha: ${{ steps.pins.outputs.identity_sha }}
      identity_digest: ${{ steps.pins.outputs.identity_digest }}
      shop_identity_sha: ${{ steps.pins.outputs.shop_identity_sha }}
      shop_identity_digest: ${{ steps.pins.outputs.shop_identity_digest }}
      shop_sha: ${{ steps.pins.outputs.shop_sha }}
      shop_digest: ${{ steps.pins.outputs.shop_digest }}
      shop_api_sha: ${{ steps.pins.outputs.shop_api_sha }}
      shop_api_digest: ${{ steps.pins.outputs.shop_api_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest-test-${{ github.sha }}
          path: .
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200
      - id: pins
        name: Resolve immutable Shop deploy pins
        env:
          ENVIRONMENT: test
          RELEASE_MANIFEST: release-manifest.json
          MONOREPO_SHA: ${{ github.sha }}
        run: node scripts/ci/resolve-immutable-shop-deploy-pins.mjs

  deploy-shop-immutable:
    needs: resolve-shop-immutable-pins
    if: >-
      ${{
        always() &&
        needs.resolve-shop-immutable-pins.result == 'success'
      }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/terraform-apply-test.yml
    with:
      layer: ephemeral
      parent_holds_deploy_lock: true
      identity_sha: ${{ needs.resolve-shop-immutable-pins.outputs.identity_sha }}
      identity_digest: ${{ needs.resolve-shop-immutable-pins.outputs.identity_digest }}
      shop_identity_sha: ${{ needs.resolve-shop-immutable-pins.outputs.shop_identity_sha }}
      shop_identity_digest: ${{ needs.resolve-shop-immutable-pins.outputs.shop_identity_digest }}
      shop_sha: ${{ needs.resolve-shop-immutable-pins.outputs.shop_sha }}
      shop_digest: ${{ needs.resolve-shop-immutable-pins.outputs.shop_digest }}
      shop_api_sha: ${{ needs.resolve-shop-immutable-pins.outputs.shop_api_sha }}
      shop_api_digest: ${{ needs.resolve-shop-immutable-pins.outputs.shop_api_digest }}
      app_image_tag: ${{ needs.resolve-shop-immutable-pins.outputs.shop_sha }}
    secrets: inherit

  shop-immutable-smoke:
    needs: [deploy-shop-immutable, resolve-shop-immutable-pins]
    if: >-
      ${{
        always() &&
        needs.deploy-shop-immutable.result == 'success'
      }}
    uses: ./.github/workflows/shop-staging-acceptance.yml
    with:
      shop_sha: ${{ needs.resolve-shop-immutable-pins.outputs.shop_sha }}
      seed_catalogue: false
      parent_holds_deploy_lock: true
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: [classify, ci-gate, sentry-release, build-images]
    # Deploy unless the image build failed/was cancelled. Sentry release/sourcemap
    # failures must NOT block shipping, so we deliberately do not gate on its result.
    # When build-images is skipped (USE_PREBUILT_IMAGES != true) its result is 'skipped' => allowed.
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (needs.classify.outputs.immutable_boundary_changed != 'true' ||
          vars.AUTO_DEPLOY_SHOP_TEST != 'true') &&
        needs.build-images.result != 'failure' &&
        needs.build-images.result != 'cancelled'
      }}
    environment: test
    env:
      APP_ID: ${{ secrets.DO_TEST_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until App Platform app exists
        if: env.APP_ID == ''
        run: echo "DO_TEST_APP_ID is not set yet; skipping app deployment until Terraform creates the app."
      - uses: digitalocean/action-doctl@v2
        if: env.APP_ID != ''
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Build post-deploy readiness URL list
        if: env.APP_ID != ''
        id: readiness
        env:
          APP_ID: ${{ env.APP_ID }}
        run: |
          set -euo pipefail
          urls='["https://test-api.lax.bid/health/ready","https://test.lax.bid/api/health/ready"]'
          app_json="$(doctl apps get "$APP_ID" --output json)"
          if jq -e '
            .[0].spec.services[]? | select(.name == "shop")
          ' <<<"$app_json" >/dev/null; then
            urls='["https://test-api.lax.bid/health/ready","https://test.lax.bid/api/health/ready","https://test-shop.lax.bid/health/ready"]'
          fi
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
      - if: env.APP_ID != ''
        uses: ./.github/actions/app-platform-deploy
        with:
          app-id: ${{ env.APP_ID }}
          readiness-urls: ${{ steps.readiness.outputs.urls }}
          expected-releases: >-
            {"https://test.lax.bid/api/health/ready":"${{ github.sha }}"}
          rolling-image-tag: ${{ vars.USE_PREBUILT_IMAGES_TEST == 'true' && github.sha || '' }}
          prebuilt-environment: test
          do-token: ${{ secrets.DIGITALOCEAN_TOKEN }}
