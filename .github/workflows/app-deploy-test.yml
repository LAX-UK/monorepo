name: App deploy test
on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docker/migrate.Dockerfile
      - patches/**
      - .github/actions/app-platform-deploy/**
      - .github/workflows/app-deploy-test.yml
      - .github/workflows/build-images.yml
      - scripts/ci/**
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full 40-character commit SHA to redeploy (must exist in DOCR for built components)
        type: string
        required: false
      rollback_rehearsal:
        description: After a successful deploy, roll back to the prior deployment and re-run readiness
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: app-deploy-test
  cancel-in-progress: false
jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require green CI on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/require-ci-success-for-sha.mjs

  plan:
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: test
    outputs:
      build_components: ${{ steps.plan.outputs.build_components || steps.skip_plan.outputs.build_components }}
      affected_components: ${{ steps.plan.outputs.affected_components || steps.skip_plan.outputs.affected_components }}
      deploy: ${{ steps.plan.outputs.deploy || steps.skip_plan.outputs.deploy }}
      tag_map: ${{ steps.plan.outputs.tag_map || steps.skip_plan.outputs.tag_map }}
    env:
      APP_ID: ${{ secrets.DO_TEST_APP_ID }}
      AUTH_TAG_MAP_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip until App Platform app exists
        id: skip_plan
        if: env.APP_ID == ''
        run: |
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "build_components=[]" >> "$GITHUB_OUTPUT"
          echo "affected_components=[]" >> "$GITHUB_OUTPUT"
          echo "tag_map={}" >> "$GITHUB_OUTPUT"
      - uses: digitalocean/action-doctl@v2
        if: env.APP_ID != ''
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Validate redeploy SHA
        if: env.APP_ID != '' && inputs.git_sha != ''
        run: |
          set -euo pipefail
          [[ "${{ inputs.git_sha }}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::git_sha must be a full 40-character commit SHA"
            exit 1
          }
      - id: plan
        if: env.APP_ID != ''
        name: Resolve affected components
        env:
          APP_ID: ${{ env.APP_ID }}
          TARGET_SHA: ${{ inputs.git_sha || github.sha }}
          ROLLBACK_REHEARSAL: ${{ inputs.rollback_rehearsal == true && 'true' || 'false' }}
        run: node scripts/ci/resolve-affected-deploy-components.mjs

  sentry-release:
    needs: ci-gate
    uses: ./.github/workflows/sentry-release.yml
    with:
      environment: test
      git_sha: ${{ inputs.git_sha || github.sha }}
    secrets: inherit

  build-images:
    needs: [ci-gate, plan]
    if: >-
      ${{
        needs.plan.outputs.deploy == 'true' &&
        vars.USE_PREBUILT_IMAGES_TEST == 'true' &&
        needs.plan.outputs.build_components != '[]'
      }}
    uses: ./.github/workflows/build-images.yml
    with:
      environment: test
      git_sha: ${{ inputs.git_sha || github.sha }}
      components: ${{ needs.plan.outputs.build_components }}
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: [ci-gate, plan, sentry-release, build-images]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.ci-gate.result == 'success' &&
        needs.plan.outputs.deploy == 'true' &&
        needs.build-images.result != 'failure' &&
        needs.build-images.result != 'cancelled'
      }}
    environment: test
    env:
      APP_ID: ${{ secrets.DO_TEST_APP_ID }}
      TARGET_SHA: ${{ inputs.git_sha || github.sha }}
      AUTH_TAG_MAP_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Record active deployment for rollback
        id: prior
        env:
          APP_ID: ${{ env.APP_ID }}
        run: |
          set -euo pipefail
          prior="$(
            doctl apps get "$APP_ID" --output json |
              jq -r '.[0].active_deployment.id // empty'
          )"
          echo "deployment_id=$prior" >> "$GITHUB_OUTPUT"
      - name: Build post-deploy readiness URL list
        id: readiness
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          TAG_MAP: ${{ needs.plan.outputs.tag_map }}
          MODE: readiness-urls
        run: node scripts/ci/build-expected-releases.mjs
      - name: Build expected release map
        id: expected_releases
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          TAG_MAP: ${{ needs.plan.outputs.tag_map }}
          READINESS_URLS: ${{ steps.readiness.outputs.urls }}
        run: node scripts/ci/build-expected-releases.mjs
      - name: Verify DOCR tags for built components
        if: vars.USE_PREBUILT_IMAGES_TEST == 'true'
        env:
          APP_ID: ${{ env.APP_ID }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
          TAG_MAP: ${{ needs.plan.outputs.tag_map }}
        run: |
          node scripts/ci/verify-prebuilt-images-for-deploy.mjs \
            --environment test \
            --deploy-sha "$TARGET_SHA" \
            --tag-map "$TAG_MAP" \
            --app-id "$APP_ID"
      - uses: ./.github/actions/app-platform-deploy
        id: app_deploy
        with:
          app-id: ${{ env.APP_ID }}
          readiness-urls: ${{ steps.readiness.outputs.urls }}
          expected-releases: ${{ steps.expected_releases.outputs.json }}
          image-tag-map: ${{ vars.USE_PREBUILT_IMAGES_TEST == 'true' && needs.plan.outputs.tag_map || '' }}
          prebuilt-environment: test
          do-token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Fast staging smoke
        id: smoke
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          TAG_MAP: ${{ needs.plan.outputs.tag_map }}
          SMOKE_AUTH: ${{ contains(fromJSON(needs.plan.outputs.affected_components), 'auth') }}
          SMOKE_SHOP: >-
            ${{
              contains(fromJSON(needs.plan.outputs.affected_components), 'shop') ||
              contains(fromJSON(needs.plan.outputs.affected_components), 'shop-api') ||
              contains(fromJSON(needs.plan.outputs.affected_components), 'shop-admin') ||
              contains(fromJSON(needs.plan.outputs.affected_components), 'shop-identity')
            }}
        run: node scripts/ci/staging-deploy-smoke.mjs
      - name: Shop admin OIDC preflight
        if: >-
          contains(fromJSON(needs.plan.outputs.affected_components), 'shop') ||
          contains(fromJSON(needs.plan.outputs.affected_components), 'shop-admin') ||
          contains(fromJSON(needs.plan.outputs.affected_components), 'shop-api') ||
          contains(fromJSON(needs.plan.outputs.affected_components), 'shop-identity')
        run: node scripts/ci/verify-shop-admin-oidc-preflight.mjs
      - name: Roll back on smoke failure after ACTIVE
        id: rollback_smoke
        if: >-
          failure() &&
          steps.smoke.outcome == 'failure' &&
          steps.app_deploy.outputs.phase == 'ACTIVE' &&
          steps.prior.outputs.deployment_id != ''
        env:
          APP_ID: ${{ env.APP_ID }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          ROLLBACK_RESULT: pending
        run: |
          set -euo pipefail
          node scripts/ci/digitalocean-app-rollback-api.mjs \
            --app-id "$APP_ID" \
            --deployment-id "${{ steps.prior.outputs.deployment_id }}" \
            | tee "$RUNNER_TEMP/rollback-result.json"
      - name: Record rollback outcome
        if: always() && steps.prior.outputs.deployment_id != ''
        run: |
          if test "${{ steps.rollback_smoke.outcome || 'skipped' }}" = "success"; then
            echo "ROLLBACK_RESULT=success" >> "$GITHUB_ENV"
          elif test "${{ steps.rollback_smoke.outcome || 'skipped' }}" = "failure"; then
            echo "ROLLBACK_RESULT=failed" >> "$GITHUB_ENV"
          else
            echo "ROLLBACK_RESULT=skipped" >> "$GITHUB_ENV"
          fi
      - name: Rollback rehearsal (manual)
        if: >-
          success() &&
          inputs.rollback_rehearsal == true &&
          steps.prior.outputs.deployment_id != ''
        env:
          APP_ID: ${{ env.APP_ID }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/ci/digitalocean-app-rollback-api.mjs \
            --app-id "$APP_ID" \
            --deployment-id "${{ steps.prior.outputs.deployment_id }}"
          node scripts/ci/verify-readiness-contract.mjs \
            --urls "${{ steps.readiness.outputs.urls }}" \
            --expected-releases '{}' \
            --app-id "$APP_ID" \
            --attempts 30 \
            --interval-seconds 10
      - name: Write deploy artifact
        if: always()
        env:
          TARGET_SHA: ${{ env.TARGET_SHA }}
          PRIOR_DEPLOYMENT_ID: ${{ steps.prior.outputs.deployment_id }}
          DEPLOYMENT_ID: ${{ steps.app_deploy.outputs.deployment_id }}
          AFFECTED_COMPONENTS: ${{ needs.plan.outputs.affected_components }}
          TAG_MAP: ${{ needs.plan.outputs.tag_map }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          ROLLBACK_RESULT: ${{ env.ROLLBACK_RESULT || 'skipped' }}
        run: node scripts/ci/write-deploy-artifact.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-deploy-test-${{ github.run_id }}
          path: deploy-artifact.json
          if-no-files-found: warn
