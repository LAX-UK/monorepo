name: App deploy test
on:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
permissions:
  contents: read
jobs:
  sentry-release:
    uses: ./.github/workflows/sentry-release.yml
    with:
      environment: test
      git_sha: ${{ github.sha }}
    secrets: inherit
  # Prebuilt images (api/auth/ws/worker/migrate) pushed to DOCR so App Platform
  # only pulls. Runs in parallel with sentry-release. Gated on a REPOSITORY-level
  # variable (a reusable-workflow caller job cannot bind an environment, so the
  # `vars` context here only sees repo/org variables — not environment-scoped ones).
  # Stays inert until the registry + Terraform deploy_source = image are live.
  build-images:
    if: ${{ vars.USE_PREBUILT_IMAGES_TEST == 'true' }}
    uses: ./.github/workflows/build-images.yml
    with:
      environment: test
      git_sha: ${{ github.sha }}
    secrets: inherit
  deploy:
    runs-on: ubuntu-latest
    needs: [sentry-release, build-images]
    # Deploy unless the image build failed/was cancelled. Sentry release/sourcemap
    # failures must NOT block shipping, so we deliberately do not gate on its result.
    # When build-images is skipped (USE_PREBUILT_IMAGES != true) its result is 'skipped' => allowed.
    if: ${{ always() && !cancelled() && needs.build-images.result != 'failure' && needs.build-images.result != 'cancelled' }}
    environment: test
    env:
      APP_ID: ${{ secrets.DO_TEST_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until App Platform app exists
        if: env.APP_ID == ''
        run: echo "DO_TEST_APP_ID is not set yet; skipping app deployment until Terraform creates the app."
      - uses: digitalocean/action-doctl@v2
        if: env.APP_ID != ''
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - if: env.APP_ID != ''
        run: doctl apps create-deployment "$APP_ID"
