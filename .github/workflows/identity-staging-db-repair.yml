name: Identity staging DB repair

on:
  workflow_dispatch:
    inputs:
      apply_relay_cursor:
        description: Apply identity outbox relay cursor repair (requires relay_cutoff_iso)
        type: boolean
        required: true
        default: false
      relay_cutoff_iso:
        description: UTC cutoff for forward-only relay cursor (max outbox id before this time)
        type: string
        required: false
        default: "2026-09-28T11:21:44Z"
      restore_cursors:
        description: Restore all worker projector_state cursors after seed damage
        type: boolean
        required: true
        default: false
      domain_event_cutoff:
        description: UTC cutoff for domain-event projector cursors
        type: string
        required: false
        default: "2026-09-28T13:36:32Z"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: test
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      ASSESS_SINCE_ISO: "2026-09-28T11:40:17Z"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/checkout-infra
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Load staging database contract
        run: |
          set -euo pipefail
          tf_dir=.infra-config/terraform/ephemeral/test
          owner_url="$(terraform -chdir="$tf_dir" output -raw postgres_owner_uri)"
          database_ca_cert="$(terraform -chdir="$tf_dir" output -raw database_ca_certificate)"
          test -n "$owner_url"
          test -n "$database_ca_cert"
          echo "::add-mask::$owner_url"
          echo "DATABASE_URL_OWNER=$owner_url" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$owner_url" >> "$GITHUB_ENV"
          {
            echo 'DATABASE_CA_CERT<<__DATABASE_CA_CERT__'
            printf '%s\n' "$database_ca_cert"
            echo '__DATABASE_CA_CERT__'
          } >> "$GITHUB_ENV"
      - name: Assess staging seed damage (read-only)
        run: pnpm tsx scripts/ci/assess-staging-seed-damage.mjs
      - name: Restore staging projector cursors
        if: inputs.restore_cursors
        env:
          DOMAIN_EVENT_CUTOFF: ${{ inputs.domain_event_cutoff }}
          RELAY_CUTOFF: ${{ inputs.relay_cutoff_iso }}
        run: |
          set -euo pipefail
          pnpm tsx scripts/ci/restore-staging-projector-cursors.mjs \
            --domain-event-cutoff "$DOMAIN_EVENT_CUTOFF" \
            --relay-cutoff "$RELAY_CUTOFF" \
            --apply
      - name: Repair identity outbox relay cursor
        if: inputs.apply_relay_cursor
        run: |
          set -euo pipefail
          pnpm tsx scripts/ci/repair-identity-outbox-relay-cursor.mjs \
            --cutoff "${{ inputs.relay_cutoff_iso }}" \
            --apply
