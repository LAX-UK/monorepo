name: Public site accessibility (nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: public-a11y-nightly
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_E2E: "1"
      PLAYWRIGHT_BASE_URL: https://test.lax.bid
      PLAYWRIGHT_API_URL: https://test-api.lax.bid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @auction/web exec playwright install chromium --with-deps
      - name: Run the public accessibility spec against test.lax.bid
        run: pnpm --filter @auction/web exec playwright test e2e/public-a11y.spec.ts --project=public-chromium --workers=1 --reporter=html
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-a11y-report
          path: apps/web/playwright-report
          retention-days: 14
