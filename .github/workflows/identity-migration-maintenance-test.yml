name: Identity database migration maintenance (test)

on:
  workflow_dispatch:
    inputs:
      migration_through:
        description: Production migration ceiling (0159, 0160, or 0161)
        required: true
        type: choice
        options: ["0159", "0160", "0161"]
      confirm_review:
        description: Confirm the migration diff and rollback evidence were reviewed
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: identity-migration-maintenance-test
  cancel-in-progress: false

jobs:
  maintain:
    if: inputs.confirm_review
    runs-on: ubuntu-latest
    environment: test
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      PRODUCTION_MIGRATION_THROUGH: ${{ inputs.migration_through }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/checkout-infra
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Load masked staging database contracts
        run: |
          set -euo pipefail
          tf_dir=.infra-config/terraform/ephemeral/test
          declare -A outputs=(
            [DATABASE_URL_OWNER]=postgres_owner_uri
            [DATABASE_URL_AUTH]=database_url_auth
            [DATABASE_URL_API]=database_url_api
            [DATABASE_URL_SHOP]=database_url_shop
            [DATABASE_URL_WORKER]=database_url_worker
            [OIDC_CLIENT_SECRET_LAX_BID_WEB]=oidc_bid_web_client_secret
            [OIDC_CLIENT_SECRET_LAX_SHOP_WEB]=oidc_shop_web_client_secret
          )
          for env_name in "${!outputs[@]}"; do
            value="$(terraform -chdir="$tf_dir" output -raw "${outputs[$env_name]}")"
            test -n "$value"
            echo "::add-mask::$value"
            echo "$env_name=$value" >> "$GITHUB_ENV"
          done
          database_ca_cert="$(terraform -chdir="$tf_dir" output -raw database_ca_certificate)"
          test -n "$database_ca_cert"
          {
            echo 'DATABASE_CA_CERT<<__DATABASE_CA_CERT__'
            printf '%s\n' "$database_ca_cert"
            echo '__DATABASE_CA_CERT__'
          } >> "$GITHUB_ENV"
      - name: Derive masked role passwords from application URLs
        run: |
          set -euo pipefail
          while read -r password_name url_name; do
            url="${!url_name}"
            password="$(
              node -e \
                'process.stdout.write(decodeURIComponent(new URL(process.argv[1]).password))' \
                "$url"
            )"
            test -n "$password"
            echo "::add-mask::$password"
            echo "$password_name=$password" >> "$GITHUB_ENV"
          done <<'ROLES'
          AUTH_APP_DB_PASSWORD DATABASE_URL_AUTH
          API_APP_DB_PASSWORD DATABASE_URL_API
          SHOP_APP_DB_PASSWORD DATABASE_URL_SHOP
          WORKER_APP_DB_PASSWORD DATABASE_URL_WORKER
          ROLES
      - name: Build database dependency closure
        run: pnpm --filter @auction/db... build
      - name: Apply reviewed production migration ceiling
        env:
          APP_ENV: test
          NODE_ENV: production
        run: |
          pnpm --filter @auction/db db:report-user-read-cutover
          pnpm --filter @auction/db db:migrate:prod
          pnpm --filter @auction/db db:configure-oidc-clients
          pnpm --filter @auction/db db:report-user-read-cutover
      - name: Verify database role contracts
        env:
          AUTH_ROLE_CONTRACT_REQUIRED: "true"
        run: |
          pnpm --filter @auction/db test:auth-role-contract
          pnpm --filter @auction/db test:api-role-contract
          pnpm --filter @auction/db test:shop-role-contract
          pnpm --filter @auction/db test:worker-role-contract
