name: Terraform test up
on:
  workflow_dispatch:
    inputs:
      infra_ref:
        description: auction-infra branch, tag, or commit
        type: string
        required: false
        default: main
      identity_sha:
        description: Approved standalone Identity commit for ephemeral image deploys
        type: string
        required: false
      identity_digest:
        description: Approved lax-test-identity digest for ephemeral image deploys
        type: string
        required: false
      shop_identity_sha:
        description: Approved Shop Identity commit for ephemeral image deploys
        type: string
        required: false
      shop_identity_digest:
        description: Approved lax-test-shop-identity digest for ephemeral image deploys
        type: string
        required: false
      shop_sha:
        description: Approved Shop storefront commit for ephemeral image deploys
        type: string
        required: false
      shop_digest:
        description: Approved lax-test-shop digest for ephemeral image deploys
        type: string
        required: false
concurrency:
  group: app-deploy-test
  cancel-in-progress: false
jobs:
  up:
    runs-on: ubuntu-latest
    environment: test
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      TF_VAR_check_in_token_secret: ${{ secrets.CHECK_IN_TOKEN_SECRET }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_spaces_access_key_id: ${{ secrets.MEDIA_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_access_key: ${{ secrets.MEDIA_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_postmark_server_token: ${{ secrets.POSTMARK_SERVER_TOKEN }}
      TF_VAR_postmark_webhook_basic_auth: ${{ secrets.POSTMARK_WEBHOOK_BASIC_AUTH }}
      TF_VAR_email_unsubscribe_secret: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
      TF_VAR_zoho_campaigns_api_key: ${{ secrets.ZOHO_CAMPAIGNS_API_KEY }}
      TF_VAR_zoho_campaigns_list_key: ${{ secrets.ZOHO_CAMPAIGNS_LIST_KEY }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
      TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
      TF_VAR_veriff_api_key: ${{ secrets.VERIFF_API_KEY }}
      TF_VAR_veriff_shared_secret: ${{ secrets.VERIFF_SHARED_SECRET }}
      TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TF_VAR_twilio_verify_service_sid: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
      TF_VAR_twilio_api_key_sid: ${{ secrets.TWILIO_API_KEY_SID }}
      TF_VAR_twilio_api_key_secret: ${{ secrets.TWILIO_API_KEY_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
      TF_VAR_stripe_transfers_webhook_secret: ${{ secrets.STRIPE_TRANSFERS_WEBHOOK_SECRET }}
      TF_VAR_stripe_payments_webhook_secret: ${{ secrets.STRIPE_PAYMENTS_WEBHOOK_SECRET }}
      TF_VAR_cron_internal_secret: ${{ secrets.CRON_INTERNAL_SECRET }}
      TF_VAR_ops_support_email: ${{ secrets.OPS_SUPPORT_EMAIL }}
      TF_VAR_ops_oncall_email: ${{ secrets.OPS_ONCALL_EMAIL }}
      TF_VAR_admin_email_address: ${{ secrets.ADMIN_EMAIL_ADDRESS }}
      TF_VAR_xero_client_id: ${{ secrets.XERO_CLIENT_ID }}
      TF_VAR_xero_client_secret: ${{ secrets.XERO_CLIENT_SECRET }}
      TF_VAR_xero_redirect_uri: ${{ secrets.XERO_REDIRECT_URI }}
      TF_VAR_xero_webhook_key: ${{ secrets.XERO_WEBHOOK_KEY }}
      TF_VAR_xero_post_connect_web_redirect: ${{ secrets.XERO_POST_CONNECT_WEB_REDIRECT }}
      TF_VAR_auth_dek_key: ${{ secrets.AUTH_DEK_KEY }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TF_VAR_turnstile_site_key: ${{ secrets.TURNSTILE_SITE_KEY }}
      TF_VAR_verify_origin: "true"
      TF_VAR_csp_enforce: "0"
      TF_VAR_next_public_csp_report_uri: ${{ secrets.NEXT_PUBLIC_CSP_REPORT_URI }}
      TF_VAR_strict_bid_eligibility_enabled: ${{ vars.STRICT_BID_ELIGIBILITY_ENABLED || 'true' }}
      TF_VAR_kyc_onboarding_enabled: ${{ vars.KYC_ONBOARDING_ENABLED || 'false' }}
      TF_VAR_full_buyer_onboarding_enabled: ${{ vars.FULL_BUYER_ONBOARDING_ENABLED || 'false' }}
      TF_VAR_marketing_prompts_enabled: ${{ vars.MARKETING_PROMPTS_ENABLED || 'false' }}
      TF_VAR_app_deploy_source: ${{ vars.APP_DEPLOY_SOURCE_TEST || 'github' }}
      TF_VAR_enable_auth_ssf_delivery: ${{ vars.ENABLE_AUTH_SSF_DELIVERY_TEST || 'false' }}
      TF_VAR_identity_image_tag: ${{ inputs.identity_sha }}
      TF_VAR_shop_identity_image_tag: ${{ inputs.shop_identity_sha }}
      TF_VAR_shop_image_tag: ${{ inputs.shop_sha }}
      APP_ID: ${{ secrets.DO_TEST_APP_ID }}
      DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
      JWKS_SNAPSHOT_KEY_TEST: ${{ secrets.JWKS_SNAPSHOT_KEY_TEST }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-infra
        with:
          ref: ${{ inputs.infra_ref }}
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Cloudflare zone access before ephemeral apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/verify-cloudflare-zone-access.mjs
      - name: Verify Auth Terraform environment contract
        run: node scripts/ci/verify-auth-terraform-env.mjs .infra-config/terraform/ephemeral/test/main.tf
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Require approved Identity and Shop image contracts before ephemeral apply
        if: vars.APP_DEPLOY_SOURCE_TEST == 'image'
        env:
          IDENTITY_SHA: ${{ inputs.identity_sha }}
          IDENTITY_DIGEST: ${{ inputs.identity_digest }}
          SHOP_IDENTITY_SHA: ${{ inputs.shop_identity_sha }}
          SHOP_IDENTITY_DIGEST: ${{ inputs.shop_identity_digest }}
          SHOP_SHA: ${{ inputs.shop_sha }}
          SHOP_DIGEST: ${{ inputs.shop_digest }}
          DOCR_REGISTRY: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}
        run: |
          doctl registry login --expiry-seconds 900
          node scripts/ci/verify-staging-image-contract.mjs
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          state-key: ephemeral-test
          verify-plan-safe: "true"
          app-id: ${{ env.APP_ID }}
          allowed-delete-addresses: >-
            ["module.postgres_rbac.postgresql_default_privileges.app_tables[\"shop_app\"]",
            "module.postgres_rbac.postgresql_default_privileges.app_sequences[\"shop_app\"]"]
      - name: Require Shop DNS, TLS, and readiness after apply
        env:
          EXPECTED_SHOP_SHA: ${{ inputs.shop_sha }}
          EXPECTED_SHOP_IDENTITY_SHA: ${{ inputs.shop_identity_sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            body="$(
              curl --fail --silent --show-error --max-time 10 \
                https://test-shop.lax.bid/health/ready || true
            )"
            status="$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)"
            shop_release="$(jq -r '.release // empty' <<<"$body" 2>/dev/null || true)"
            identity_release="$(
              jq -r '.dependencies.shopIdentity.release // empty' <<<"$body" 2>/dev/null || true
            )"
            if test "$status" = "ok" &&
              { test -z "$EXPECTED_SHOP_SHA" || test "$shop_release" = "$EXPECTED_SHOP_SHA"; } &&
              { test -z "$EXPECTED_SHOP_IDENTITY_SHA" ||
                test "$identity_release" = "$EXPECTED_SHOP_IDENTITY_SHA"; }; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Shop readiness/release contract did not converge"
          exit 1
      - name: Prove Identity readiness after ephemeral traffic change
        if: inputs.identity_sha != ''
        env:
          EXPECTED_IDENTITY_SHA: ${{ inputs.identity_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_IDENTITY_SHA" =~ ^[0-9a-f]{40}$ ]]
          for _ in $(seq 1 30); do
            body="$(curl --fail --silent https://test-auth.lax.bid/health/ready || true)"
            if test "$(jq -r '.release // empty' <<<"$body")" = "$EXPECTED_IDENTITY_SHA"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Identity release did not match the pinned immutable tag"
          exit 1
      - run: pnpm tsx scripts/jwks-restore.ts test
      - run: pnpm db:seed
      - run: |
          curl --fail https://test.lax.bid/
          curl --fail https://test-api.lax.bid/health/ready
          curl --fail https://test-auth.lax.bid/health/ready
          curl --fail https://test-ws.lax.bid/health/ready
