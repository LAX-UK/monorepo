name: Build images

# Builds the prebuilt App Platform component images in GitHub Actions (with a
# persistent BuildKit layer cache) and pushes them to DigitalOcean Container
# Registry. App Platform then only PULLS these images instead of building from
# source, which is the bulk of the ~30 min deploy time.
#
# Scope: api, auth, ws, worker, migrate. `web` is intentionally NOT built here —
# it bakes NEXT_PUBLIC_* values at build time from the App Platform spec, so it
# stays a DO github-source build (see the web component's deploy_source = "github"
# in infra/terraform/ephemeral/<env>/main.tf).
#
# Each image is pushed with two tags:
#   - <environment>  (rolling tag the Terraform app spec pins to; the deploy step
#                     `doctl apps create-deployment` always pulls the current tag)
#   - <git_sha>      (immutable, for traceability / manual rollback)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      git_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [test, prod]
      git_sha:
        description: Image SHA tag (defaults to workflow SHA)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: auth
            dockerfile: apps/auth/Dockerfile
          - component: ws
            dockerfile: apps/ws/Dockerfile
          - component: worker
            dockerfile: apps/worker/Dockerfile
          - component: migrate
            dockerfile: docker/migrate.Dockerfile
    env:
      # Account-level DOCR registry name (registry.digitalocean.com/<name>).
      # Set as a repository or environment variable. Terraform output:
      # `terraform -chdir=infra/terraform/persistent/prod output container_registry_name`.
      REGISTRY: ${{ vars.DOCR_REGISTRY }}
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.git_sha || github.sha }}
    steps:
      - name: Validate registry configured
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "::error::vars.DOCR_REGISTRY is not set. Create the DOCR registry (infra/terraform/persistent/prod) and set the DOCR_REGISTRY variable before enabling prebuilt images."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}:${{ env.ENVIRONMENT }}
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}
