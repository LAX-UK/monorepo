name: Build images

# Builds the prebuilt App Platform component images in GitHub Actions (with a
# persistent BuildKit layer cache) and pushes them to DigitalOcean Container
# Registry. App Platform then only PULLS these images instead of building from
# source, which is the bulk of the ~30 min deploy time.
#
# Scope: api, auth, ws, worker, migrate, web. `web` bakes NEXT_PUBLIC_* at build
# time, so its build args come from infra/web-build/<env>.env (public values) plus
# GitHub env vars/secrets (GTM, Turnstile site key) — see the "Compose web build
# args" step below.
#
# Each image is pushed with two tags:
#   - <environment>  (rolling tag the Terraform app spec pins to; the deploy step
#                     `doctl apps create-deployment` always pulls the current tag)
#   - <git_sha>      (immutable, for traceability / manual rollback)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      git_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [test, prod]
      git_sha:
        description: Image SHA tag (defaults to workflow SHA)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: auth
            dockerfile: apps/auth/Dockerfile
          - component: ws
            dockerfile: apps/ws/Dockerfile
          - component: worker
            dockerfile: apps/worker/Dockerfile
          - component: migrate
            dockerfile: docker/migrate.Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    env:
      # Account-level DOCR registry name (registry.digitalocean.com/<name>).
      # Set as a repository or environment variable. Terraform output:
      # `terraform -chdir=infra/terraform/persistent/prod output container_registry_name`.
      REGISTRY: ${{ vars.DOCR_REGISTRY }}
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.git_sha || github.sha }}
    steps:
      - name: Validate registry configured
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "::error::vars.DOCR_REGISTRY is not set. Create the DOCR registry (infra/terraform/persistent/prod) and set the DOCR_REGISTRY variable before enabling prebuilt images."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Guard: the baked NEXT_PUBLIC_WEB_ORIGIN must match the Terraform local for
      # this env. A mismatch silently rebakes the wrong canonical/robots origin
      # (the noindex bug) into the image, so fail the build instead.
      - name: Verify web origin matches Terraform
        if: matrix.component == 'web'
        run: |
          set -euo pipefail
          ENV_FILE="infra/web-build/${ENVIRONMENT}.env"
          TF_FILE="infra/terraform/ephemeral/${ENVIRONMENT}/main.tf"
          env_origin="$(grep -E '^NEXT_PUBLIC_WEB_ORIGIN=' "$ENV_FILE" | head -n1 | cut -d= -f2-)"
          tf_origin="$(grep -E '^[[:space:]]*web_origin[[:space:]]*=' "$TF_FILE" | head -n1 | sed -E 's/.*"([^"]*)".*/\1/')"
          if [ -z "$env_origin" ] || [ -z "$tf_origin" ]; then
            echo "::error::Could not read web origin from $ENV_FILE ('$env_origin') or $TF_FILE ('$tf_origin')"
            exit 1
          fi
          if [ "$env_origin" != "$tf_origin" ]; then
            echo "::error::NEXT_PUBLIC_WEB_ORIGIN mismatch: $ENV_FILE='$env_origin' vs $TF_FILE web_origin='$tf_origin'"
            exit 1
          fi
          echo "web origin OK: $env_origin"

      # web bakes NEXT_PUBLIC_* at build time. Public values come from the committed
      # per-env file; GTM / consent / Turnstile site key come from GitHub env
      # vars/secrets. (Turnstile SITE key is public; the SECRET key is never passed.
      # SENTRY_AUTH_TOKEN is intentionally omitted to avoid leaking it into image
      # layers — web client sourcemaps are out of scope here.)
      - name: Compose web build args
        id: webargs
        if: matrix.component == 'web'
        run: |
          set -euo pipefail
          ENV_FILE="infra/web-build/${ENVIRONMENT}.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Missing web build args file $ENV_FILE"
            exit 1
          fi
          {
            echo 'args<<__BUILD_ARGS_EOF__'
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE"
            echo "NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}"
            echo "NEXT_PUBLIC_DISABLE_CONSENT_BANNER=${{ vars.NEXT_PUBLIC_DISABLE_CONSENT_BANNER }}"
            echo "NEXT_PUBLIC_CSP_REPORT_URI=${{ vars.NEXT_PUBLIC_CSP_REPORT_URI }}"
            echo "CSP_ENFORCE=${{ vars.CSP_ENFORCE }}"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}"
            echo "SENTRY_PROJECT=lax-${ENVIRONMENT}-web"
            echo '__BUILD_ARGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: ${{ steps.webargs.outputs.args }}
          tags: |
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}:${{ env.ENVIRONMENT }}
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}
