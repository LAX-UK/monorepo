name: Build images

# Builds the prebuilt App Platform component images in GitHub Actions (with a
# persistent BuildKit layer cache) and pushes them to DigitalOcean Container
# Registry. App Platform then only PULLS these images instead of building from
# source, which is the bulk of the ~30 min deploy time.
#
# Scope: api, auth, shop, shop-api, shop-identity, ws, worker, migrate, web, clamav. `web` bakes
# NEXT_PUBLIC_* at build time, so its public build args come from the private
# LAX-UK/auction-infra repository plus GitHub env vars/secrets.
#
# Each image is pushed with two tags:
#   - <environment>  (rolling tag the Terraform app spec pins to; the deploy step
#                     `doctl apps create-deployment` always pulls the current tag)
#   - <git_sha>      (immutable, for traceability / manual rollback)
#
# move_rolling_tag: false pushes the <git_sha> tag only. Use it to build images ahead of
# a cutover without changing what the running environment pulls on its next deploy.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      git_sha:
        type: string
        required: true
      components:
        description: JSON array of component names; empty builds all
        type: string
        required: false
        default: ""
      move_rolling_tag:
        description: Also point the <environment> tag at this build (false pushes the SHA tag only)
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [test, prod]
      git_sha:
        description: Image SHA tag (defaults to workflow SHA)
        type: string
        required: false
      move_rolling_tag:
        description: Also point the <environment> tag at this build (false pushes the SHA tag only)
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          COMPONENTS_JSON: ${{ inputs.components }}
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/build-images-matrix.mjs)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-push:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    env:
      # Account-level DOCR registry name (registry.digitalocean.com/<name>).
      # Set as a repository or environment variable. Terraform output:
      # Private infra repo: `terraform -chdir=terraform/persistent/prod output container_registry_name`.
      REGISTRY: ${{ vars.DOCR_REGISTRY }}
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.git_sha || github.sha }}
      INFRA_CONFIG_ROOT: ${{ github.workspace }}/.infra-config
    steps:
      - name: Validate registry configured
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "::error::vars.DOCR_REGISTRY is not set. Create the registry from LAX-UK/auction-infra and set the DOCR_REGISTRY variable."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Create read-only infra token
        if: matrix.component == 'web'
        id: infra-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
          owner: LAX-UK
          repositories: auction-infra

      - name: Check out web build configuration
        if: matrix.component == 'web'
        uses: actions/checkout@v4
        with:
          repository: LAX-UK/auction-infra
          ref: main
          token: ${{ steps.infra-token.outputs.token }}
          sparse-checkout: web-build
          path: .infra-config
          persist-credentials: false

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          version: 2.0.0
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx (Public ECR)
        id: buildx_ecr
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx (Docker Hub fallback)
        if: steps.buildx_ecr.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      # Web build compiles Next.js + Sentry source maps; add swap so BuildKit does not OOM (exit 137).
      - name: Add swap for web build
        if: matrix.component == 'web'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compose web build args
        id: webargs
        if: matrix.component == 'web'
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SENTRY_RELEASE: ${{ env.SHA }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_MARKETING_ATTRIBUTION_ENABLED: ${{ vars.NEXT_PUBLIC_MARKETING_ATTRIBUTION_ENABLED || 'false' }}
          NEXT_PUBLIC_CSP_REPORT_URI: ${{ vars.NEXT_PUBLIC_CSP_REPORT_URI }}
          CSP_ENFORCE: ${{ vars.CSP_ENFORCE }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
        run: |
          chmod +x scripts/ci/web-build-args.sh
          {
            echo 'args<<__BUILD_ARGS_EOF__'
            ./scripts/ci/web-build-args.sh compose-args
            echo '__BUILD_ARGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            IMAGE_SHA=${{ env.SHA }}
            ${{ steps.webargs.outputs.args }}
            ${{ matrix.component == 'art' && format('NEXT_PUBLIC_SENTRY_DSN_ART={0}', secrets.SENTRY_DSN_ART) || '' }}
            ${{ matrix.component == 'art' && format('SENTRY_PROJECT=lax-{0}-art', env.ENVIRONMENT) || '' }}
            ${{ matrix.component == 'art' && format('SENTRY_RELEASE={0}', env.SHA) || '' }}
            ${{ matrix.component == 'shop' && format('NEXT_PUBLIC_SENTRY_DSN_SHOP={0}', secrets.SENTRY_DSN_SHOP) || '' }}
            ${{ matrix.component == 'shop' && format('SENTRY_PROJECT=lax-{0}-shop', env.ENVIRONMENT) || '' }}
            ${{ matrix.component == 'shop' && format('SENTRY_RELEASE={0}', env.SHA) || '' }}
            ${{ matrix.component == 'shop' && format('SHOP_DEPLOY_ENV={0}', env.ENVIRONMENT) || '' }}
            ${{ matrix.component == 'art' && format('ART_DEPLOY_ENV={0}', env.ENVIRONMENT) || '' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}:${{ env.SHA }}
            ${{ inputs.move_rolling_tag != false && !contains(fromJSON('["shop-identity","shop","shop-api","shop-admin","account","art"]'), matrix.component) && format('registry.digitalocean.com/{0}/lax-{1}-{2}:{1}', env.REGISTRY, env.ENVIRONMENT, matrix.component) || '' }}
          cache-from: type=gha,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}

      # DOCR occasionally accepts the second tag of a multi-tag push without moving it, leaving the
      # rolling tag on the previous build. Terraform's pin check then refuses to apply. Point the
      # rolling tag at this build's digest explicitly and verify it, without rebuilding.
      - name: Point the rolling tag at this build
        if: ${{ inputs.move_rolling_tag != false && !contains(fromJSON('["shop-identity","shop","shop-api","shop-admin","account","art"]'), matrix.component) }}
        env:
          REPO: registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}
        run: |
          set -euo pipefail
          doctl registry login --expiry-seconds 600
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          want="$(digest_of "${REPO}:${SHA}")"
          for attempt in 1 2 3 4 5; do
            have="$(digest_of "${REPO}:${ENVIRONMENT}" || true)"
            if [[ "$have" == "$want" ]]; then
              echo "${ENVIRONMENT} -> ${want}"
              exit 0
            fi
            echo "${ENVIRONMENT} is ${have:-missing}, expected ${want}; re-pointing (attempt ${attempt})"
            docker buildx imagetools create --tag "${REPO}:${ENVIRONMENT}" "${REPO}@${want}"
            sleep 10
          done
          echo "::error::${REPO}:${ENVIRONMENT} still does not match ${SHA} (${want})"
          exit 1

  release-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ${{ vars.DOCR_REGISTRY }}
      ENVIRONMENT: ${{ inputs.environment }}
      GIT_SHA: ${{ inputs.git_sha || github.sha }}
      COMPONENTS_JSON: ${{ inputs.components }}
      RELEASE_COMPONENTS: api,auth,shop-identity,shop,shop-api,shop-admin,account,art,ws,worker,migrate,web,clamav
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha || github.sha }}
      - uses: digitalocean/action-doctl@v2
        with:
          version: 2.0.0
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - run: doctl registry login --expiry-seconds 1200
      - name: Write release manifest
        run: |
          set -euo pipefail
          if [ -n "${COMPONENTS_JSON}" ]; then
            export RELEASE_COMPONENTS="$(
              node -e '
                const raw = process.env.COMPONENTS_JSON ?? "";
                const list = JSON.parse(raw);
                if (!Array.isArray(list) || list.length === 0) {
                  throw new Error("COMPONENTS_JSON must be a non-empty JSON array");
                }
                process.stdout.write(list.join(","));
              '
            )"
          fi
          node scripts/ci/write-release-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ inputs.environment }}-${{ inputs.git_sha || github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

  build-push-event:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      REGISTRY: ${{ vars.DOCR_REGISTRY }}
      ENVIRONMENT: prod
      SHA: ${{ inputs.git_sha || github.sha }}
    steps:
      - name: Validate registry configured
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "::error::vars.DOCR_REGISTRY is not set. Create the registry from LAX-UK/auction-infra and set the DOCR_REGISTRY variable."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha || github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          version: 2.0.0
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx (Public ECR)
        id: buildx_ecr_event
        continue-on-error: true
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx (Docker Hub fallback)
        if: steps.buildx_ecr_event.outcome == 'failure'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Build and push event
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/event/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VITE_API_BASE=https://api.lax.bid
            VITE_WEB_ORIGIN=https://lax.bid
            VITE_EVENT_ORIGIN=https://event.lax.bid
            VITE_CDN_BASE=https://cdn.lax.bid
          tags: |
            ${{ inputs.move_rolling_tag != false && format('registry.digitalocean.com/{0}/lax-{1}-event:{1}', env.REGISTRY, env.ENVIRONMENT) || '' }}
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-event:${{ env.SHA }}
          cache-from: type=gha,scope=${{ env.ENVIRONMENT }}-event
          cache-to: type=gha,mode=max,scope=${{ env.ENVIRONMENT }}-event
