name: Build images

# Builds the prebuilt App Platform component images in GitHub Actions (with a
# persistent BuildKit layer cache) and pushes them to DigitalOcean Container
# Registry. App Platform then only PULLS these images instead of building from
# source, which is the bulk of the ~30 min deploy time.
#
# Scope: api, auth, ws, worker, migrate, web, event (prod only). `web` bakes
# NEXT_PUBLIC_* at build time, so its build args come from infra/web-build/<env>.env
# (public values) plus GitHub env vars/secrets (GTM, Turnstile site key, Sentry
# client DSN) — see scripts/ci/web-build-args.sh and infra/web-build/README.md.
#
# Each image is pushed with two tags:
#   - <environment>  (rolling tag the Terraform app spec pins to; the deploy step
#                     `doctl apps create-deployment` always pulls the current tag)
#   - <git_sha>      (immutable, for traceability / manual rollback)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      git_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [test, prod]
      git_sha:
        description: Image SHA tag (defaults to workflow SHA)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
          - component: auth
            dockerfile: apps/auth/Dockerfile
          - component: ws
            dockerfile: apps/ws/Dockerfile
          - component: worker
            dockerfile: apps/worker/Dockerfile
          - component: migrate
            dockerfile: docker/migrate.Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    env:
      # Account-level DOCR registry name (registry.digitalocean.com/<name>).
      # Set as a repository or environment variable. Terraform output:
      # `terraform -chdir=infra/terraform/persistent/prod output container_registry_name`.
      REGISTRY: ${{ vars.DOCR_REGISTRY }}
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.git_sha || github.sha }}
    steps:
      - name: Validate registry configured
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "::error::vars.DOCR_REGISTRY is not set. Create the DOCR registry (infra/terraform/persistent/prod) and set the DOCR_REGISTRY variable before enabling prebuilt images."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Guard + compose build args for web (see scripts/ci/web-build-args.sh and
      # infra/web-build/README.md).
      - name: Verify web origin matches Terraform
        if: matrix.component == 'web'
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          chmod +x scripts/ci/web-build-args.sh
          ./scripts/ci/web-build-args.sh verify-origin

      - name: Compose web build args
        id: webargs
        if: matrix.component == 'web'
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          SENTRY_RELEASE: ${{ env.SHA }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_CSP_REPORT_URI: ${{ vars.NEXT_PUBLIC_CSP_REPORT_URI }}
          CSP_ENFORCE: ${{ vars.CSP_ENFORCE }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
        run: |
          chmod +x scripts/ci/web-build-args.sh
          {
            echo 'args<<__BUILD_ARGS_EOF__'
            ./scripts/ci/web-build-args.sh compose-args
            echo '__BUILD_ARGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: ${{ steps.webargs.outputs.args }}
          tags: |
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}:${{ env.ENVIRONMENT }}
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-${{ matrix.component }}:${{ env.SHA }}
          cache-from: type=gha,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ env.ENVIRONMENT }}-${{ matrix.component }}

  build-push-event:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    env:
      REGISTRY: ${{ vars.DOCR_REGISTRY }}
      ENVIRONMENT: prod
      SHA: ${{ inputs.git_sha || github.sha }}
    steps:
      - name: Validate registry configured
        run: |
          if [ -z "${REGISTRY}" ]; then
            echo "::error::vars.DOCR_REGISTRY is not set. Create the DOCR registry (infra/terraform/persistent/prod) and set the DOCR_REGISTRY variable before enabling prebuilt images."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push event
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/event/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VITE_API_BASE=https://api.lax.bid
            VITE_WEB_ORIGIN=https://lax.bid
            VITE_EVENT_ORIGIN=https://event.lax.bid
            VITE_CDN_BASE=https://cdn.lax.bid
          tags: |
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-event:${{ env.ENVIRONMENT }}
            registry.digitalocean.com/${{ env.REGISTRY }}/lax-${{ env.ENVIRONMENT }}-event:${{ env.SHA }}
          cache-from: type=gha,scope=${{ env.ENVIRONMENT }}-event
          cache-to: type=gha,mode=max,scope=${{ env.ENVIRONMENT }}-event
