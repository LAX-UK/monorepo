name: Shop staging acceptance

on:
  workflow_call:
    inputs:
      shop_sha:
        type: string
        required: true
      shop_api_sha:
        type: string
        required: false
        default: ""
      seed_catalogue:
        type: boolean
        required: false
        default: false
      parent_holds_deploy_lock:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      shop_sha:
        description: Deployed Shop storefront commit SHA (must match /health/ready release)
        required: true
        type: string
      seed_catalogue:
        description: >-
          Run foundation catalogue seed (destructive: re-sold-outs reed-study editions).
          Only enable on disposable staging data.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      inputs.parent_holds_deploy_lock &&
      format('staging-recovery-child-{0}-shop', github.run_id) ||
      'app-deploy-test'
    }}
  cancel-in-progress: false

jobs:
  commerce-contracts:
    runs-on: ubuntu-latest
    environment: test
    env:
      SHOP_SHA: ${{ inputs.shop_sha }}
      SHOP_API_SHA: ${{ inputs.shop_api_sha != '' && inputs.shop_api_sha || inputs.shop_sha }}
      SHOP_STOREFRONT_URL: https://test-shop.lax.bid
      AUTH_BASE_URL: https://test-auth.lax.bid
      SHOP_IDENTITY_BASE_URL: https://test-shop.lax.bid
      PLAYWRIGHT_BASE_URL: https://test-shop.lax.bid
      PLAYWRIGHT_E2E: "1"
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      SHOP_OIDC_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
      SHOP_OIDC_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.shop_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deployed Shop release
        run: |
          set -euo pipefail
          [[ "$SHOP_SHA" =~ ^[0-9a-f]{40}$ ]]
          for attempt in $(seq 1 30); do
            if body="$(curl --fail --silent --max-time 30 "$SHOP_STOREFRONT_URL/health/ready" 2>/dev/null)"; then
              if echo "$body" | jq -e \
                '.status == "ok"
                  and (.dependencies.shopIdentity.status == "ok")
                  and (.dependencies.shopApi.status == "ok")' \
                >/dev/null; then
                release="$(echo "$body" | jq -r '.release // empty')"
                identity_release="$(echo "$body" | jq -r '.dependencies.shopIdentity.release // empty')"
                shop_api_release="$(echo "$body" | jq -r '.dependencies.shopApi.release // empty')"
                if test "$release" = "$SHOP_SHA" \
                  && test "$identity_release" = "$SHOP_SHA" \
                  && test "$shop_api_release" = "$SHOP_API_SHA"; then
                  echo "Shop release pinned: storefront=$release identity=$identity_release shop-api=$shop_api_release"
                  exit 0
                fi
                echo "Attempt ${attempt}: storefront=${release:-unknown} identity=${identity_release:-unknown} shop-api=${shop_api_release:-unknown}; want storefront/identity=$SHOP_SHA shop-api=$SHOP_API_SHA"
              else
                echo "Attempt ${attempt}: health/ready status not ok"
              fi
            else
              echo "Attempt ${attempt}: health/ready unreachable"
            fi
            sleep 10
          done
          echo "::error::Shop /health/ready never reported release $SHOP_SHA"
          exit 1
      - name: Shop Stripe webhook route is wired
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$SHOP_STOREFRONT_URL/webhooks/stripe")"
          test "$code" != "404"
          test "$code" = "400"
      - name: Require acceptance credentials for catalogue fixtures
        if: inputs.seed_catalogue
        run: |
          set -euo pipefail
          test -n "${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}" || {
            echo "::error::IDENTITY_ACCEPTANCE_EMAIL must be configured on the test environment"
            exit 1
          }
          test -n "${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}" || {
            echo "::error::IDENTITY_ACCEPTANCE_PASSWORD must be configured on the test environment"
            exit 1
          }
      - uses: ./.github/actions/checkout-infra
        if: inputs.seed_catalogue
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        if: inputs.seed_catalogue
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Load Shop database contract from Terraform state
        if: inputs.seed_catalogue
        run: |
          set -euo pipefail
          database_url_shop="$(
            terraform -chdir=.infra-config/terraform/ephemeral/test output -raw database_url_shop
          )"
          test -n "$database_url_shop"
          echo "::add-mask::$database_url_shop"
          echo "DATABASE_URL_SHOP=$database_url_shop" >> "$GITHUB_ENV"
          database_url_owner="$(
            terraform -chdir=.infra-config/terraform/ephemeral/test output -raw postgres_owner_uri
          )"
          test -n "$database_url_owner"
          echo "::add-mask::$database_url_owner"
          echo "DATABASE_URL_OWNER=$database_url_owner" >> "$GITHUB_ENV"
          database_ca_cert="$(
            terraform -chdir=.infra-config/terraform/ephemeral/test \
              output -raw database_ca_certificate
          )"
          test -n "$database_ca_cert"
          database_ca_path="$RUNNER_TEMP/staging-postgres-ca.crt"
          printf '%s\n' "$database_ca_cert" > "$database_ca_path"
          chmod 0600 "$database_ca_path"
          echo "NODE_EXTRA_CA_CERTS=$database_ca_path" >> "$GITHUB_ENV"
      - name: Seed foundation catalogue (opt-in)
        if: inputs.seed_catalogue
        run: |
          set -euo pipefail
          echo "::warning::Catalogue seed may mark reed-study editions sold; use only on disposable staging data."
          pnpm --filter @auction/shop-api... build
          pnpm --filter @auction/shop-api seed:catalogue
      - name: Seed acceptance portal fixtures (opt-in)
        if: inputs.seed_catalogue
        env:
          SHOP_OIDC_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
          IDENTITY_ACCEPTANCE_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
        run: |
          set -euo pipefail
          subject="$(node scripts/ci/resolve-shop-acceptance-portal-subject.mjs)"
          test -n "$subject"
          echo "SHOP_ACCEPTANCE_PORTAL_SUBJECT_ID=$subject" >> "$GITHUB_ENV"
          SHOP_ACCEPTANCE_PORTAL_SUBJECT_ID="$subject" pnpm --filter @auction/shop-api seed:acceptance-portal
          pnpm --filter @auction/shop-api seed:acceptance-commerce
      - name: Install pinned Chromium
        run: pnpm --filter @auction/shop exec playwright install chromium --with-deps
      - name: Require acceptance credentials for portal smoke
        run: |
          set -euo pipefail
          test -n "${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}" || {
            echo "::error::IDENTITY_ACCEPTANCE_EMAIL must be configured on the test environment"
            exit 1
          }
          test -n "${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}" || {
            echo "::error::IDENTITY_ACCEPTANCE_PASSWORD must be configured on the test environment"
            exit 1
          }
      - name: Shop browser tier 1 (light/dark, viewport)
        run: |
          pnpm --filter @auction/shop exec playwright test \
            e2e/theme-audit.spec.ts \
            e2e/shop-viewport-audit.spec.ts \
            e2e/home.spec.ts --grep "visible without JavaScript|theme"
      - name: Shop browser tier 1 (auth contracts)
        env:
          SHOP_OIDC_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
          SHOP_OIDC_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
        run: |
          pnpm --filter @auction/shop exec playwright test \
            e2e/first-login.spec.ts \
            e2e/hosted-auth.spec.ts \
            --project=chromium-desktop
      - name: Shop V1 phase 1 portal smoke
        env:
          SHOP_PORTAL_OWNERSHIP_ENABLED: "true"
          SHOP_ACCEPTANCE_PORTAL_SEEDED: ${{ inputs.seed_catalogue && 'true' || '' }}
          SHOP_ACCEPTANCE_OWNED_ARTWORK_TITLE: ${{ vars.SHOP_ACCEPTANCE_OWNED_ARTWORK_TITLE || 'Vessel Study' }}
          SHOP_OIDC_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
          SHOP_OIDC_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
        run: pnpm --filter @auction/shop exec playwright test e2e/shop-v1-phase1.spec.ts
      - name: Phase flags (manual enable on staging)
        run: |
          echo "Shop V1 later phases: set SHOP_PAYOUTS_ENABLED, SHOP_THIRD_PARTY_ENABLED,"
          echo "SHOP_ORIGINALS_ENABLED, SHOP_MERCHANDISE_ENABLED on shop-api per"
          echo "docs/runbooks/shop-v1-phase-gates.md before running phase 2+ acceptance."
      - name: Shop browser tier 2 (foundation catalogue fixtures)
        if: inputs.seed_catalogue
        env:
          SHOP_STAGING_ACCEPTANCE_STRICT: "1"
          SHOP_OIDC_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
          SHOP_OIDC_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm --filter @auction/shop exec playwright test \
            e2e/home-catalogue.spec.ts \
            e2e/artwork-detail.spec.ts \
            e2e/catalogue-routes.spec.ts \
            e2e/artworks-filters.spec.ts \
            e2e/shop-basket-guest.spec.ts \
            e2e/buyer-flow.spec.ts \
            e2e/unavailable-notify-me.spec.ts \
            --project=chromium-desktop \
            --grep-invert "complete Stripe test checkout"
          node scripts/ci/assert-playwright-no-unexpected-skips.mjs
      - name: Shop Stripe test checkout (staging)
        if: inputs.seed_catalogue
        env:
          SHOP_STAGING_ACCEPTANCE_STRICT: "1"
          SHOP_E2E_STRIPE_CHECKOUT: "1"
          SHOP_OIDC_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
          SHOP_OIDC_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm --filter @auction/shop-api seed:acceptance-commerce
          pnpm --filter @auction/shop exec playwright test e2e/buyer-flow.spec.ts \
            --project=chromium-desktop \
            --grep "signed-in buyer can complete Stripe test checkout"
          node scripts/ci/assert-playwright-no-unexpected-skips.mjs
      - name: Retain Shop acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shop-staging-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/shop/playwright-report/
            apps/shop/test-results/
          if-no-files-found: warn
          retention-days: 14
