name: Sentry release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [test, prod]
      git_sha:
        description: Release identifier (defaults to workflow SHA)
        type: string
        required: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      git_sha:
        type: string
        required: true

permissions:
  contents: read

env:
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: lax-bid
  # lax-bid is hosted in the EU region; default US endpoint can 500 on release APIs.
  SENTRY_URL: https://de.sentry.io
  RELEASE: ${{ inputs.git_sha || github.sha }}
  ENV_SUFFIX: ${{ inputs.environment }}
  SENTRY_DEPLOY_ENV: ${{ inputs.environment == 'prod' && 'production' || 'test' }}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli
      - name: Create org release and associate all projects
        run: |
          set -euo pipefail
          prefix="lax-${ENV_SUFFIX}"
          sentry-cli releases new "$RELEASE" \
            -p "${prefix}-api" \
            -p "${prefix}-auth" \
            -p "${prefix}-ws" \
            -p "${prefix}-worker" \
            -p "${prefix}-web"
          sentry-cli releases set-commits "$RELEASE" --auto

  upload-node-sourcemaps:
    needs: prepare-release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sentry_app: api
            package: api
            app_dir: api
          - sentry_app: auth
            package: auth-app
            app_dir: auth
          - sentry_app: ws
            package: ws
            app_dir: ws
          - sentry_app: worker
            package: worker
            app_dir: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli
      - name: Build and upload Node source maps
        run: |
          set -euo pipefail
          project="lax-${ENV_SUFFIX}-${{ matrix.sentry_app }}"
          pnpm turbo run build --filter="@auction/${{ matrix.package }}..."
          sentry-cli sourcemaps inject "apps/${{ matrix.app_dir }}/dist"
          sentry-cli sourcemaps upload --release="$RELEASE" -p "$project" "apps/${{ matrix.app_dir }}/dist"

  finalize-release:
    needs: upload-node-sourcemaps
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli
      - name: Finalize release and record deploy
        run: |
          set -euo pipefail
          sentry-cli releases finalize "$RELEASE"
          sentry-cli releases deploys "$RELEASE" new -e "$SENTRY_DEPLOY_ENV"
