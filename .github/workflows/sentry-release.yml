name: Sentry release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [test, prod]
      git_sha:
        description: Release identifier (defaults to workflow SHA)
        type: string
        required: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      git_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: lax-bid
      SENTRY_URL: https://de.sentry.io
      RELEASE: ${{ inputs.git_sha || github.sha }}
      ENV_SUFFIX: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli@2.58.4
      - name: Verify Sentry auth
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is empty for environment '${{ inputs.environment }}'. Set the terraform-bot internal integration token on the repo and on GitHub environment secrets (see infra/terraform/BOOTSTRAP.md)."
            exit 1
          fi
          sentry-cli info >/tmp/sentry-info.txt 2>&1 || {
            cat /tmp/sentry-info.txt
            echo "::error::sentry-cli auth failed against ${SENTRY_URL}. Regenerate the terraform-bot token with Release: Admin and org:ci."
            exit 1
          }
      - name: Ensure org release exists
        env:
          SENTRY_LOG_LEVEL: info
        run: |
          set -euo pipefail

          if sentry-cli releases info "$RELEASE" >/dev/null 2>&1; then
            echo "Release ${RELEASE} already exists"
          else
            echo "Creating release ${RELEASE}"
            # Org-level release; per-project sourcemap uploads attach artifacts below.
            sentry-cli releases new "$RELEASE"
          fi

          # --auto requires GitHub repo integration and often 500s without it; explicit commit is safer.
          if ! sentry-cli releases set-commits "$RELEASE" \
            --commit "${GITHUB_REPOSITORY}@${RELEASE}" \
            --ignore-missing; then
            echo "::warning::set-commits failed; continuing without commit association"
          fi

  upload-node-sourcemaps:
    needs: ensure-release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: lax-bid
      SENTRY_URL: https://de.sentry.io
      RELEASE: ${{ inputs.git_sha || github.sha }}
      ENV_SUFFIX: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sentry_app: api
            package: api
            app_dir: api
          - sentry_app: auth
            package: auth-app
            app_dir: auth
          - sentry_app: ws
            package: ws
            app_dir: ws
          - sentry_app: worker
            package: worker
            app_dir: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli@2.58.4
      - name: Build and upload Node source maps
        env:
          SENTRY_LOG_LEVEL: info
        run: |
          set -euo pipefail
          project="lax-${ENV_SUFFIX}-${{ matrix.sentry_app }}"
          pnpm turbo run build --filter="@auction/${{ matrix.package }}..."
          sentry-cli sourcemaps inject "apps/${{ matrix.app_dir }}/dist"
          sentry-cli sourcemaps upload --release="$RELEASE" -p "$project" "apps/${{ matrix.app_dir }}/dist"

  finalize-release:
    needs: upload-node-sourcemaps
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: lax-bid
      SENTRY_URL: https://de.sentry.io
      RELEASE: ${{ inputs.git_sha || github.sha }}
      SENTRY_DEPLOY_ENV: ${{ inputs.environment == 'prod' && 'production' || 'test' }}
    steps:
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli@2.58.4
      - name: Finalize release and record deploy
        env:
          SENTRY_LOG_LEVEL: info
        run: |
          set -euo pipefail
          if ! sentry-cli releases finalize "$RELEASE"; then
            echo "::warning::finalize failed (release may already be finalized)"
          fi
          if ! sentry-cli releases deploys "$RELEASE" new -e "$SENTRY_DEPLOY_ENV"; then
            echo "::error::deploy record failed for release ${RELEASE}"
            exit 1
          fi
