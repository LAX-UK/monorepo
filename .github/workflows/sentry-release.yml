name: Sentry release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        options: [test, prod]
      git_sha:
        description: Release identifier (defaults to workflow SHA)
        type: string
        required: false
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      git_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: lax-bid
      RELEASE: ${{ inputs.git_sha || github.sha }}
      ENV_SUFFIX: ${{ inputs.environment }}
      SENTRY_DEPLOY_ENV: ${{ inputs.environment == 'prod' && 'production' || 'test' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sentry_app: api
            package: api
            app_dir: api
          - sentry_app: auth
            package: auth-app
            app_dir: auth
          - sentry_app: ws
            package: ws
            app_dir: ws
          - sentry_app: worker
            package: worker
            app_dir: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli
      - name: Create release and upload Node source maps
        run: |
          project="lax-${ENV_SUFFIX}-${{ matrix.sentry_app }}"
          sentry-cli releases new "$RELEASE" -p "$project"
          sentry-cli releases set-commits "$RELEASE" --auto
          pnpm turbo run build --filter="@auction/${{ matrix.package }}..."
          sentry-cli sourcemaps inject "apps/${{ matrix.app_dir }}/dist"
          sentry-cli sourcemaps upload --release="$RELEASE" -p "$project" "apps/${{ matrix.app_dir }}/dist"
          sentry-cli releases finalize "$RELEASE"
          sentry-cli releases deploys "$RELEASE" new -e "$SENTRY_DEPLOY_ENV"
  web-release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: lax-bid
      RELEASE: ${{ inputs.git_sha || github.sha }}
      ENV_SUFFIX: ${{ inputs.environment }}
      SENTRY_DEPLOY_ENV: ${{ inputs.environment == 'prod' && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Sentry CLI
        run: npm i -g @sentry/cli
      - name: Register web release (source maps uploaded at DO build)
        run: |
          project="lax-${ENV_SUFFIX}-web"
          sentry-cli releases new "$RELEASE" -p "$project"
          sentry-cli releases set-commits "$RELEASE" --auto
          sentry-cli releases finalize "$RELEASE"
          sentry-cli releases deploys "$RELEASE" new -e "$SENTRY_DEPLOY_ENV"
