name: CI

on:
  push:
    branches: [main, master, release]
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SSF_DELIVERY_ENABLED: "false"
  SSF_DELIVERY_TIMEOUT_MS: "5000"
  SSF_DELIVERY_MAX_ATTEMPTS: "8"
  TURBO_SCM_BASE: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_CACHE: ${{ github.event_name == 'merge_group' && 'local:rw' || (vars.TURBO_TEAM != '' && (github.event_name == 'pull_request' && 'local:rw,remote:r' || 'local:rw,remote:rw') || 'local:rw') }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turborepo remote cache
        if: vars.TURBO_TEAM != '' && github.event_name != 'merge_group'
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Biome root check
        run: pnpm exec biome check .

      - name: Queue registry lint
        run: node scripts/lint-queue-registry.mjs

      # OSS binary — avoids gitleaks/gitleaks-action@v2 org license requirement (GITLEAKS_LICENSE).
      - name: Gitleaks secret scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            log_opts="-1 $GITHUB_SHA"
          else
            log_opts="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
          ./gitleaks detect --source . --log-opts="$log_opts" --verbose --redact

      - name: UI guardrails
        run: pnpm lint:ui-guardrails

      - name: Admin capability drift
        run: pnpm lint:admin-capability-drift

      - name: Web guardrails
        run: pnpm lint:web-guardrails

      - name: Admin lib boundaries
        run: pnpm lint:lib-admin-boundaries

      - name: Staff UI guardrails
        run: pnpm lint:staff-legacy-shell && pnpm lint:staff-route-composition

      - name: E2E portfolio guard
        run: pnpm lint:e2e-portfolio

      - name: E2E tag guard
        run: pnpm lint:e2e-tags

      - name: Zod schema transform lint
        run: pnpm lint:z-schema-transform

      - name: Vitest mock hygiene
        run: pnpm lint:test-mocks

      - name: Lint
        run: pnpm turbo run lint --affected

      - name: Dependency graph (no circular)
        run: pnpm lint:deps

      - name: Package layer direction
        run: node scripts/check-layers.mjs && node scripts/check-shop-api-layers.mjs

      - name: Shop architecture and asset budgets
        run: pnpm ci:shop-architecture

      - name: Docker patchedDependencies context
        run: pnpm ci:docker-patches

      - name: Identity exit criteria
        run: pnpm ci:identity-exit-criteria

      - name: Build identity-contracts for CI script imports
        run: pnpm --filter @auction/identity-contracts build

      - name: CI script unit tests
        run: node --test scripts/ci/parse-docker-image-pin.test.mjs scripts/ci/verify-staging-migrate-contract.test.mjs scripts/ci/verify-auth-terraform-env.test.mjs scripts/ci/assert-app-platform-spec.test.mjs scripts/ci/identity-soak-gate-validation.test.mjs scripts/ci/identity-soak-window.test.mjs scripts/ci/verify-identity-boundary.test.mjs scripts/ci/verify-terraform-plan-safe.test.mjs scripts/ci/oidc-authorize-response.test.mjs scripts/ci/provision-identity-acceptance-users.test.mjs scripts/ci/staff-totp-at-rest-bootstrap.test.mjs scripts/ci/http-diagnostics.test.mjs scripts/ci/e2e-session-state.test.mjs scripts/ci/require-node-version.test.mjs scripts/ci/identity-recovery/manifest.test.mjs scripts/ci/identity-recovery/transition-policy.test.mjs scripts/ci/verify-reusable-workflow-permissions.test.mjs

      - name: Reusable workflow permission contracts
        run: node scripts/ci/verify-reusable-workflow-permissions.mjs

      - name: Actionlint workflow contracts
        run: |
          # 1.7.12+ aligns with GitHub's 25-input workflow_dispatch limit (see changelog 2025-12-04).
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.12
          ./actionlint -shellcheck=""

      - name: Identity lockfile determinism contracts
        run: node --test scripts/identity/identity-lockfile.test.mjs

      - name: API route DIP coverage
        run: node apps/api/scripts/check-route-dip-coverage.mjs

      - name: Typecheck
        run: pnpm turbo run typecheck --affected

  identity-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: identity_paths
        with:
          filters: |
            identity:
              - apps/auth/**
              - packages/auth/**
              - packages/identity-contracts/**
              - packages/identity-db/**
              - packages/observability/**
              - packages/config-ts/**
              - patches/**
              - scripts/identity/**
              - scripts/ci/prepare-identity-lockfile.mjs
              - scripts/ci/verify-identity-closure-sync.mjs
              - scripts/ci/verify-identity-extractability.mjs
              - scripts/check-layers.mjs
              - package.json
              - pnpm-lock.yaml

      - name: Skip (no Identity paths changed)
        if: steps.identity_paths.outputs.identity != 'true'
        run: echo "Identity portability checks skipped."

      - uses: pnpm/action-setup@v4
        if: steps.identity_paths.outputs.identity == 'true'

      - uses: actions/setup-node@v4
        if: steps.identity_paths.outputs.identity == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install deterministic history filter
        if: steps.identity_paths.outputs.identity == 'true'
        run: pipx install git-filter-repo==2.47.0

      - name: Install history secret scanner
        if: steps.identity_paths.outputs.identity == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          curl -sSLf https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz |
            tar -xz -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Verify Identity dependency closure
        if: steps.identity_paths.outputs.identity == 'true'
        run: pnpm ci:identity-extractability

      - name: Rehearse hermetic Identity extraction
        if: steps.identity_paths.outputs.identity == 'true'
        run: pnpm ci:identity-extraction-rehearsal
        env:
          IDENTITY_REHEARSAL_TMPDIR: ${{ runner.temp }}/identity-rehearsal

      - name: Upload Identity rehearsal diagnostics
        if: failure() && steps.identity_paths.outputs.identity == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: identity-rehearsal-diagnostics
          path: ${{ runner.temp }}/identity-rehearsal
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_SHOP: postgresql://shop_app:postgres@localhost:5432/auction_ci
      SHOP_APP_DB_PASSWORD: postgres
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for turbo affected
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main:main
          else
            git fetch origin "${{ github.event.merge_group.base_sha }}"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turborepo remote cache
        if: vars.TURBO_TEAM != '' && github.event_name != 'merge_group'
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate
      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles
      - name: Verify executable migration rollback pairs
        run: node scripts/ci/verify-migration-pairs.mjs

      - name: Identity boundary conformance
        run: pnpm ci:identity-boundary

      - name: Test affected packages (excluding web and api)
        # One package at a time: shared auction_ci Postgres (migrations, role grants, shop integration).
        run: pnpm turbo run test --affected --filter=!@auction/web --filter=!@auction/api --summarize --concurrency=1

      - name: Runtime ownership smoke gates
        run: pnpm --filter @auction/types build && pnpm --filter @auction/background-runtime build && node scripts/ci/run-runtime-ownership-smoke-gates.mjs

      - name: Domain event smoke gates
        run: node scripts/ci/run-domain-event-smoke-gates.mjs

      - name: Cutover readiness defaults
        run: node scripts/ci/verify-cutover-readiness.mjs

  web-vitest:
    name: web vitest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for turbo affected
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main:main
          else
            git fetch origin "${{ github.event.merge_group.base_sha }}"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turborepo remote cache
        if: vars.TURBO_TEAM != '' && github.event_name != 'merge_group'
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Vitest shard
        run: |
          set -euo pipefail
          pnpm turbo run test --affected --filter=@auction/web --dry-run=json > /tmp/affected.json
          if ! jq -e '.tasks[] | select(.taskId == "@auction/web#test")' /tmp/affected.json > /dev/null; then
            echo "Web tests not affected; skipping shard ${{ matrix.shard }}/4."
            exit 0
          fi
          pnpm turbo run build --filter=@auction/web^...
          pnpm --filter @auction/web exec vitest run --shard=${{ matrix.shard }}/4

  api-vitest:
    name: api vitest (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_SHOP: postgresql://shop_app:postgres@localhost:5432/auction_ci
      SHOP_APP_DB_PASSWORD: postgres
      REDIS_URL: redis://127.0.0.1:6379
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for turbo affected
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main:main
          else
            git fetch origin "${{ github.event.merge_group.base_sha }}"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turborepo remote cache
        if: vars.TURBO_TEAM != '' && github.event_name != 'merge_group'
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate
      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles

      - name: Vitest shard
        run: |
          set -euo pipefail
          pnpm turbo run test --affected --filter=@auction/api --dry-run=json > /tmp/affected.json
          if ! jq -e '.tasks[] | select(.taskId == "@auction/api#test")' /tmp/affected.json > /dev/null; then
            echo "API tests not affected; skipping shard ${{ matrix.shard }}/2."
            exit 0
          fi
          pnpm turbo run build --filter=@auction/api^...
          pnpm --filter @auction/api exec vitest run --shard=${{ matrix.shard }}/2

  shop-v1-paths:
    runs-on: ubuntu-latest
    outputs:
      shop_v1: ${{ steps.filter.outputs.shop_v1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            shop_v1:
              - "apps/shop/**"
              - "apps/shop-api/**"
              - "apps/shop-identity/**"
              - "apps/auth/**"
              - "packages/shop-domain/**"
              - "packages/shop-contracts/**"
              - "packages/types/**"
              - "packages/identity-contracts/**"
              - "packages/db/**"
              - "scripts/ci/run-shop-v1-postgres-integration.mjs"
              - ".github/workflows/ci.yml"
              - ".github/workflows/e2e-pr.yml"
              - ".github/workflows/shop-staging-acceptance.yml"

  shop-v1-phase-smoke:
    needs: shop-v1-paths
    if: needs.shop-v1-paths.outputs.shop_v1 == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_SHOP: postgresql://shop_app:postgres@localhost:5432/auction_ci
      SHOP_APP_DB_PASSWORD: postgres
      SHOP_V1_INTEGRATION_REQUIRED: "true"
      SHOP_ADMIN_ENABLED: "true"
      SHOP_PAYOUTS_ENABLED: "true"
      SHOP_THIRD_PARTY_ENABLED: "true"
      SHOP_ORIGINALS_ENABLED: "true"
      SHOP_MERCHANDISE_ENABLED: "true"
      SHOP_CANCELLATION_DAYS_AFTER_POSSESSION: "14"
      DOMAIN_EVENT_PUBLISH_VALIDATE: "enforce"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build db package
        run: pnpm --filter @auction/db... build
      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate
      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles
      - name: Shop domain + db contract tests
        run: |
          pnpm --filter @auction/shop-domain test
          pnpm --filter @auction/db test -- migration-0182 migration-0185 migration-0186 migration-0193 migration-0194
      - name: Build shop-api dependency graph
        run: pnpm --filter @auction/shop-api... build
      - name: Shop-api Postgres integration (no skips)
        run: node scripts/ci/run-shop-v1-postgres-integration.mjs
      - name: Shop-api admin auth route tests (phase flags on)
        run: pnpm --filter @auction/shop-api exec vitest run src/routes/admin --reporter=verbose
      - name: Shop package build (includes phase1 e2e spec)
        run: pnpm --filter @auction/shop... build

  worker-role-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_WORKER: postgresql://worker_app:postgres@localhost:5432/auction_ci
      WORKER_APP_DB_PASSWORD: postgres
      API_APP_DB_PASSWORD: postgres
      AUTH_APP_DB_PASSWORD: postgres
      WORKER_ROLE_CONTRACT_REQUIRED: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate

      - name: Seed worker role contract probes
        run: pnpm --filter @auction/db exec tsx scripts/seed-worker-role-contract-probes.ts

      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles

      - name: Worker app role contract
        run: pnpm --filter @auction/db test -- worker-app-role

  auth-role-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_AUTH: postgresql://auth_app:postgres@localhost:5432/auction_ci
      DATABASE_URL_API: postgresql://api_app:postgres@localhost:5432/auction_ci
      DATABASE_URL_SHOP: postgresql://shop_app:postgres@localhost:5432/auction_ci
      WORKER_APP_DB_PASSWORD: postgres
      API_APP_DB_PASSWORD: postgres
      AUTH_APP_DB_PASSWORD: postgres
      SHOP_APP_DB_PASSWORD: postgres
      AUTH_ROLE_CONTRACT_REQUIRED: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate

      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles
      - name: Auth app role and schema contracts
        run: pnpm --filter @auction/db test:auth-role-contract
      - name: API app role contract
        run: pnpm --filter @auction/db test:api-role-contract
      - name: Shop app role contract
        run: pnpm --filter @auction/db test:shop-role-contract

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base for turbo affected
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main:main
          else
            git fetch origin "${{ github.event.merge_group.base_sha }}"
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turborepo remote cache
        if: vars.TURBO_TEAM != '' && github.event_name != 'merge_group'
        uses: ./.github/actions/setup-turbo-remote-cache
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build
        run: pnpm turbo run build --affected

  docker-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: auth
            dockerfile: apps/auth/Dockerfile
          - component: shop-identity
            dockerfile: apps/shop-identity/Dockerfile
          - component: shop
            dockerfile: apps/shop/Dockerfile
          - component: shop-api
            dockerfile: apps/shop-api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: docker_paths
        with:
          filters: |
            docker:
              - "**/Dockerfile"
              - "apps/*/package.json"
              - "package.json"
              - "pnpm-lock.yaml"

      - name: Skip (no Docker context changed)
        if: steps.docker_paths.outputs.docker != 'true'
        run: echo "Docker image smoke builds skipped."

      - uses: docker/setup-buildx-action@v3
        if: steps.docker_paths.outputs.docker == 'true'

      - name: Add swap for web image build
        if: steps.docker_paths.outputs.docker == 'true' && matrix.component == 'web'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build ${{ matrix.component }} image
        if: steps.docker_paths.outputs.docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          provenance: false
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

  identity-acceptance-preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: identity_paths
        with:
          filters: |
            identity:
              - apps/auth/**
              - packages/auth/**
              - packages/identity-contracts/**
              - packages/identity-db/**
              - packages/observability/**
              - packages/config-ts/**
              - patches/**
              - scripts/identity/**
              - scripts/ci/prepare-identity-lockfile.mjs
              - scripts/ci/verify-identity-closure-sync.mjs
              - scripts/ci/verify-identity-extractability.mjs
              - scripts/check-layers.mjs
              - package.json
              - pnpm-lock.yaml

      - name: Skip (no Identity paths changed)
        if: steps.identity_paths.outputs.identity != 'true'
        run: echo "Identity acceptance preflight skipped."

      - uses: pnpm/action-setup@v4
        if: steps.identity_paths.outputs.identity == 'true'
      - uses: actions/setup-node@v4
        if: steps.identity_paths.outputs.identity == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - if: steps.identity_paths.outputs.identity == 'true'
        run: pnpm install --frozen-lockfile
      - name: Hermetic Identity acceptance preflight
        if: steps.identity_paths.outputs.identity == 'true'
        run: pnpm ci:identity-acceptance-preflight
      - uses: digitalocean/action-doctl@v2
        if: steps.identity_paths.outputs.identity == 'true'
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - if: steps.identity_paths.outputs.identity == 'true'
        run: doctl registry login --expiry-seconds 900
      - name: N/N-1 Auth image compatibility
        if: steps.identity_paths.outputs.identity == 'true'
        run: pnpm ci:identity-nn1-compat

  ci-result:
    name: ci-result
    runs-on: ubuntu-latest
    needs:
      - static-checks
      - identity-portability
      - test
      - api-vitest
      - web-vitest
      - shop-v1-phase-smoke
      - worker-role-contract
      - auth-role-contract
      - build
      - docker-images
      - identity-acceptance-preflight
    if: always()
    steps:
      - name: Fail if any CI job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled."
          exit 1
      - name: All CI jobs passed
        run: echo "All CI jobs passed."
