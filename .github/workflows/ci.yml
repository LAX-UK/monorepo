name: CI

on:
  push:
    branches: [main, master, release]
  pull_request:
    branches: [main, master, release]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate

      - name: Biome root check
        run: pnpm exec biome check .

      - name: Queue registry lint
        run: node scripts/lint-queue-registry.mjs

      - name: Verify web build args match Terraform
        run: |
          set -euo pipefail
          chmod +x scripts/ci/web-build-args.sh
          for env in test prod; do
            ENVIRONMENT="$env" ./scripts/ci/web-build-args.sh verify-origin
          done

      # OSS binary — avoids gitleaks/gitleaks-action@v2 org license requirement (GITLEAKS_LICENSE).
      - name: Gitleaks secret scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            log_opts="-1 $GITHUB_SHA"
          else
            log_opts="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
          ./gitleaks detect --source . --log-opts="$log_opts" --verbose --redact

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build
