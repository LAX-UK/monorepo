name: CI

on:
  push:
    branches: [main, master, release]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SSF_DELIVERY_ENABLED: "false"
  SSF_DELIVERY_TIMEOUT_MS: "5000"
  SSF_DELIVERY_MAX_ATTEMPTS: "8"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-

      - name: Biome root check
        run: pnpm exec biome check .

      - name: Queue registry lint
        run: node scripts/lint-queue-registry.mjs

      # OSS binary — avoids gitleaks/gitleaks-action@v2 org license requirement (GITLEAKS_LICENSE).
      - name: Gitleaks secret scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            log_opts="-1 $GITHUB_SHA"
          else
            log_opts="${PUSH_BEFORE_SHA}..${GITHUB_SHA}"
          fi
          ./gitleaks detect --source . --log-opts="$log_opts" --verbose --redact

      - name: UI guardrails
        run: pnpm lint:ui-guardrails

      - name: Admin capability drift
        run: pnpm lint:admin-capability-drift

      - name: Web guardrails
        run: pnpm lint:web-guardrails

      - name: Admin lib boundaries
        run: pnpm lint:lib-admin-boundaries

      - name: Staff UI guardrails
        run: pnpm lint:staff-legacy-shell && pnpm lint:staff-route-composition

      - name: E2E portfolio guard
        run: pnpm lint:e2e-portfolio

      - name: E2E tag guard
        run: pnpm lint:e2e-tags

      - name: Zod schema transform lint
        run: pnpm lint:z-schema-transform

      - name: Lint
        run: pnpm turbo run lint --affected

      - name: Dependency graph (no circular)
        run: pnpm lint:deps

      - name: Package layer direction
        run: node scripts/check-layers.mjs

      - name: Identity extractability
        run: pnpm ci:identity-extractability

      - name: Identity exit criteria
        run: pnpm ci:identity-exit-criteria

      - name: Identity extraction rehearsal
        run: node scripts/ci/rehearse-identity-extraction.mjs

      - name: API route DIP coverage
        run: node apps/api/scripts/check-route-dip-coverage.mjs

      - name: Typecheck
        run: pnpm turbo run typecheck --affected

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-

      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate
      - name: Verify executable migration rollback pairs
        run: node scripts/ci/verify-migration-pairs.mjs

      - name: Identity boundary conformance
        run: pnpm ci:identity-boundary

      - name: Test
        run: pnpm turbo run test --affected

      - name: Runtime ownership smoke gates
        run: pnpm --filter @auction/types build && pnpm --filter @auction/background-runtime build && node scripts/ci/run-runtime-ownership-smoke-gates.mjs

      - name: Domain event smoke gates
        run: node scripts/ci/run-domain-event-smoke-gates.mjs

      - name: Cutover readiness defaults
        run: node scripts/ci/verify-cutover-readiness.mjs

  worker-role-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_WORKER: postgresql://worker_app:postgres@localhost:5432/auction_ci
      WORKER_APP_DB_PASSWORD: postgres
      API_APP_DB_PASSWORD: postgres
      AUTH_APP_DB_PASSWORD: postgres
      WORKER_ROLE_CONTRACT_REQUIRED: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate

      - name: Seed worker role contract probes
        run: pnpm --filter @auction/db exec tsx scripts/seed-worker-role-contract-probes.ts

      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles

      - name: Worker app role contract
        run: pnpm --filter @auction/db test -- worker-app-role

  auth-role-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_AUTH: postgresql://auth_app:postgres@localhost:5432/auction_ci
      DATABASE_URL_API: postgresql://api_app:postgres@localhost:5432/auction_ci
      DATABASE_URL_SHOP: postgresql://shop_app:postgres@localhost:5432/auction_ci
      WORKER_APP_DB_PASSWORD: postgres
      API_APP_DB_PASSWORD: postgres
      AUTH_APP_DB_PASSWORD: postgres
      SHOP_APP_DB_PASSWORD: postgres
      AUTH_ROLE_CONTRACT_REQUIRED: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate

      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles
      - name: Auth app role and schema contracts
        run: pnpm --filter @auction/db test:auth-role-contract
      - name: API app role contract
        run: pnpm --filter @auction/db test:api-role-contract
      - name: Shop app role contract
        run: pnpm --filter @auction/db test:shop-role-contract

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ runner.os }}-

      - name: Build
        run: pnpm turbo run build --affected

  migration-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
    steps:
      - uses: ./.github/actions/ci-bootstrap
      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build
      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate
      - name: Verify executable migration rollback pairs
        run: node scripts/ci/verify-migration-pairs.mjs
      - name: FK removal inventory (report-only)
        run: node scripts/ci/run-fk-removal-inventory-gate.mjs

  full-verify:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/auction_ci
      DATABASE_URL_WORKER: postgresql://worker_app:postgres@localhost:5432/auction_ci
      DATABASE_URL_AUTH: postgresql://auth_app:postgres@localhost:5432/auction_ci
      DATABASE_URL_API: postgresql://api_app:postgres@localhost:5432/auction_ci
      DATABASE_URL_SHOP: postgresql://shop_app:postgres@localhost:5432/auction_ci
      WORKER_APP_DB_PASSWORD: postgres
      API_APP_DB_PASSWORD: postgres
      AUTH_APP_DB_PASSWORD: postgres
      SHOP_APP_DB_PASSWORD: postgres
      WORKER_ROLE_CONTRACT_REQUIRED: "true"
      AUTH_ROLE_CONTRACT_REQUIRED: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build db package dependencies
        run: pnpm --filter @auction/db... build

      - name: Migrate test database
        run: pnpm --filter @auction/db db:migrate

      - name: Verify executable migration rollback pairs
        run: node scripts/ci/verify-migration-pairs.mjs

      - name: Seed worker role contract probes
        run: pnpm --filter @auction/db exec tsx scripts/seed-worker-role-contract-probes.ts

      - name: Apply application role grants
        run: pnpm --filter @auction/db db:roles

      - name: Full monorepo verify (ci:verify)
        run: pnpm ci:verify

      - name: Release gates bundle
        run: pnpm ci:release-gates

      - name: Worker app role contract
        run: pnpm --filter @auction/db test -- worker-app-role

      - name: Auth app role and schema contracts
        run: pnpm --filter @auction/db test:auth-role-contract

      - name: API app role contract
        run: pnpm --filter @auction/db test:api-role-contract

      - name: Shop app role contract
        run: pnpm --filter @auction/db test:shop-role-contract
