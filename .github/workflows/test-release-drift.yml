name: Test release drift check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-release-drift
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Compare live test releases with expected pins
        env:
          EXPECTED_IDENTITY_SHA: 23b6e0b9374aba064b51d74cc232192b50b07026
        run: |
          set -euo pipefail
          auth_body="$(curl --fail --silent --max-time 20 https://test-auth.lax.bid/health/ready)"
          shop_body="$(curl --fail --silent --max-time 20 https://test-shop.lax.bid/health/ready)"
          auth_release="$(jq -r '.release // empty' <<<"$auth_body")"
          shop_release="$(jq -r '.release // empty' <<<"$shop_body")"
          shop_admin_body="$(curl --fail --silent --max-time 20 https://test-shop-admin.lax.bid/health/ready)"
          shop_admin_release="$(jq -r '.release // empty' <<<"$shop_admin_body")"
          {
            echo "### Test release drift"
            echo "| Surface | Live release |"
            echo "| --- | --- |"
            echo "| test-auth | \`${auth_release:-unknown}\` |"
            echo "| test-shop | \`${shop_release:-unknown}\` |"
            echo "| test-shop-admin | \`${shop_admin_release:-unknown}\` |"
            echo ""
            echo "Qualified identity reference: \`$EXPECTED_IDENTITY_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if test "$auth_release" != "$EXPECTED_IDENTITY_SHA"; then
            echo "::warning::test-auth release ${auth_release:-missing} != qualified identity $EXPECTED_IDENTITY_SHA"
          fi
          if test "$shop_release" != "$shop_admin_release"; then
            echo "::warning::test-shop (${shop_release:-missing}) and test-shop-admin (${shop_admin_release:-missing}) differ"
          fi
