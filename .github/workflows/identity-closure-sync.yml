name: Identity closure sync

on:
  pull_request:
    paths:
      - apps/auth/**
      - packages/auth/**
      - packages/identity-contracts/**
      - packages/identity-db/**
      - packages/observability/**
      - packages/config-ts/**
      - patches/**
      - scripts/identity/**
      - scripts/ci/prepare-identity-lockfile.mjs
      - scripts/ci/verify-identity-extractability.mjs
      - scripts/check-layers.mjs
      - package.json
      - pnpm-lock.yaml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-lax-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compare Identity closure to lax-identity
        env:
          GH_TOKEN: ${{ github.token }}
          LAX_IDENTITY_CLOSURE_REF: ${{ vars.LAX_IDENTITY_CLOSURE_REF }}
        run: |
          set -euo pipefail
          if test -n "${LAX_IDENTITY_CLOSURE_REF:-}"; then
            node scripts/ci/verify-identity-closure-sync.mjs --ref "$LAX_IDENTITY_CLOSURE_REF"
            exit 0
          fi
          if node scripts/ci/verify-identity-closure-sync.mjs --ref main; then
            exit 0
          fi
          sync_head="$(
            gh api repos/LAX-UK/lax-identity/pulls --paginate \
              --jq '[.[] | select(.state == "open") | select(.head.ref | startswith("sync/")) | .head.sha][0] // empty'
          )"
          if test -z "$sync_head"; then
            echo "::error::lax-identity@main drifted and no open sync/* PR to compare"
            node scripts/ci/verify-identity-closure-sync.mjs --ref main
            exit 1
          fi
          echo "lax-identity@main lags monorepo; verifying open sync PR at $sync_head"
          if node scripts/ci/verify-identity-closure-sync.mjs --ref "$sync_head"; then
            exit 0
          fi
          if test "${{ github.event_name }}" = "pull_request"; then
            echo "Checking whether sync PR only needs monorepo handoff files"
            node scripts/ci/verify-identity-closure-sync.mjs --ref "$sync_head" --apply-monorepo-handoff
            exit 0
          fi
          exit 1
