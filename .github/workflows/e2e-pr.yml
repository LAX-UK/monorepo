name: Web PR browser gates

on:
  pull_request:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "apps/api/src/**"
      - "packages/auth/**"
      - "packages/db/src/seed/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      # Self-testing: changes to the gate itself must run the gate.
      - ".github/workflows/e2e-pr.yml"
      - ".github/e2e.env"

concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-gates:
    runs-on: ubuntu-24.04
    # Advisory until this workflow records its first green run — see
    # docs/engineering/quality-standard.md. Core CI remains the merge gate.
    continue-on-error: true
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # Stack configuration lives in one file shared with the other e2e workflows
      # and with local runs. Comments and blank lines are not valid in $GITHUB_ENV.
      - name: Load shared e2e stack env
        run: grep -Ev '^\s*(#|$)' .github/e2e.env >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: pnpm --filter @auction/web exec playwright install chromium --with-deps
      - name: Migrate and seed
        run: |
          pnpm --filter @auction/db db:migrate
          pnpm --filter @auction/db db:seed:dev
      # `...@auction/api` includes workspace dependencies; filtering the package
      # alone compiles against unbuilt @auction/* and fails to resolve them.
      - name: Build web and API
        run: pnpm turbo run build --filter=...@auction/api --filter=...@auction/web
      # Playwright starts and stops the API and web servers itself
      # (see apps/web/playwright.config.ts webServer).
      - name: Prepare staff session
        working-directory: apps/web
        run: pnpm exec playwright test e2e/auth.setup.ts --project=setup-staff
      - name: Critical browser and curated visual gates
        run: pnpm --filter @auction/web test:e2e:pr -- --no-deps
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-pr-playwright-report
          path: apps/web/blob-report
          retention-days: 7
