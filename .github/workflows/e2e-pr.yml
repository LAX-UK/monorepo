name: Web PR browser gates

on:
  pull_request:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "apps/api/src/**"
      - "apps/auth/**"
      - "packages/auth/**"
      - "packages/db/src/migrate-roles.ts"
      - "packages/db/src/auth-*.contract.test.ts"
      - "packages/db/src/seed/**"
      - "packages/ui/**"
      - ".github/workflows/e2e-pr.yml"
      - "scripts/ci/e2e-session-state.mjs"
      - "scripts/ci/e2e-session-state.test.mjs"
      - "scripts/ci/prepare-e2e-auth-states.mjs"
      - "scripts/ci/run-pr-browser-gates.mjs"
      - "pnpm-lock.yaml"

concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-auth-secret-at-least-sixteen-characters
      API_PUBLIC_URL: http://localhost:3001
      OIDC_ISSUER_URL: http://localhost:3003
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_AUTH_URL: http://localhost:3003
      ALLOW_HTTP_COOKIES: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"
      # development: API boot does not require CRON_INTERNAL_SECRET (gitleaks flags dummy secrets).
      # Rollout flags below are explicit so APP_ENV fallback is unused in this gate.
      APP_ENV: development
      STRICT_BID_ELIGIBILITY_ENABLED: "false"
      KYC_ONBOARDING_ENABLED: "false"
      FULL_BUYER_ONBOARDING_ENABLED: "false"
      MARKETING_PROMPTS_ENABLED: "false"
      PLAYWRIGHT_E2E: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_STAFF_EMAIL: admin@lax.bid
      PLAYWRIGHT_STAFF_PASSWORD: Password123!
      PLAYWRIGHT_CATALOGUE_MANAGER_EMAIL: staff-catalogue@lax.bid
      PLAYWRIGHT_CATALOGUE_MANAGER_PASSWORD: Password123!
      PLAYWRIGHT_BUYER_EMAIL: estate-owner@lax.bid
      PLAYWRIGHT_BUYER_PASSWORD: Password123!
      PLAYWRIGHT_FINANCE_EMAIL: accountant@lax.bid
      PLAYWRIGHT_FINANCE_PASSWORD: Password123!
      PLAYWRIGHT_READONLY_EMAIL: staff-readonly@lax.bid
      PLAYWRIGHT_READONLY_PASSWORD: Password123!
      PLAYWRIGHT_OPERATIONS_EMAIL: staff-operations@lax.bid
      PLAYWRIGHT_OPERATIONS_PASSWORD: Password123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Fast static checks
        run: |
          pnpm exec biome check .
          node --test scripts/ci/e2e-session-state.test.mjs
      - name: Install pinned Chromium
        run: pnpm --filter @auction/web exec playwright install chromium --with-deps
      - name: Migrate and seed
        run: |
          pnpm --filter @auction/db db:migrate
          pnpm --filter @auction/db db:seed:dev
      - name: Build web, API, and auth issuer
        run: pnpm turbo run build --filter=@auction/api --filter=@auction/auth-app --filter=@auction/web
      - name: Start stack
        run: |
          mkdir -p /tmp/e2e-logs
          PORT=3001 pnpm --filter @auction/api start > /tmp/e2e-logs/api.log 2>&1 &
          PORT=3003 pnpm --filter @auction/auth-app start > /tmp/e2e-logs/auth.log 2>&1 &
          PORT=3000 pnpm --filter @auction/web start > /tmp/e2e-logs/web.log 2>&1 &
          npx --yes wait-on http://localhost:3000 http://localhost:3001/health/live http://localhost:3003/health/live --timeout 120000
      - name: Verify dual-host OIDC and auth response parity
        env:
          AUTH_PUBLIC_URL: http://localhost:3003
          AUTH_PARITY_EMAIL: ${{ env.PLAYWRIGHT_STAFF_EMAIL }}
          AUTH_PARITY_PASSWORD: ${{ env.PLAYWRIGHT_STAFF_PASSWORD }}
        run: |
          node scripts/ci/verify-auth-dual-host.mjs
      - name: Prepare auth sessions and run PR browser gates
        run: node scripts/ci/run-pr-browser-gates.mjs --skip-static
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-pr-playwright-report
          path: |
            apps/web/blob-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 7
      - name: Upload session probe and process logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-pr-session-diagnostics
          path: |
            apps/web/e2e/.auth/session-probe.json
            /tmp/e2e-logs
          if-no-files-found: warn
          retention-days: 7
