name: Worker task (test)

# Runs a one-off worker task against the test database from main. Each task is idempotent.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        required: true
        options:
          - alerts-seed
          - demo-full

concurrency:
  group: worker-task-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build worker dependencies
        run: pnpm turbo run build --filter=@auction/worker^...
      - uses: ./.github/actions/checkout-infra
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      # Same masked contract as the identity maintenance workflows: owner address and CA from Terraform.
      - name: Load masked test database contract
        run: |
          set -euo pipefail
          tf_dir=.infra-config/terraform/ephemeral/test
          owner_url="$(terraform -chdir="$tf_dir" output -raw postgres_owner_uri)"
          database_ca_cert="$(terraform -chdir="$tf_dir" output -raw database_ca_certificate)"
          test -n "$owner_url"
          test -n "$database_ca_cert"
          echo "::add-mask::$owner_url"
          echo "DATABASE_URL=$owner_url" >> "$GITHUB_ENV"
          {
            echo 'DATABASE_CA_CERT<<__DATABASE_CA_CERT__'
            printf '%s\n' "$database_ca_cert"
            echo '__DATABASE_CA_CERT__'
          } >> "$GITHUB_ENV"
      - name: Alerts first-run seed
        if: inputs.task == 'alerts-seed'
        run: pnpm --filter @auction/worker exec tsx src/scripts/seed-bid-alerts.ts
      # Full demo data for the owner meeting. Test only: each seed refuses a production host or
      # environment, is idempotent (fixed ids, upserts) and moves the live sale's dates to now.
      - name: Load masked test Shop database address
        if: inputs.task == 'demo-full'
        run: |
          set -euo pipefail
          tf_dir=.infra-config/terraform/ephemeral/test
          shop_url="$(terraform -chdir="$tf_dir" output -raw database_url_shop)"
          test -n "$shop_url"
          echo "::add-mask::$shop_url"
          echo "DATABASE_URL_SHOP=$shop_url" >> "$GITHUB_ENV"
      # Small copies of the museum pictures the seeds use, in the test media bucket under demo/. The
      # seeds below write the addresses of these copies. Idempotent: a copy at the same size is kept.
      - name: Mirror demo pictures
        if: inputs.task == 'demo-full'
        env:
          APP_ENV: test
          DATABASE_URL_WORKER: ${{ env.DATABASE_URL }}
          STORAGE_DRIVER: s3
          S3_ENDPOINT: https://lon1.digitaloceanspaces.com
          S3_REGION: lon1
          S3_BUCKET: lax-media
          S3_PUBLIC_BASE_URL: https://lax-media.lon1.cdn.digitaloceanspaces.com
          S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_SPACES_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_SPACES_SECRET_ACCESS_KEY }}
        run: |
          CRON_INTERNAL_SECRET="$(openssl rand -hex 32)" \
            pnpm --filter @auction/worker exec tsx src/scripts/mirror-demo-images.ts
      - name: Demo seed, Bid database
        if: inputs.task == 'demo-full'
        env:
          APP_ENV: test
        run: pnpm --filter @auction/db db:seed:demo-full
      - name: Demo seed, Shop and lax.art database
        if: inputs.task == 'demo-full'
        env:
          APP_ENV: test
        run: pnpm --filter @auction/shop-api seed:demo-full
      # Measures the new pictures and builds the cover slots the home cover and Coming up cards use.
      - name: Measure cover pictures
        if: inputs.task == 'demo-full'
        env:
          APP_ENV: test
          # The worker reads its own database address; this one-off runs with the owner address the
          # job already loaded. Covers are written to the test media bucket the test apps read from.
          DATABASE_URL_WORKER: ${{ env.DATABASE_URL }}
          STORAGE_DRIVER: s3
          S3_ENDPOINT: https://lon1.digitaloceanspaces.com
          S3_REGION: lon1
          S3_BUCKET: lax-media
          S3_PUBLIC_BASE_URL: https://lax-media.lon1.cdn.digitaloceanspaces.com
          S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_SPACES_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_SPACES_SECRET_ACCESS_KEY }}
        # The worker settings check wants a cron secret on deployed environments; this one-off never
        # calls the cron routes, so it gets a throwaway value for the run.
        run: |
          CRON_INTERNAL_SECRET="$(openssl rand -hex 32)" \
            pnpm --filter @auction/worker exec tsx src/scripts/backfill-cover-data.ts --apply --materialise-covers --retry-failed
