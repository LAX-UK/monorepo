name: Worker task (test)

# Runs a one-off worker task against the test database from main. Each task is idempotent.
on:
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        type: choice
        required: true
        options:
          - alerts-seed

concurrency:
  group: worker-task-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build worker dependencies
        run: pnpm turbo run build --filter=@auction/worker^...
      - uses: digitalocean/action-doctl@v2
        with:
          version: 2.0.0
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Resolve the test database address
        run: |
          set -euo pipefail
          db_id="$(doctl databases list --format ID,Name --no-header | awk '$2 == "lax-test-postgres" { print $1 }')"
          if [ -z "$db_id" ]; then echo "::error::lax-test-postgres not found"; exit 1; fi
          db_name="$(doctl databases db list "$db_id" --format Name --no-header | grep -vx defaultdb | head -n1)"
          url="$(doctl databases connection "$db_id" --format URI --no-header)"
          url="${url%/defaultdb*}/${db_name}?sslmode=require"
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
      - name: Alerts first-run seed
        if: inputs.task == 'alerts-seed'
        run: pnpm --filter @auction/worker exec tsx src/scripts/seed-bid-alerts.ts
