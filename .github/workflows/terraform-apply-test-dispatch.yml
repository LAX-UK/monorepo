name: Terraform apply test (manual)

permissions:
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      layer:
        type: choice
        required: true
        options: [persistent, sentry, ephemeral]
      confirmation:
        required: true
        description: Type APPLY-TEST
      infra_ref:
        description: auction-infra branch, tag, or commit
        type: string
        required: false
        default: main

concurrency:
  group: terraform-test-${{ inputs.layer }}
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Require APPLY-TEST confirmation
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "APPLY-TEST" || {
            echo "::error::Confirmation must be exactly APPLY-TEST"
            exit 1
          }

  call-terraform:
    needs: confirm
    uses: ./.github/workflows/terraform-apply-test.yml
    with:
      layer: ${{ inputs.layer }}
      infra_ref: ${{ inputs.infra_ref }}
      run_ephemeral_predeploy_migrate: false
    secrets: inherit
