name: Terraform plan
on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform-*.yml
      - .github/actions/terraform-*/**
permissions:
  contents: read
  pull-requests: write
jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        env: [test, prod]
        layer: [persistent, sentry, ephemeral]
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_spaces_access_key_id: ${{ secrets.MEDIA_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_access_key: ${{ secrets.MEDIA_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_shopify_webhook_secret: ${{ secrets.SHOPIFY_WEBHOOK_SECRET }}
      TF_VAR_wordpress_webhook_secret: ${{ secrets.WORDPRESS_WEBHOOK_SECRET }}
      TF_VAR_postmark_server_token: ${{ secrets.POSTMARK_SERVER_TOKEN }}
      TF_VAR_postmark_webhook_basic_auth: ${{ secrets.POSTMARK_WEBHOOK_BASIC_AUTH }}
      TF_VAR_email_unsubscribe_secret: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
      TF_VAR_zoho_campaigns_api_key: ${{ secrets.ZOHO_CAMPAIGNS_API_KEY }}
      TF_VAR_zoho_campaigns_list_key: ${{ secrets.ZOHO_CAMPAIGNS_LIST_KEY }}
      TF_VAR_brevo_api_key: ${{ secrets.BREVO_API_KEY }}
      TF_VAR_brevo_webhook_secret: ${{ secrets.BREVO_WEBHOOK_SECRET }}
      TF_VAR_brevo_list_id: ${{ vars.BREVO_LIST_ID }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      TF_VAR_auth_dek_key: ${{ secrets.AUTH_DEK_KEY }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TF_VAR_turnstile_site_key: ${{ secrets.TURNSTILE_SITE_KEY }}
      TF_VAR_verify_origin: "true"
      TF_VAR_csp_enforce: ${{ secrets.CSP_ENFORCE || '0' }}
      TF_VAR_next_public_csp_report_uri: ${{ secrets.NEXT_PUBLIC_CSP_REPORT_URI }}
      TF_VAR_slack_channel_id: ${{ secrets.SENTRY_SLACK_CHANNEL_ID }}
      TF_VAR_pagerduty_integration_key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
      TF_VAR_next_public_gtm_id: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      TF_VAR_ga4_measurement_id: ${{ vars.GA4_MEASUREMENT_ID }}
      # --- Prebuilt-image deploys (DOCR). Match the apply workflows so PR plans are accurate. ---
      TF_VAR_app_deploy_source: ${{ (matrix.env == 'prod' && (vars.APP_DEPLOY_SOURCE_PROD || 'github')) || (vars.APP_DEPLOY_SOURCE_TEST || 'github') }}
      TF_VAR_create_container_registry: ${{ vars.CREATE_CONTAINER_REGISTRY || 'false' }}
      TF_VAR_container_registry_name: ${{ vars.DOCR_REGISTRY || 'lax-bid' }}
      TF_VAR_container_registry_region: ${{ vars.DOCR_REGISTRY_REGION || 'fra1' }}
      TF_VAR_container_registry_subscription_tier: ${{ vars.DOCR_REGISTRY_TIER || 'professional' }}
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform quality gates
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform/${{ matrix.layer }}/${{ matrix.env }} init -backend=false -input=false
          terraform -chdir=infra/terraform/${{ matrix.layer }}/${{ matrix.env }} validate
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: infra/terraform/${{ matrix.layer }}/${{ matrix.env }}
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Resolve sentry remote state (ephemeral)
        if: matrix.layer == 'ephemeral'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          KEY="sentry-${{ matrix.env }}/terraform.tfstate"
          if aws --endpoint-url https://lon1.digitaloceanspaces.com s3 ls "s3://lax-tf-state/$KEY" >/dev/null 2>&1; then
            echo "TF_VAR_enable_sentry_remote_state=true" >> "$GITHUB_ENV"
          else
            echo "TF_VAR_enable_sentry_remote_state=false" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/terraform-plan
        with:
          working-directory: infra/terraform/${{ matrix.layer }}/${{ matrix.env }}
          plan-name: terraform-${{ matrix.layer }}-${{ matrix.env }}
      - uses: infracost/actions/setup@v3
        if: env.INFRACOST_API_KEY != ''
      - name: Post plan summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Terraform plan generated for ${{ matrix.layer }}/${{ matrix.env }}. Download the artifact to review full diffs.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
