name: Demo readiness rehearsal (test)

on:
  workflow_dispatch:
    inputs:
      delete_rehearsal_user:
        description: Delete lax.demo.rehearsal+demo1790685190@example.com after cleanup steps
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: demo-readiness-test-rehearsal
  cancel-in-progress: false

jobs:
  warm-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Warm up test origins
        run: node scripts/ci/warm-up-test-sites.mjs

  verify-backup:
    needs: warm-up
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify backup acceptance account (Bid + Shop)
        env:
          IDENTITY_ACCEPTANCE_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
          IDENTITY_ACCEPTANCE_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
          AUTH_BASE_URL: https://test-auth.lax.bid
          WEB_ORIGIN: https://test.lax.bid
          API_BASE_URL: https://test-api.lax.bid
          SHOP_IDENTITY_BASE_URL: https://test-shop.lax.bid
        run: node scripts/ci/verify-backup-acceptance-account.mjs

  browser-rehearsal:
    needs: verify-backup
    runs-on: ubuntu-latest
    environment: test
    env:
      DEMO_READINESS_TEST: "1"
      DEMO_READINESS_EVIDENCE_DIR: ${{ github.workspace }}/docs/evidence/demo-readiness-test/screenshots
      PLAYWRIGHT_BASE_URL: https://test-shop.lax.bid
      BID_WEB_ORIGIN: https://test.lax.bid
      AUTH_BASE_URL: https://test-auth.lax.bid
      IDENTITY_ACCEPTANCE_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
      IDENTITY_ACCEPTANCE_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @auction/shop exec playwright install chromium --with-deps
      - name: Browser rehearsals with screenshots
        run: |
          pnpm --filter @auction/shop exec playwright test \
            e2e/demo-readiness-test.spec.ts \
            --project=chromium-desktop \
            --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-readiness-screenshots-${{ github.run_id }}
          path: docs/evidence/demo-readiness-test/screenshots/
          if-no-files-found: warn
          retention-days: 30

  cleanup:
    needs: browser-rehearsal
    if: >-
      always() &&
      inputs.delete_rehearsal_user &&
      needs.browser-rehearsal.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: test
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/checkout-infra
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Load owner database URL
        run: |
          set -euo pipefail
          database_url_owner="$(
            terraform -chdir=.infra-config/terraform/ephemeral/test output -raw postgres_owner_uri
          )"
          test -n "$database_url_owner"
          echo "::add-mask::$database_url_owner"
          echo "DATABASE_URL_OWNER=$database_url_owner" >> "$GITHUB_ENV"
          database_ca_cert="$(
            terraform -chdir=.infra-config/terraform/ephemeral/test output -raw database_ca_certificate
          )"
          database_ca_path="$RUNNER_TEMP/staging-postgres-ca.crt"
          printf '%s\n' "$database_ca_cert" > "$database_ca_path"
          chmod 0600 "$database_ca_path"
          echo "NODE_EXTRA_CA_CERTS=$database_ca_path" >> "$GITHUB_ENV"
      - name: Delete exposed rehearsal user
        env:
          DEMO_REHEARSAL_USER_EMAIL: lax.demo.rehearsal+demo1790685190@example.com
        run: pnpm tsx scripts/ci/delete-demo-rehearsal-user.mjs
