name: App deploy prod
on:
  push:
    branches: [release]
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
permissions:
  contents: read
jobs:
  sentry-release:
    uses: ./.github/workflows/sentry-release.yml
    with:
      environment: prod
      git_sha: ${{ github.sha }}
    secrets: inherit
    continue-on-error: true
  deploy:
    runs-on: ubuntu-latest
    needs: [sentry-release]
    if: always()
    environment: prod
    env:
      APP_ID: ${{ secrets.DO_PROD_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until App Platform app exists
        if: env.APP_ID == ''
        run: echo "DO_PROD_APP_ID is not set yet; skipping app deployment until Terraform creates the app."
      - uses: digitalocean/action-doctl@v2
        if: env.APP_ID != ''
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - if: env.APP_ID != ''
        run: doctl apps create-deployment "$APP_ID"
