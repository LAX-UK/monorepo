name: App deploy prod
on:
  push:
    branches: [release]
    paths:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - infra/web-build/**
permissions:
  contents: read
jobs:
  sentry-release:
    uses: ./.github/workflows/sentry-release.yml
    with:
      environment: prod
      git_sha: ${{ github.sha }}
    secrets: inherit
  # Prebuilt images (api, auth, ws, worker, migrate, web) pushed to DOCR so App
  # Platform only pulls. Runs in parallel with sentry-release. Gated on the
  # repository variable USE_PREBUILT_IMAGES_PROD (caller jobs cannot bind an
  # environment, so only repo/org vars are visible in the `if:`).
  build-images:
    if: ${{ vars.USE_PREBUILT_IMAGES_PROD == 'true' }}
    uses: ./.github/workflows/build-images.yml
    with:
      environment: prod
      git_sha: ${{ github.sha }}
    secrets: inherit
  deploy:
    runs-on: ubuntu-latest
    needs: [sentry-release, build-images]
    # Deploy unless the image build failed/was cancelled. Sentry release/sourcemap
    # failures must NOT block shipping, so we deliberately do not gate on its result.
    # When build-images is skipped (USE_PREBUILT_IMAGES != true) its result is 'skipped' => allowed.
    if: ${{ always() && !cancelled() && needs.build-images.result != 'failure' && needs.build-images.result != 'cancelled' }}
    environment: prod
    env:
      APP_ID: ${{ secrets.DO_PROD_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until App Platform app exists
        if: env.APP_ID == ''
        run: echo "DO_PROD_APP_ID is not set yet; skipping app deployment until Terraform creates the app."
      - uses: digitalocean/action-doctl@v2
        if: env.APP_ID != ''
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - if: env.APP_ID != ''
        run: doctl apps create-deployment "$APP_ID"
