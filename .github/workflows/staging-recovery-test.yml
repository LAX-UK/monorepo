name: Staging recovery (test)

on:
  workflow_dispatch:
    inputs:
      identity_sha:
        description: Approved Identity commit SHA
        required: true
      identity_digest:
        description: Approved lax-test-identity digest
        required: true
      shop_identity_sha:
        description: Approved Shop Identity commit SHA
        required: true
      shop_identity_digest:
        description: Approved lax-test-shop-identity digest
        required: true
      shop_image:
        description: Approved lax-test-shop as `<40-char-sha>@<digest>`
        required: true
      shop_api_image:
        description: Approved lax-test-shop-api as `<40-char-sha>@<digest>`
        required: true
      publish_run_id:
        description: Successful lax-identity publish workflow run
        required: true
      run_acceptance:
        description: Run live acceptance after deploy
        required: true
        type: boolean
        default: false
      rollback_rehearsal:
        description: Rehearse rollback to the previous accepted manifest
        required: true
        type: boolean
        default: false
      rollback_manifest:
        description: Accepted immutable manifest JSON used only for rollback rehearsal
        required: false
        default: "{}"
      infra_ref:
        description: auction-infra branch, tag, or commit for Terraform apply
        type: string
        required: false
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: app-deploy-test
  cancel-in-progress: false

jobs:
  validate_inputs:
    runs-on: ubuntu-latest
    outputs:
      shop_sha: ${{ steps.parse.outputs.shop_sha }}
      shop_digest: ${{ steps.parse.outputs.shop_digest }}
      shop_api_sha: ${{ steps.parse.outputs.shop_api_sha }}
      shop_api_digest: ${{ steps.parse.outputs.shop_api_digest }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        name: Validate recovery and rollback inputs
        env:
          RUN_ACCEPTANCE: ${{ inputs.run_acceptance }}
          ROLLBACK_REHEARSAL: ${{ inputs.rollback_rehearsal }}
          ROLLBACK_MANIFEST: ${{ inputs.rollback_manifest }}
          SHOP_IMAGE: ${{ inputs.shop_image }}
          SHOP_API_IMAGE: ${{ inputs.shop_api_image }}
          INFRA_REF: ${{ inputs.infra_ref }}
        run: |
          set -euo pipefail
          if test "$INFRA_REF" != "main" && [[ ! "$INFRA_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::infra_ref must be main or a full 40-char commit SHA (checkout cannot resolve abbreviated refs)"
            exit 1
          fi
          parse_image() {
            local label="$1"
            local value="$2"
            if [[ ! "$value" =~ ^([0-9a-f]{40})@(.+)$ ]]; then
              echo "::error::${label} must be <40-char-sha>@<digest>"
              exit 1
            fi
            echo "${label}_sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "${label}_digest=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          }
          parse_image shop "$SHOP_IMAGE"
          parse_image shop_api "$SHOP_API_IMAGE"
          if test "$ROLLBACK_REHEARSAL" = "true"; then
            test "$RUN_ACCEPTANCE" = "true" || {
              echo "::error::Rollback rehearsal requires both acceptance phases"
              exit 1
            }
            node --input-type=module -e '
              import { parseRecoveryManifest } from "./scripts/ci/identity-recovery/manifest.mjs";
              parseRecoveryManifest(process.env.ROLLBACK_MANIFEST);
            '
          fi

  inventory_auth_at_rest:
    needs: validate_inputs
    uses: ./.github/workflows/auth-at-rest-maintenance-test.yml
    with:
      mode: inventory
      confirm_backup: false
    secrets: inherit

  qualify_identity:
    needs: inventory_auth_at_rest
    uses: ./.github/workflows/identity-staging-deploy.yml
    with:
      identity_sha: ${{ inputs.identity_sha }}
      identity_digest: ${{ inputs.identity_digest }}
      publish_run_id: ${{ inputs.publish_run_id }}
      stage_only: true
    secrets: inherit

  deploy:
    needs: [qualify_identity, validate_inputs]
    uses: ./.github/workflows/terraform-apply-test.yml
    with:
      layer: ephemeral
      infra_ref: ${{ inputs.infra_ref }}
      parent_holds_deploy_lock: true
      identity_sha: ${{ inputs.identity_sha }}
      identity_digest: ${{ inputs.identity_digest }}
      shop_identity_sha: ${{ inputs.shop_identity_sha }}
      shop_identity_digest: ${{ inputs.shop_identity_digest }}
      shop_sha: ${{ needs.validate_inputs.outputs.shop_sha }}
      shop_digest: ${{ needs.validate_inputs.outputs.shop_digest }}
      shop_api_sha: ${{ needs.validate_inputs.outputs.shop_api_sha }}
      shop_api_digest: ${{ needs.validate_inputs.outputs.shop_api_digest }}
      app_image_tag: ${{ needs.validate_inputs.outputs.shop_sha }}
    secrets: inherit

  acceptance_disabled:
    if: inputs.run_acceptance
    needs: deploy
    uses: ./.github/workflows/identity-staging-acceptance.yml
    with:
      identity_sha: ${{ inputs.identity_sha }}
      outbox_max_age_ms: 300000
      ssf_mode: ssf_disabled
    secrets: inherit

  enable_ssf:
    if: inputs.run_acceptance
    needs: [acceptance_disabled, validate_inputs]
    uses: ./.github/workflows/terraform-apply-test.yml
    with:
      layer: ephemeral
      infra_ref: ${{ inputs.infra_ref }}
      parent_holds_deploy_lock: true
      enable_auth_ssf_delivery: true
      identity_sha: ${{ inputs.identity_sha }}
      identity_digest: ${{ inputs.identity_digest }}
      shop_identity_sha: ${{ inputs.shop_identity_sha }}
      shop_identity_digest: ${{ inputs.shop_identity_digest }}
      shop_sha: ${{ needs.validate_inputs.outputs.shop_sha }}
      shop_digest: ${{ needs.validate_inputs.outputs.shop_digest }}
      shop_api_sha: ${{ needs.validate_inputs.outputs.shop_api_sha }}
      shop_api_digest: ${{ needs.validate_inputs.outputs.shop_api_digest }}
      app_image_tag: ${{ needs.validate_inputs.outputs.shop_sha }}
    secrets: inherit

  acceptance_enabled:
    if: inputs.run_acceptance
    needs: enable_ssf
    uses: ./.github/workflows/identity-staging-acceptance.yml
    with:
      identity_sha: ${{ inputs.identity_sha }}
      outbox_max_age_ms: 300000
      ssf_mode: ssf_enabled
    secrets: inherit

  shop_acceptance:
    if: inputs.run_acceptance
    needs: [acceptance_enabled, validate_inputs]
    uses: ./.github/workflows/shop-staging-acceptance.yml
    with:
      shop_sha: ${{ needs.validate_inputs.outputs.shop_sha }}
      seed_catalogue: false
    secrets: inherit

  rollback_rehearsal:
    if: inputs.rollback_rehearsal
    needs: [acceptance_enabled, shop_acceptance]
    uses: ./.github/workflows/terraform-apply-test.yml
    with:
      layer: ephemeral
      infra_ref: ${{ inputs.infra_ref }}
      parent_holds_deploy_lock: true
      enable_auth_ssf_delivery: ${{ fromJSON(inputs.rollback_manifest).enableAuthSsfDelivery }}
      identity_sha: ${{ fromJSON(inputs.rollback_manifest).identity.sha }}
      identity_digest: ${{ fromJSON(inputs.rollback_manifest).identity.digest }}
      shop_identity_sha: ${{ fromJSON(inputs.rollback_manifest).shopIdentity.sha }}
      shop_identity_digest: ${{ fromJSON(inputs.rollback_manifest).shopIdentity.digest }}
      shop_sha: ${{ fromJSON(inputs.rollback_manifest).shop.sha }}
      shop_digest: ${{ fromJSON(inputs.rollback_manifest).shop.digest }}
      shop_api_sha: ${{ fromJSON(inputs.rollback_manifest).shopApi.sha }}
      shop_api_digest: ${{ fromJSON(inputs.rollback_manifest).shopApi.digest }}
      app_image_tag: ${{ fromJSON(inputs.rollback_manifest).monorepoSha }}
    secrets: inherit

  restore_candidate:
    # `needs` otherwise skips this job when a rollback deploy fails. Restoring the
    # reviewed candidate is the safety action, so it must be attempted after any
    # rollback attempt. It must not deploy when validation skipped the rollback.
    if: >-
      always() &&
      inputs.rollback_rehearsal &&
      needs.rollback_rehearsal.result != 'skipped'
    needs: [rollback_rehearsal, validate_inputs]
    uses: ./.github/workflows/terraform-apply-test.yml
    with:
      layer: ephemeral
      infra_ref: ${{ inputs.infra_ref }}
      parent_holds_deploy_lock: true
      enable_auth_ssf_delivery: true
      identity_sha: ${{ inputs.identity_sha }}
      identity_digest: ${{ inputs.identity_digest }}
      shop_identity_sha: ${{ inputs.shop_identity_sha }}
      shop_identity_digest: ${{ inputs.shop_identity_digest }}
      shop_sha: ${{ needs.validate_inputs.outputs.shop_sha }}
      shop_digest: ${{ needs.validate_inputs.outputs.shop_digest }}
      shop_api_sha: ${{ needs.validate_inputs.outputs.shop_api_sha }}
      shop_api_digest: ${{ needs.validate_inputs.outputs.shop_api_digest }}
      app_image_tag: ${{ needs.validate_inputs.outputs.shop_sha }}
    secrets: inherit

  acceptance_after_rehearsal:
    if: >-
      always() &&
      inputs.rollback_rehearsal &&
      needs.restore_candidate.result == 'success'
    needs: restore_candidate
    uses: ./.github/workflows/identity-staging-acceptance.yml
    with:
      identity_sha: ${{ inputs.identity_sha }}
      outbox_max_age_ms: 300000
      ssf_mode: ssf_enabled
    secrets: inherit

  shop_acceptance_after_rehearsal:
    if: >-
      always() &&
      inputs.rollback_rehearsal &&
      needs.restore_candidate.result == 'success'
    needs: [restore_candidate, validate_inputs]
    uses: ./.github/workflows/shop-staging-acceptance.yml
    with:
      shop_sha: ${{ needs.validate_inputs.outputs.shop_sha }}
      seed_catalogue: false
    secrets: inherit

  record_accepted_release:
    needs:
      [
        acceptance_enabled,
        shop_acceptance,
        acceptance_after_rehearsal,
        shop_acceptance_after_rehearsal,
        validate_inputs,
      ]
    if: >-
      always() &&
      needs.acceptance_enabled.result == 'success' &&
      (needs.shop_acceptance.result == 'success' || needs.shop_acceptance.result == 'skipped') &&
      (!inputs.rollback_rehearsal ||
       (needs.acceptance_after_rehearsal.result == 'success' &&
        needs.shop_acceptance_after_rehearsal.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-infra
        with:
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - name: Record accepted release manifest evidence
        env:
          MONOREPO_SHA: ${{ github.sha }}
          IDENTITY_SHA: ${{ inputs.identity_sha }}
          IDENTITY_DIGEST: ${{ inputs.identity_digest }}
          IDENTITY_BUILD_RUN: ${{ github.run_id }}
          SHOP_IDENTITY_SHA: ${{ inputs.shop_identity_sha }}
          SHOP_IDENTITY_DIGEST: ${{ inputs.shop_identity_digest }}
          SHOP_IDENTITY_BUILD_RUN: ${{ github.run_id }}
          SHOP_SHA: ${{ needs.validate_inputs.outputs.shop_sha }}
          SHOP_DIGEST: ${{ needs.validate_inputs.outputs.shop_digest }}
          SHOP_BUILD_RUN: ${{ github.run_id }}
          SHOP_API_SHA: ${{ needs.validate_inputs.outputs.shop_api_sha }}
          SHOP_API_DIGEST: ${{ needs.validate_inputs.outputs.shop_api_digest }}
          SHOP_API_BUILD_RUN: ${{ github.run_id }}
          RECOVERY_ACCEPTED_RELEASE_PATH: ${{ runner.temp }}/recovery-evidence/accepted-release.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovery-evidence"
          INFRA_SHA="$(git -C .infra-config rev-parse HEAD)"
          export INFRA_SHA
          node scripts/ci/write-recovery-accepted-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: staging-recovery-accepted-release
          path: ${{ runner.temp }}/recovery-evidence/accepted-release.json
          retention-days: 30
