name: Identity staging soak

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Collect one sample, evaluate the window, or upload a reset marker
        required: true
        type: choice
        options: [sample, evaluate, reset]
        default: sample
      identity_sha:
        description: Optional Identity SHA override (defaults to live test-auth release)
        required: false
        type: string
      soak_started_at:
        description: Optional UTC window start override for manual sample chains
        required: false
        type: string
      minimum_operations:
        description: Minimum observed Auth operation counter delta
        required: true
        type: number
        default: 1

permissions:
  contents: read
  actions: read

jobs:
  reset:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reset'
    runs-on: ubuntu-latest
    env:
      AUTH_BASE_URL: https://test-auth.lax.bid
    steps:
      - uses: actions/checkout@v4
      - name: Resolve live Identity release
        id: live
        run: node scripts/ci/resolve-live-identity-sha.mjs
      - name: Upload soak reset marker
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/soak-reset.json"
          printf '%s\n' "{\"resetAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"identitySha\":\"${{ steps.live.outputs.identity_sha }}\"}" > "$path"
      - uses: actions/upload-artifact@v4
        with:
          name: identity-staging-soak-reset-${{ steps.live.outputs.identity_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/soak-reset.json
          if-no-files-found: error
          retention-days: 90

  sample:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sample'
    runs-on: ubuntu-latest
    concurrency:
      group: identity-staging-soak-sample
      cancel-in-progress: false
    environment: test
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AUTH_BASE_URL: https://test-auth.lax.bid
      API_BASE_URL: https://test-api.lax.bid
      SHOP_IDENTITY_BASE_URL: https://test-shop.lax.bid
      IDENTITY_OUTBOX_MAX_AGE_MS: "300000"
      IDENTITY_DIRECTORY_MAX_PROCESSING_LAG_MS: "60000"
      SOAK_VALIDATION_MODE: enforce
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect staging maintenance
        id: maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/detect-staging-maintenance.mjs
      - name: Resolve live Identity release
        id: live
        env:
          ALLOW_MISSING_RELEASE: ${{ steps.maintenance.outputs.active == 'true' && '1' || '0' }}
        run: node scripts/ci/resolve-live-identity-sha.mjs
      - uses: ./.github/actions/checkout-infra
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Load read-only staging database contracts
        if: steps.maintenance.outputs.active != 'true'
        run: |
          set -euo pipefail
          identity_sha="${{ steps.live.outputs.identity_sha }}"
          [[ "$identity_sha" =~ ^[0-9a-f]{40}$ ]]
          for pair in \
            DATABASE_URL_OWNER:postgres_owner_uri \
            DATABASE_URL_WORKER:database_url_worker \
            AUTH_METRICS_TOKEN:auth_metrics_token; do
            env_name="${pair%%:*}"
            output_name="${pair##*:}"
            value="$(terraform -chdir=.infra-config/terraform/ephemeral/test output -raw "$output_name")"
            test -n "$value"
            echo "::add-mask::$value"
            echo "$env_name=$value" >> "$GITHUB_ENV"
          done
          database_ca_cert="$(
            terraform -chdir=.infra-config/terraform/ephemeral/test \
              output -raw database_ca_certificate
          )"
          test -n "$database_ca_cert"
          database_ca_path="$RUNNER_TEMP/staging-postgres-ca.crt"
          printf '%s\n' "$database_ca_cert" > "$database_ca_path"
          chmod 0600 "$database_ca_path"
          {
            echo "NODE_EXTRA_CA_CERTS=$database_ca_path"
            echo 'DATABASE_CA_CERT<<__DATABASE_CA_CERT__'
            printf '%s\n' "$database_ca_cert"
            echo '__DATABASE_CA_CERT__'
          } >> "$GITHUB_ENV"
      - name: Collect one read-only soak sample
        if: always()
        env:
          SOAK_SAMPLE_PATH: ${{ runner.temp }}/soak-sample.json
          IDENTITY_SHA: ${{ steps.live.outputs.identity_sha }}
          SOAK_SAMPLE_KIND: ${{ steps.maintenance.outputs.active == 'true' && 'maintenance' || 'probe' }}
        run: pnpm tsx scripts/ci/collect-identity-staging-soak-sample.mjs
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            ${{ steps.maintenance.outputs.active == 'true'
              && format('identity-staging-soak-maintenance-{0}', github.run_id)
              || format('identity-staging-soak-sample-{0}-{1}', steps.live.outputs.identity_sha, github.run_id) }}
          path: ${{ runner.temp }}/soak-sample.json
          if-no-files-found: error
          retention-days: 90
  evaluate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'evaluate'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IDENTITY_SHA: ${{ inputs.identity_sha }}
      SOAK_STARTED_AT: ${{ inputs.soak_started_at }}
      MINIMUM_OPERATIONS: ${{ inputs.minimum_operations }}
      AUTH_BASE_URL: https://test-auth.lax.bid
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate complete 24-hour sample window
        run: node scripts/ci/evaluate-identity-staging-soak.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: identity-staging-soak-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/identity-soak-evaluation.json
          if-no-files-found: error
          retention-days: 90
