name: Identity staging soak

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Collect one sample or evaluate the completed sample window
        required: true
        type: choice
        options: [sample, evaluate]
        default: sample
      identity_sha:
        description: Standalone Identity SHA under soak
        required: true
        type: string
      soak_started_at:
        description: UTC start timestamp used by the final evaluator and sample chain
        required: false
        type: string
      minimum_operations:
        description: Minimum observed Auth operation counter delta
        required: true
        type: number
        default: 1
      chain_next:
        description: After a sample, sleep 15 minutes and dispatch the next sample
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: identity-staging-soak
  cancel-in-progress: false

jobs:
  sample:
    if: github.event_name == 'schedule' || inputs.mode == 'sample'
    runs-on: ubuntu-latest
    environment: test
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      IDENTITY_SHA: ${{ github.event_name == 'schedule' && vars.IDENTITY_SOAK_SHA_TEST || inputs.identity_sha }}
      SOAK_STARTED_AT: ${{ github.event_name == 'schedule' && vars.IDENTITY_SOAK_STARTED_AT_TEST || inputs.soak_started_at }}
      AUTH_BASE_URL: https://test-auth.lax.bid
      API_BASE_URL: https://test-api.lax.bid
      SHOP_IDENTITY_BASE_URL: https://test-shop.lax.bid
      IDENTITY_OUTBOX_MAX_AGE_MS: "300000"
      IDENTITY_DIRECTORY_MAX_PROCESSING_LAG_MS: "60000"
      AUTH_METRICS_TOKEN: ${{ secrets.AUTH_METRICS_TOKEN }}
      SOAK_VALIDATION_MODE: enforce
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/checkout-infra
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Load read-only staging database contracts
        run: |
          set -euo pipefail
          [[ "$IDENTITY_SHA" =~ ^[0-9a-f]{40}$ ]]
          for pair in \
            DATABASE_URL_OWNER:postgres_owner_uri \
            DATABASE_URL_WORKER:database_url_worker; do
            env_name="${pair%%:*}"
            output_name="${pair##*:}"
            value="$(terraform -chdir=.infra-config/terraform/ephemeral/test output -raw "$output_name")"
            test -n "$value"
            echo "::add-mask::$value"
            echo "$env_name=$value" >> "$GITHUB_ENV"
          done
          database_ca_cert="$(
            terraform -chdir=.infra-config/terraform/ephemeral/test \
              output -raw database_ca_certificate
          )"
          test -n "$database_ca_cert"
          database_ca_path="$RUNNER_TEMP/staging-postgres-ca.crt"
          printf '%s\n' "$database_ca_cert" > "$database_ca_path"
          chmod 0600 "$database_ca_path"
          {
            echo "NODE_EXTRA_CA_CERTS=$database_ca_path"
            echo 'DATABASE_CA_CERT<<__DATABASE_CA_CERT__'
            printf '%s\n' "$database_ca_cert"
            echo '__DATABASE_CA_CERT__'
          } >> "$GITHUB_ENV"
      - name: Collect one read-only soak sample
        if: always()
        env:
          SOAK_SAMPLE_PATH: ${{ runner.temp }}/soak-sample.json
        run: pnpm tsx scripts/ci/collect-identity-staging-soak-sample.mjs
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-staging-soak-sample-${{ github.run_id }}
          path: ${{ runner.temp }}/soak-sample.json
          if-no-files-found: error
          retention-days: 90
      - name: Schedule next soak sample
        if: >-
          always() &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.chain_next != false))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${SOAK_STARTED_AT:-}" || exit 0
          start_epoch="$(date -u -d "$SOAK_STARTED_AT" +%s)"
          end_epoch=$((start_epoch + 24 * 60 * 60))
          now_epoch="$(date -u +%s)"
          if test "$now_epoch" -ge "$end_epoch"; then
            echo "Soak window complete; not scheduling another sample."
            exit 0
          fi
          sleep 900
          gh workflow run identity-staging-soak.yml \
            --ref "${GITHUB_REF_NAME:-main}" \
            -f mode=sample \
            -f "identity_sha=$IDENTITY_SHA" \
            -f "soak_started_at=$SOAK_STARTED_AT" \
            -f minimum_operations=1 \
            -f chain_next=true

  evaluate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'evaluate'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IDENTITY_SHA: ${{ inputs.identity_sha }}
      SOAK_STARTED_AT: ${{ inputs.soak_started_at }}
      MINIMUM_OPERATIONS: ${{ inputs.minimum_operations }}
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate complete 24-hour sample window
        run: node scripts/ci/evaluate-identity-staging-soak.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: identity-staging-soak-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/identity-soak-evaluation.json
          if-no-files-found: error
          retention-days: 90
