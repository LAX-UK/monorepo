name: E2E stabilization

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: e2e-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilization:
    name: ${{ matrix.mode }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        mode: [flags-off, rollout]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auction_ci
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-auth-secret-at-least-sixteen-characters
      API_PUBLIC_URL: http://localhost:3001
      OIDC_ISSUER_URL: http://localhost:3003
      WEB_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_AUTH_URL: http://localhost:3003
      ALLOW_HTTP_COOKIES: "true"
      REQUIRE_EMAIL_VERIFICATION: "false"
      APP_ENV: development
      STRICT_BID_ELIGIBILITY_ENABLED: ${{ matrix.mode == 'rollout' && 'true' || 'false' }}
      KYC_ONBOARDING_ENABLED: ${{ matrix.mode == 'rollout' && 'true' || 'false' }}
      FULL_BUYER_ONBOARDING_ENABLED: ${{ matrix.mode == 'rollout' && 'true' || 'false' }}
      MARKETING_PROMPTS_ENABLED: "false"
      ADMIN_KPI_TREND_ANCHOR: "2026-08-25T12:00:00.000Z"
      PLAYWRIGHT_E2E: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_STAFF_EMAIL: admin@lax.bid
      PLAYWRIGHT_STAFF_PASSWORD: Password123!
      PLAYWRIGHT_CATALOGUE_MANAGER_EMAIL: staff-catalogue@lax.bid
      PLAYWRIGHT_CATALOGUE_MANAGER_PASSWORD: Password123!
      PLAYWRIGHT_BUYER_EMAIL: estate-owner@lax.bid
      PLAYWRIGHT_BUYER_PASSWORD: Password123!
      PLAYWRIGHT_CLIENT_EMAIL: user1@lax.bid
      PLAYWRIGHT_CLIENT_PASSWORD: Password123!
      PLAYWRIGHT_UNAPPROVED_EMAIL: gallery-finance@lax.bid
      PLAYWRIGHT_UNAPPROVED_PASSWORD: Password123!
      PLAYWRIGHT_INCOMPLETE_EMAIL: viewer@lax.bid
      PLAYWRIGHT_INCOMPLETE_PASSWORD: Password123!
      PLAYWRIGHT_ZERO_LOT_EMAIL: apple-test@lax.bid
      PLAYWRIGHT_ZERO_LOT_PASSWORD: Password123!
      PLAYWRIGHT_ORG_EMAIL: estate-owner@lax.bid
      PLAYWRIGHT_ORG_PASSWORD: Password123!
      PLAYWRIGHT_FINANCE_EMAIL: accountant@lax.bid
      PLAYWRIGHT_FINANCE_PASSWORD: Password123!
      PLAYWRIGHT_READONLY_EMAIL: staff-readonly@lax.bid
      PLAYWRIGHT_READONLY_PASSWORD: Password123!
      PLAYWRIGHT_OPERATIONS_EMAIL: staff-operations@lax.bid
      PLAYWRIGHT_OPERATIONS_PASSWORD: Password123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: pnpm --filter @auction/web exec playwright install chromium --with-deps
      - name: Migrate and seed
        run: |
          pnpm --filter @auction/db db:migrate
          pnpm --filter @auction/db db:seed:dev
      - name: Build web, API, and auth issuer
        run: pnpm turbo run build --filter=@auction/api --filter=@auction/auth-app --filter=@auction/web
      - name: Start stack
        run: |
          mkdir -p /tmp/e2e-logs
          PORT=3001 pnpm --filter @auction/api start > /tmp/e2e-logs/api.log 2>&1 &
          PORT=3003 pnpm --filter @auction/auth-app start > /tmp/e2e-logs/auth.log 2>&1 &
          PORT=3000 pnpm --filter @auction/web start > /tmp/e2e-logs/web.log 2>&1 &
          npx --yes wait-on http://localhost:3000 http://localhost:3001/health/live http://localhost:3003/health/live --timeout 120000
      - name: Prepare auth sessions
        run: pnpm --filter @auction/web exec node ../../scripts/ci/prepare-e2e-auth-states.mjs
      - name: Playwright stabilization suite
        run: pnpm --filter @auction/web test:e2e:stabilization -- --no-deps --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_AUTH_PREPARED: "1"
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.mode }}-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 7
      - name: Upload session probe and process logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-session-${{ matrix.mode }}-${{ matrix.shard }}
          path: |
            apps/web/e2e/.auth/session-probe.json
            /tmp/e2e-logs
          if-no-files-found: warn
          retention-days: 7

  report:
    if: ${{ !cancelled() }}
    needs: stabilization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter=html ../../all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report
          path: apps/web/playwright-report
          retention-days: 14
