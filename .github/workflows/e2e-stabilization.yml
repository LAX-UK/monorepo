name: E2E stabilization

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: e2e-stabilization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilization:
    name: stabilization shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Load shared e2e stack env
        run: grep -Ev '^\s*(#|$)' .github/e2e.env >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --filter @auction/web exec playwright install chromium --with-deps

      - name: Migrate and seed dev data
        run: |
          pnpm --filter @auction/db db:migrate
          pnpm --filter @auction/db db:seed:dev

      - name: Build web and API
        run: pnpm turbo run build --filter=...@auction/api --filter=...@auction/web

      # Playwright starts and stops the API and web servers itself
      # (see apps/web/playwright.config.ts webServer).
      - name: Prepare role storage states
        working-directory: apps/web
        run: pnpm exec playwright test e2e/auth.setup.ts --project=setup-staff --project=setup-catalogue --project=setup-buyer

      - name: Playwright stabilization suite
        run: pnpm --filter @auction/web test:e2e:stabilization -- --no-deps --shard=${{ matrix.shard }}/2

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 7

  report:
    if: ${{ !cancelled() }}
    needs: stabilization
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter=html ../../all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report
          path: apps/web/playwright-report
          retention-days: 14
