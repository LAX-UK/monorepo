name: Terraform plan prod
# READ-ONLY. Runs `terraform plan` for terraform/ephemeral/prod against the real backend.
# Never applies: there is no apply step and no -auto-approve anywhere in this file.
# Locking: the repo never uses -lock=false (plan, drift check and apply all take the state
# lock), so this plan keeps the lock too, and waits up to 5 minutes for a running apply to
# release it (-lock-timeout=5m). It has its OWN concurrency group: sharing the apply's group
# would let a newly queued plan replace a pending apply, since a group keeps one pending run.
on:
  workflow_dispatch:
    inputs:
      app_image_tag:
        description: Immutable 40-character monorepo git SHA every prebuilt component pins to (as in terraform-apply-prod)
        type: string
        required: true
      app_git_branch:
        description: Git branch App Platform builds from (same default as terraform-apply-prod)
        type: string
        required: false
        default: release
      infra_ref:
        description: auction-infra branch, tag, or commit
        type: string
        required: false
        default: main
concurrency:
  group: terraform-plan-prod-ephemeral
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TF_VAR_github_integration_id: ${{ secrets.SENTRY_GITHUB_INTEGRATION_ID }}
      SENTRY_GITHUB_INTEGRATION_ID: ${{ secrets.SENTRY_GITHUB_INTEGRATION_ID }}
      TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      TF_VAR_check_in_token_secret: ${{ secrets.CHECK_IN_TOKEN_SECRET }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_spaces_access_key_id: ${{ secrets.MEDIA_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_access_key: ${{ secrets.MEDIA_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_postmark_server_token: ${{ secrets.POSTMARK_SERVER_TOKEN }}
      TF_VAR_postmark_webhook_basic_auth: ${{ secrets.POSTMARK_WEBHOOK_BASIC_AUTH }}
      TF_VAR_email_unsubscribe_secret: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
      TF_VAR_zoho_campaigns_api_key: ${{ secrets.ZOHO_CAMPAIGNS_API_KEY }}
      TF_VAR_zoho_campaigns_list_key: ${{ secrets.ZOHO_CAMPAIGNS_LIST_KEY }}
      # Zoho CRM stays off until all three OAuth secrets are set (terraform/ephemeral/prod).
      TF_VAR_zoho_client_id: ${{ secrets.ZOHO_CLIENT_ID }}
      TF_VAR_zoho_client_secret: ${{ secrets.ZOHO_CLIENT_SECRET }}
      TF_VAR_zoho_refresh_token: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      TF_VAR_zoho_crm_sync_mode: ${{ vars.ZOHO_CRM_SYNC_MODE || 'off' }}
      TF_VAR_zoho_crm_enabled_event_types: ${{ vars.ZOHO_CRM_ENABLED_EVENT_TYPES || '' }}
      TF_VAR_zoho_crm_auction_pipeline: ${{ vars.ZOHO_CRM_AUCTION_PIPELINE || '' }}
      TF_VAR_zoho_crm_deal_stage_lot_won: ${{ vars.ZOHO_CRM_DEAL_STAGE_LOT_WON || '' }}
      TF_VAR_zoho_crm_deal_stage_payment_captured: ${{ vars.ZOHO_CRM_DEAL_STAGE_PAYMENT_CAPTURED || '' }}
      TF_VAR_zoho_crm_deal_stage_payment_refunded: ${{ vars.ZOHO_CRM_DEAL_STAGE_PAYMENT_REFUNDED || '' }}
      TF_VAR_zoho_crm_deal_stage_shop_paid: ${{ vars.ZOHO_CRM_DEAL_STAGE_SHOP_PAID || '' }}
      TF_VAR_zoho_crm_lead_conversion_enabled: ${{ vars.ZOHO_CRM_LEAD_CONVERSION_ENABLED || 'false' }}
      TF_VAR_zoho_crm_lead_status_new: ${{ vars.ZOHO_CRM_LEAD_STATUS_NEW || 'New (Unassigned)' }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
      TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
      TF_VAR_veriff_api_key: ${{ secrets.VERIFF_API_KEY }}
      TF_VAR_veriff_shared_secret: ${{ secrets.VERIFF_SHARED_SECRET }}
      TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TF_VAR_twilio_verify_service_sid: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
      TF_VAR_twilio_api_key_sid: ${{ secrets.TWILIO_API_KEY_SID }}
      TF_VAR_twilio_api_key_secret: ${{ secrets.TWILIO_API_KEY_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
      TF_VAR_stripe_transfers_webhook_secret: ${{ secrets.STRIPE_TRANSFERS_WEBHOOK_SECRET }}
      TF_VAR_stripe_payments_webhook_secret: ${{ secrets.STRIPE_PAYMENTS_WEBHOOK_SECRET }}
      # --- Shop and lax.art (London Art Exchange Ltd Stripe account). ---
      TF_VAR_stripe_shop_secret_key: ${{ secrets.STRIPE_SHOP_SECRET_KEY }}
      TF_VAR_stripe_shop_webhook_secret: ${{ secrets.STRIPE_SHOP_WEBHOOK_SECRET }}
      TF_VAR_stripe_shop_connect_webhook_secret: ${{ secrets.STRIPE_SHOP_CONNECT_WEBHOOK_SECRET }}
      TF_VAR_stripe_shop_publishable_key: ${{ secrets.STRIPE_SHOP_PUBLISHABLE_KEY }}
      TF_VAR_stripe_shop_connect_platform_key: ${{ vars.STRIPE_SHOP_CONNECT_PLATFORM_KEY || 'lax_art' }}
      TF_VAR_shop_connect_transfers_enabled: ${{ vars.SHOP_CONNECT_TRANSFERS_ENABLED || 'false' }}
      TF_VAR_shop_portal_ownership_enabled: ${{ vars.SHOP_PORTAL_OWNERSHIP_ENABLED || 'false' }}
      TF_VAR_shop_admin_enabled: ${{ vars.SHOP_ADMIN_ENABLED || 'false' }}
      TF_VAR_shop_payouts_enabled: ${{ vars.SHOP_PAYOUTS_ENABLED || 'false' }}
      TF_VAR_shop_third_party_enabled: ${{ vars.SHOP_THIRD_PARTY_ENABLED || 'false' }}
      TF_VAR_shop_originals_enabled: ${{ vars.SHOP_ORIGINALS_ENABLED || 'false' }}
      TF_VAR_shop_merchandise_enabled: ${{ vars.SHOP_MERCHANDISE_ENABLED || 'false' }}
      TF_VAR_shop_editorial_enabled: ${{ vars.SHOP_EDITORIAL_ENABLED || 'false' }}
      TF_VAR_art_editorial_enabled: ${{ vars.ART_EDITORIAL_ENABLED || 'false' }}
      TF_VAR_shop_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      # Attaches shop.lax.art, admin.shop.lax.art and www.thelax.art (storefront launch only).
      TF_VAR_storefronts_public: ${{ vars.STOREFRONTS_PUBLIC || 'false' }}
      # --- Identity ---
      TF_VAR_enable_auth_ssf_delivery: ${{ vars.AUTH_SSF_DELIVERY_ENABLED || 'false' }}
      TF_VAR_production_migration_through: ${{ vars.PRODUCTION_MIGRATION_THROUGH || '' }}
      # --- Per-component images: empty inherits app_image_tag, so every component pins one SHA. ---
      TF_VAR_shop_identity_image_tag: ${{ inputs.app_image_tag }}
      TF_VAR_shop_image_tag: ${{ inputs.app_image_tag }}
      TF_VAR_shop_api_image_tag: ${{ inputs.app_image_tag }}
      TF_VAR_shop_admin_image_tag: ${{ inputs.app_image_tag }}
      TF_VAR_account_image_tag: ${{ inputs.app_image_tag }}
      TF_VAR_art_image_tag: ${{ inputs.app_image_tag }}
      TF_VAR_cron_internal_secret: ${{ secrets.CRON_INTERNAL_SECRET }}
      TF_VAR_kyc_threshold_amount: "1000"
      TF_VAR_kyc_threshold_currency: "GBP"
      TF_VAR_ops_support_email: ${{ secrets.OPS_SUPPORT_EMAIL }}
      TF_VAR_ops_oncall_email: ${{ secrets.OPS_ONCALL_EMAIL }}
      TF_VAR_admin_email_address: ${{ secrets.ADMIN_EMAIL_ADDRESS }}
      TF_VAR_xero_client_id: ${{ secrets.XERO_CLIENT_ID }}
      TF_VAR_xero_client_secret: ${{ secrets.XERO_CLIENT_SECRET }}
      TF_VAR_xero_redirect_uri: ${{ secrets.XERO_REDIRECT_URI }}
      TF_VAR_xero_webhook_key: ${{ secrets.XERO_WEBHOOK_KEY }}
      TF_VAR_xero_default_revenue_account_code: "200"
      TF_VAR_xero_default_tax_type: "NONE"
      TF_VAR_xero_invoice_due_days: "14"
      TF_VAR_xero_invoice_blocking: "false"
      TF_VAR_xero_post_connect_web_redirect: ${{ secrets.XERO_POST_CONNECT_WEB_REDIRECT }}
      TF_VAR_xero_use_legal_entity_contact: "false"
      TF_VAR_xero_payout_bill_account_code: "400"
      TF_VAR_auth_dek_key: ${{ secrets.AUTH_DEK_KEY }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TF_VAR_turnstile_site_key: ${{ secrets.TURNSTILE_SITE_KEY }}
      TF_VAR_verify_origin: "true"
      TF_VAR_csp_enforce: ${{ secrets.CSP_ENFORCE || '0' }}
      TF_VAR_next_public_csp_report_uri: ${{ secrets.NEXT_PUBLIC_CSP_REPORT_URI }}
      TF_VAR_next_public_gtm_id: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      TF_VAR_marketing_attribution_enabled: ${{ vars.MARKETING_ATTRIBUTION_ENABLED || 'false' }}
      TF_VAR_next_public_marketing_attribution_enabled: ${{ vars.NEXT_PUBLIC_MARKETING_ATTRIBUTION_ENABLED || 'false' }}
      TF_VAR_strict_bid_eligibility_enabled: ${{ vars.STRICT_BID_ELIGIBILITY_ENABLED || 'false' }}
      TF_VAR_kyc_onboarding_enabled: ${{ vars.KYC_ONBOARDING_ENABLED || 'false' }}
      TF_VAR_full_buyer_onboarding_enabled: ${{ vars.FULL_BUYER_ONBOARDING_ENABLED || 'false' }}
      TF_VAR_marketing_prompts_enabled: ${{ vars.MARKETING_PROMPTS_ENABLED || 'false' }}
      TF_VAR_meta_pixel_id: ${{ secrets.META_PIXEL_ID }}
      TF_VAR_meta_capi_access_token: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
      TF_VAR_meta_capi_test_event_code: ${{ secrets.META_CAPI_TEST_EVENT_CODE }}
      TF_VAR_ga4_measurement_id: ${{ vars.GA4_MEASUREMENT_ID }}
      TF_VAR_slack_channel_id: ${{ secrets.SENTRY_SLACK_CHANNEL_ID }}
      TF_VAR_pagerduty_integration_key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
      # --- ATG White Label (release-built; see docs/engineering/release-main-parity.md). ---
      TF_VAR_atg_sync_enabled: ${{ vars.ATG_SYNC_ENABLED || 'false' }}
      TF_VAR_atg_api_username: ${{ secrets.ATG_API_USERNAME }}
      TF_VAR_atg_api_password: ${{ secrets.ATG_API_PASSWORD }}
      TF_VAR_atg_client_id: ${{ vars.ATG_CLIENT_ID }}
      TF_VAR_atg_platform_code: ${{ vars.ATG_PLATFORM_CODE }}
      TF_VAR_atg_increment_set_id: ${{ vars.ATG_INCREMENT_SET_ID }}
      TF_VAR_atg_default_category: ${{ vars.ATG_DEFAULT_CATEGORY }}
      TF_VAR_atg_white_label_base_url: ${{ vars.ATG_WHITE_LABEL_BASE_URL }}
      # persistent layer: ATG's DNS-only ACM validation CNAME for auctions.lax.bid.
      TF_VAR_atg_acm_validation_enabled: ${{ vars.ATG_ACM_VALIDATION_ENABLED || 'false' }}
      # persistent layer: auctions.lax.bid proxied through the atg-cookie-shield Worker
      # (token needs Workers Scripts + Workers Routes edit; see docs/integrations/atg.md).
      TF_VAR_atg_white_label_enabled: ${{ vars.ATG_WHITE_LABEL_ENABLED || 'false' }}
      # persistent layer: planned-maintenance page (Cloudflare Worker) and its staff allow-list,
      # as an HCL/JSON list, e.g. ["198.51.100.7","2001:db8::/48"].
      TF_VAR_maintenance_enabled: ${{ vars.MAINTENANCE_ENABLED || 'false' }}
      TF_VAR_maintenance_allowed_ips: ${{ vars.MAINTENANCE_ALLOWED_IPS || '[]' }}
      # persistent layer: shop.lax.art / admin.shop.lax.art records once the lax.art zone is in Cloudflare.
      TF_VAR_lax_art_dns_enabled: ${{ vars.LAX_ART_DNS_ENABLED || 'false' }}
      # --- Prebuilt-image deploys (DOCR). Set APP_DEPLOY_SOURCE_* repo variable to "image". ---
      TF_VAR_app_deploy_source: ${{ vars.APP_DEPLOY_SOURCE_PROD || 'github' }}
      # persistent layer: create the account-level DOCR registry (prod state only).
      TF_VAR_create_container_registry: ${{ vars.CREATE_CONTAINER_REGISTRY || 'false' }}
      TF_VAR_container_registry_name: ${{ vars.DOCR_REGISTRY || 'lax-bid' }}
      TF_VAR_container_registry_region: ${{ vars.DOCR_REGISTRY_REGION || 'fra1' }}
      TF_VAR_container_registry_subscription_tier: ${{ vars.DOCR_REGISTRY_TIER || 'professional' }}
    steps:
      - name: Validate inputs
        env:
          INPUT_APP_IMAGE_TAG: ${{ inputs.app_image_tag }}
          INPUT_INFRA_REF: ${{ inputs.infra_ref }}
          INPUT_APP_GIT_BRANCH: ${{ inputs.app_git_branch }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_APP_IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::app_image_tag must be a 40-character lowercase git SHA."
            exit 1
          fi
          # Git ref characters only; a leading "-" or ".." would be read as an option or a path.
          ref_pattern='^[A-Za-z0-9._/-]{1,200}$'
          for pair in "infra_ref:$INPUT_INFRA_REF" "app_git_branch:$INPUT_APP_GIT_BRANCH"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ] && [ "$name" = "app_git_branch" ]; then
              continue
            fi
            if ! [[ "$value" =~ $ref_pattern ]] || [[ "$value" == -* ]] || [[ "$value" == *..* ]]; then
              echo "::error::$name must be a git ref (letters, digits, ., _, /, -), at most 200 characters."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-infra
        with:
          ref: ${{ inputs.infra_ref }}
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - name: App Platform Git branch
        env:
          INPUT_APP_GIT_BRANCH: ${{ inputs.app_git_branch }}
        run: |
          b="$INPUT_APP_GIT_BRANCH"
          [ -n "$b" ] || b="main"
          echo "TF_VAR_app_git_branch=$b" >> "$GITHUB_ENV"
      - name: Pin app image tag
        if: vars.APP_DEPLOY_SOURCE_PROD == 'image'
        env:
          INPUT_APP_IMAGE_TAG: ${{ inputs.app_image_tag }}
        run: |
          echo "APP_IMAGE_TAG=$INPUT_APP_IMAGE_TAG" >> "$GITHUB_ENV"
          echo "TF_VAR_app_image_tag=$INPUT_APP_IMAGE_TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: vars.APP_DEPLOY_SOURCE_PROD == 'image'
        with:
          node-version: "22"
      - uses: digitalocean/action-doctl@v2
        if: vars.APP_DEPLOY_SOURCE_PROD == 'image'
        with:
          version: 2.0.0
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Verify prebuilt web image exists for app pin
        if: vars.APP_DEPLOY_SOURCE_PROD == 'image'
        env:
          APP_IMAGE_TAG: ${{ env.APP_IMAGE_TAG }}
        run: |
          set -euo pipefail
          node scripts/ci/verify-prebuilt-web-for-deploy.mjs \
            --environment prod \
            --sha "$APP_IMAGE_TAG"
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/prod
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Terraform plan (read-only)
        id: plan
        working-directory: .infra-config/terraform/ephemeral/prod
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -out=prod-ephemeral.tfplan
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes present (both are successful plans); 1 = error.
          if [ "$code" -eq 1 ]; then exit 1; fi
      - name: Render human-readable plan
        working-directory: .infra-config/terraform/ephemeral/prod
        run: terraform show -no-color prod-ephemeral.tfplan > prod-ephemeral-plan.txt
      - name: Job summary
        working-directory: .infra-config/terraform/ephemeral/prod
        env:
          INPUT_APP_IMAGE_TAG: ${{ inputs.app_image_tag }}
          INPUT_INFRA_REF: ${{ inputs.infra_ref }}
          INPUT_APP_GIT_BRANCH: ${{ inputs.app_git_branch }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          {
            echo "## Terraform plan: ephemeral/prod (read-only, nothing applied)"
            echo "- app_image_tag: \`$INPUT_APP_IMAGE_TAG\`"
            echo "- infra ref: \`$INPUT_INFRA_REF\`"
            echo "- app_git_branch: \`$INPUT_APP_GIT_BRANCH\`"
            if [ "$PLAN_EXITCODE" = "2" ]; then
              echo "- Result: **changes present**"
            else
              echo "- Result: **no changes**"
            fi
            echo
            echo "### Resource changes"
            grep -E '^\s*# .* (will be|must be|has been|is tainted)' prod-ephemeral-plan.txt || echo "(none)"
            echo
            echo "### Plan summary"
            grep -E '^(Plan:|No changes\.)' prod-ephemeral-plan.txt || true
            echo
            echo "Full plan: download the \`terraform-plan-prod-ephemeral\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-prod-ephemeral
          # Text plan only (sensitive values redacted). The binary .tfplan can embed secrets,
          # so it is deliberately not uploaded; apply workflows re-plan anyway.
          path: .infra-config/terraform/ephemeral/prod/prod-ephemeral-plan.txt
          if-no-files-found: error
          retention-days: 14
