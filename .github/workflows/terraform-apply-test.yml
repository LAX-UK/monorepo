name: Terraform apply test
on:
  workflow_call:
    inputs:
      layer:
        type: string
        required: true
      infra_ref:
        type: string
        required: false
        default: main
      parent_holds_deploy_lock:
        type: boolean
        required: false
        default: false
      enable_auth_ssf_delivery:
        type: boolean
        required: false
        default: false
      auth_sha:
        type: string
        required: false
      auth_digest:
        type: string
        required: false
      shop_identity_sha:
        type: string
        required: false
      shop_identity_digest:
        type: string
        required: false
      shop_sha:
        type: string
        required: false
      shop_digest:
        type: string
        required: false
      shop_api_sha:
        type: string
        required: false
      shop_api_digest:
        type: string
        required: false
      shop_admin_sha:
        type: string
        required: false
      shop_admin_digest:
        type: string
        required: false
      account_sha:
        type: string
        required: false
      account_digest:
        type: string
        required: false
      app_image_tag:
        type: string
        required: false
        description: Immutable monorepo SHA for lax-test-migrate and default worker images
      run_ephemeral_predeploy_migrate:
        type: boolean
        required: false
        default: true
        description: When false, skip the CI migrate container before apply (same pins already migrated in a prior step).
concurrency:
  group: >-
    ${{
      inputs.parent_holds_deploy_lock &&
      format('staging-recovery-child-{0}-{1}', github.run_id, inputs.layer) ||
      (inputs.layer == 'ephemeral' && 'app-deploy-test' ||
       format('terraform-test-{0}', inputs.layer))
    }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    environment: test
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      TF_VAR_github_integration_id: ${{ secrets.SENTRY_GITHUB_INTEGRATION_ID }}
      SENTRY_GITHUB_INTEGRATION_ID: ${{ secrets.SENTRY_GITHUB_INTEGRATION_ID }}
      TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      TF_VAR_check_in_token_secret: ${{ secrets.CHECK_IN_TOKEN_SECRET }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_spaces_access_key_id: ${{ secrets.MEDIA_SPACES_ACCESS_KEY_ID }}
      TF_VAR_spaces_secret_access_key: ${{ secrets.MEDIA_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_postmark_server_token: ${{ secrets.POSTMARK_SERVER_TOKEN }}
      TF_VAR_postmark_webhook_basic_auth: ${{ secrets.POSTMARK_WEBHOOK_BASIC_AUTH }}
      TF_VAR_email_unsubscribe_secret: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
      TF_VAR_zoho_campaigns_api_key: ${{ secrets.ZOHO_CAMPAIGNS_API_KEY }}
      TF_VAR_zoho_campaigns_list_key: ${{ secrets.ZOHO_CAMPAIGNS_LIST_KEY }}
      TF_VAR_zoho_client_id: ${{ secrets.ZOHO_CLIENT_ID }}
      TF_VAR_zoho_client_secret: ${{ secrets.ZOHO_CLIENT_SECRET }}
      TF_VAR_zoho_refresh_token: ${{ secrets.ZOHO_REFRESH_TOKEN }}
      TF_VAR_zoho_crm_sync_mode: ${{ vars.ZOHO_CRM_SYNC_MODE || 'dry_run' }}
      TF_VAR_zoho_crm_enabled_event_types: ${{ vars.ZOHO_CRM_ENABLED_EVENT_TYPES || 'user.registered' }}
      TF_VAR_zoho_crm_auction_pipeline: ${{ vars.ZOHO_CRM_AUCTION_PIPELINE || '' }}
      TF_VAR_zoho_crm_deal_stage_lot_won: ${{ vars.ZOHO_CRM_DEAL_STAGE_LOT_WON || '' }}
      TF_VAR_zoho_crm_deal_stage_payment_captured: ${{ vars.ZOHO_CRM_DEAL_STAGE_PAYMENT_CAPTURED || '' }}
      TF_VAR_zoho_crm_deal_stage_payment_refunded: ${{ vars.ZOHO_CRM_DEAL_STAGE_PAYMENT_REFUNDED || '' }}
      TF_VAR_zoho_crm_deal_stage_shop_paid: ${{ vars.ZOHO_CRM_DEAL_STAGE_SHOP_PAID || '' }}
      TF_VAR_zoho_crm_lead_conversion_enabled: ${{ vars.ZOHO_CRM_LEAD_CONVERSION_ENABLED || 'false' }}
      TF_VAR_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
      TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
      TF_VAR_veriff_api_key: ${{ secrets.VERIFF_API_KEY }}
      TF_VAR_veriff_shared_secret: ${{ secrets.VERIFF_SHARED_SECRET }}
      TF_VAR_twilio_account_sid: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TF_VAR_twilio_verify_service_sid: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
      TF_VAR_twilio_api_key_sid: ${{ secrets.TWILIO_API_KEY_SID }}
      TF_VAR_twilio_api_key_secret: ${{ secrets.TWILIO_API_KEY_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
      TF_VAR_stripe_transfers_webhook_secret: ${{ secrets.STRIPE_TRANSFERS_WEBHOOK_SECRET }}
      TF_VAR_stripe_payments_webhook_secret: ${{ secrets.STRIPE_PAYMENTS_WEBHOOK_SECRET }}
      TF_VAR_stripe_shop_secret_key: ${{ secrets.STRIPE_SHOP_SECRET_KEY }}
      TF_VAR_stripe_shop_webhook_secret: ${{ secrets.STRIPE_SHOP_WEBHOOK_SECRET }}
      TF_VAR_cron_internal_secret: ${{ secrets.CRON_INTERNAL_SECRET }}
      TF_VAR_ops_support_email: ${{ secrets.OPS_SUPPORT_EMAIL }}
      TF_VAR_ops_oncall_email: ${{ secrets.OPS_ONCALL_EMAIL }}
      TF_VAR_admin_email_address: ${{ secrets.ADMIN_EMAIL_ADDRESS }}
      TF_VAR_xero_client_id: ${{ secrets.XERO_CLIENT_ID }}
      TF_VAR_xero_client_secret: ${{ secrets.XERO_CLIENT_SECRET }}
      TF_VAR_xero_redirect_uri: ${{ secrets.XERO_REDIRECT_URI }}
      TF_VAR_xero_webhook_key: ${{ secrets.XERO_WEBHOOK_KEY }}
      TF_VAR_xero_post_connect_web_redirect: ${{ secrets.XERO_POST_CONNECT_WEB_REDIRECT }}
      TF_VAR_auth_dek_key: ${{ secrets.AUTH_DEK_KEY }}
      TF_VAR_turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TF_VAR_turnstile_site_key: ${{ secrets.TURNSTILE_SITE_KEY }}
      TF_VAR_verify_origin: "true"
      TF_VAR_csp_enforce: "0"
      TF_VAR_next_public_csp_report_uri: ${{ secrets.NEXT_PUBLIC_CSP_REPORT_URI }}
      TF_VAR_slack_channel_id: ${{ secrets.SENTRY_SLACK_CHANNEL_ID }}
      TF_VAR_pagerduty_integration_key: ${{ secrets.PAGERDUTY_INTEGRATION_KEY }}
      TF_VAR_strict_bid_eligibility_enabled: ${{ vars.STRICT_BID_ELIGIBILITY_ENABLED || 'true' }}
      TF_VAR_kyc_onboarding_enabled: ${{ vars.KYC_ONBOARDING_ENABLED || 'false' }}
      TF_VAR_full_buyer_onboarding_enabled: ${{ vars.FULL_BUYER_ONBOARDING_ENABLED || 'false' }}
      TF_VAR_marketing_prompts_enabled: ${{ vars.MARKETING_PROMPTS_ENABLED || 'false' }}
      # --- Prebuilt-image deploys (DOCR). Set APP_DEPLOY_SOURCE_TEST repo variable to "image". ---
      # (The DOCR registry itself is account-level and created only by the prod
      # persistent apply; test reuses the same registry with lax-test-* repos.)
      TF_VAR_app_deploy_source: ${{ vars.APP_DEPLOY_SOURCE_TEST || 'github' }}
      TF_VAR_enable_auth_ssf_delivery: ${{ inputs.enable_auth_ssf_delivery && 'true' || 'false' }}
      TF_VAR_app_image_tag: ${{ inputs.app_image_tag }}
      TF_VAR_shop_identity_image_tag: ${{ inputs.shop_identity_sha }}
      TF_VAR_shop_image_tag: ${{ inputs.shop_sha }}
      TF_VAR_shop_api_image_tag: ${{ inputs.shop_api_sha }}
      TF_VAR_shop_admin_image_tag: ${{ inputs.shop_admin_sha }}
      TF_VAR_account_image_tag: ${{ inputs.account_sha }}
      TF_VAR_shop_portal_ownership_enabled: ${{ vars.SHOP_PORTAL_OWNERSHIP_ENABLED || 'true' }}
      TF_VAR_shop_admin_enabled: ${{ vars.SHOP_ADMIN_ENABLED || 'false' }}
      TF_VAR_shop_payouts_enabled: ${{ vars.SHOP_PAYOUTS_ENABLED || 'false' }}
      TF_VAR_shop_third_party_enabled: ${{ vars.SHOP_THIRD_PARTY_ENABLED || 'false' }}
      TF_VAR_shop_originals_enabled: ${{ vars.SHOP_ORIGINALS_ENABLED || 'false' }}
      TF_VAR_shop_merchandise_enabled: ${{ vars.SHOP_MERCHANDISE_ENABLED || 'false' }}
      TF_VAR_shop_ops_alert_email: ${{ secrets.OPS_ALERT_EMAIL }}
      APP_ID: ${{ secrets.DO_TEST_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-infra
        with:
          ref: ${{ inputs.infra_ref }}
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - name: Verify Cloudflare zone access before ephemeral apply
        if: inputs.layer == 'ephemeral'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ci/verify-cloudflare-zone-access.mjs
      - name: Verify Auth Terraform environment contract
        if: inputs.layer == 'ephemeral'
        run: node scripts/ci/verify-auth-terraform-env.mjs .infra-config/terraform/ephemeral/test/main.tf
      - name: Verify staging migrate journal contract
        if: inputs.layer == 'ephemeral'
        run: |
          node scripts/ci/verify-staging-migrate-contract.mjs \
            .infra-config/terraform/ephemeral/test/main.tf \
            .infra-config/terraform/ephemeral/prod/main.tf
      - uses: digitalocean/action-doctl@v2
        if: inputs.layer == 'ephemeral'
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - name: Require approved Auth and Shop image contracts before ephemeral apply
        if: inputs.layer == 'ephemeral' && vars.APP_DEPLOY_SOURCE_TEST == 'image'
        env:
          AUTH_SHA: ${{ inputs.auth_sha }}
          AUTH_DIGEST: ${{ inputs.auth_digest }}
          SHOP_IDENTITY_SHA: ${{ inputs.shop_identity_sha }}
          SHOP_IDENTITY_DIGEST: ${{ inputs.shop_identity_digest }}
          SHOP_SHA: ${{ inputs.shop_sha }}
          SHOP_DIGEST: ${{ inputs.shop_digest }}
          SHOP_API_SHA: ${{ inputs.shop_api_sha }}
          SHOP_API_DIGEST: ${{ inputs.shop_api_digest }}
          DOCR_REGISTRY: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}
        run: |
          doctl registry login --expiry-seconds 900
          node scripts/ci/verify-staging-image-contract.mjs
      - uses: ./.github/actions/sentry-auth-preflight
        if: inputs.layer == 'sentry'
        with:
          organization-slug: lax-bid
          team-slug: lax-engineering
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/${{ inputs.layer }}/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - uses: pnpm/action-setup@v4
        if: inputs.layer == 'ephemeral'
      - uses: actions/setup-node@v4
        if: inputs.layer == 'ephemeral'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: inputs.layer == 'ephemeral'
      - name: Build DB maintenance scripts for deploy preflight
        if: inputs.layer == 'ephemeral'
        run: pnpm --filter @auction/db... build
      - name: Require auth-at-rest and identity directory ready before mutate
        if: inputs.layer == 'ephemeral'
        env:
          AUTH_DEK_KEY: ${{ secrets.AUTH_DEK_KEY }}
        run: |
          set -euo pipefail
          tf_dir=.infra-config/terraform/ephemeral/test
          export DATABASE_URL_OWNER="$(terraform -chdir="$tf_dir" output -raw postgres_owner_uri)"
          export DATABASE_URL_AUTH="$(terraform -chdir="$tf_dir" output -raw database_url_auth)"
          database_ca_cert="$(terraform -chdir="$tf_dir" output -raw database_ca_certificate)"
          test -n "$database_ca_cert"
          database_ca_path="$RUNNER_TEMP/staging-postgres-ca.crt"
          printf '%s\n' "$database_ca_cert" > "$database_ca_path"
          chmod 0600 "$database_ca_path"
          export NODE_EXTRA_CA_CERTS="$database_ca_path"
          export DATABASE_CA_CERT="$database_ca_cert"
          node scripts/ci/assert-auth-at-rest-clear.mjs
          node scripts/ci/verify-identity-directory-drift.mjs
      - name: Apply full test migrations and role grants before App Platform rollout
        if: >-
          inputs.layer == 'ephemeral' &&
          inputs.run_ephemeral_predeploy_migrate &&
          vars.APP_DEPLOY_SOURCE_TEST == 'image' &&
          inputs.app_image_tag != ''
        env:
          OIDC_CLIENT_SECRET_LAX_SHOP_WEB_FALLBACK: ${{ secrets.OIDC_CLIENT_SECRET_LAX_SHOP_WEB }}
          OIDC_CLIENT_SECRET_LAX_SHOP_ADMIN_FALLBACK: ${{ secrets.OIDC_CLIENT_SECRET_LAX_SHOP_ADMIN }}
          MIGRATE_IMAGE: registry.digitalocean.com/${{ vars.DOCR_REGISTRY }}/lax-test-migrate:${{ inputs.app_image_tag }}
        run: |
          chmod +x scripts/ci/run-test-ephemeral-predeploy-migrate.sh
          scripts/ci/run-test-ephemeral-predeploy-migrate.sh \
            .infra-config/terraform/ephemeral/test \
            "$MIGRATE_IMAGE"
      - uses: ./.github/actions/terraform-apply
        with:
          working-directory: .infra-config/terraform/${{ inputs.layer }}/test
          state-key: ${{ inputs.layer }}-test
          verify-plan-safe: ${{ inputs.layer == 'ephemeral' && 'true' || 'false' }}
          app-id: ${{ inputs.layer == 'ephemeral' && env.APP_ID || '' }}
          allowed-delete-addresses: >-
            ["module.postgres_rbac.postgresql_default_privileges.app_tables[\"shop_app\"]",
            "module.postgres_rbac.postgresql_default_privileges.app_sequences[\"shop_app\"]",
            "random_password.shop_session_secret"]
      - name: Require Shop DNS, TLS, and readiness after apply
        if: inputs.layer == 'ephemeral'
        env:
          EXPECTED_SHOP_SHA: ${{ inputs.shop_sha }}
          EXPECTED_SHOP_IDENTITY_SHA: ${{ inputs.shop_identity_sha }}
        run: |
          set -euo pipefail
          attempt=0
          last_body=""
          for _ in $(seq 1 60); do
            attempt=$((attempt + 1))
            http_code="$(
              curl --silent --show-error --max-time 10 -o "$RUNNER_TEMP/shop-ready.json" \
                -w '%{http_code}' https://test-shop.lax.bid/health/ready || echo "000"
            )"
            body="$(cat "$RUNNER_TEMP/shop-ready.json" 2>/dev/null || true)"
            last_body="http=${http_code} body=${body}"
            status="$(jq -r '.status // empty' <<<"$body" 2>/dev/null || true)"
            shop_release="$(jq -r '.release // empty' <<<"$body" 2>/dev/null || true)"
            identity_release="$(
              jq -r '.dependencies.shopIdentity.release // empty' <<<"$body" 2>/dev/null || true
            )"
            if test "$status" = "ok" &&
              { test -z "$EXPECTED_SHOP_SHA" || test "$shop_release" = "$EXPECTED_SHOP_SHA"; } &&
              { test -z "$EXPECTED_SHOP_IDENTITY_SHA" ||
                test "$identity_release" = "$EXPECTED_SHOP_IDENTITY_SHA"; }; then
              exit 0
            fi
            if test $((attempt % 6)) -eq 0; then
              echo "Shop readiness poll ${attempt}/60: ${last_body}"
            fi
            sleep 10
          done
          echo "::error::Shop readiness/release contract did not converge (${last_body})"
          echo "### Shop readiness did not converge" >> "$GITHUB_STEP_SUMMARY"
          echo "Last probe: \`${last_body}\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Prove Auth readiness after ephemeral traffic change
        if: inputs.layer == 'ephemeral' && inputs.auth_sha != ''
        env:
          EXPECTED_AUTH_SHA: ${{ inputs.auth_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_AUTH_SHA" =~ ^[0-9a-f]{40}$ ]]
          for _ in $(seq 1 30); do
            body="$(curl --fail --silent https://test-auth.lax.bid/health/ready || true)"
            if test "$(jq -r '.release // empty' <<<"$body")" = "$EXPECTED_AUTH_SHA"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Auth readiness did not report the approved release"
          exit 1
