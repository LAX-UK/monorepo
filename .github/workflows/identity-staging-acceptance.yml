name: Identity staging acceptance

on:
  workflow_call:
    inputs:
      identity_sha:
        type: string
        required: true
      outbox_max_age_ms:
        type: number
        required: true
      ssf_mode:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      identity_sha:
        description: Standalone Identity commit under test
        required: true
        type: string
      outbox_max_age_ms:
        description: Approved lifecycle-outbox lag threshold in milliseconds
        required: true
        type: number
      ssf_mode:
        description: Acceptance phase — core behavior first, then SSF delivery
        required: true
        type: choice
        options:
          - ssf_disabled
          - ssf_enabled

permissions:
  contents: read

concurrency:
  group: identity-staging-acceptance
  cancel-in-progress: false

jobs:
  live-contracts:
    runs-on: ubuntu-latest
    environment: test
    env:
      AUTH_BASE_URL: https://test-auth.lax.bid
      API_BASE_URL: https://test-api.lax.bid
      WEB_ORIGIN: https://test.lax.bid
      SHOP_IDENTITY_BASE_URL: https://test-shop.lax.bid
      IDENTITY_BOUNDARY_SHOP_REQUIRED: "true"
      BID_BFF_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
      BID_BFF_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
      SHOP_OIDC_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
      SHOP_OIDC_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
      REFRESH_TEST_EMAIL: ${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}
      REFRESH_TEST_PASSWORD: ${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}
      REFRESH_TEST_REDIRECT_URI: https://test-shop.lax.bid/auth/callback
      IDENTITY_MACHINE_CLIENT_ID: auth-service
      IDENTITY_DIRECTORY_MAX_PROCESSING_LAG_MS: "60000"
      IDENTITY_OUTBOX_MAX_AGE_MS: ${{ inputs.outbox_max_age_ms }}
      SSF_TEST_ENDPOINT: https://test-api.lax.bid/ssf/events
      SSF_DELIVERY_ENABLED: ${{ inputs.ssf_mode == 'ssf_enabled' && 'true' || 'false' }}
      SSF_FAILURE_REHEARSAL: ${{ inputs.ssf_mode == 'ssf_enabled' && 'true' || 'false' }}
      JWKS_SNAPSHOT_KEY_TEST: ${{ secrets.JWKS_SNAPSHOT_KEY_TEST }}
    steps:
      - name: Require acceptance credentials before infrastructure access
        run: |
          set -euo pipefail
          test -n "${{ secrets.IDENTITY_ACCEPTANCE_EMAIL }}" || {
            echo "::error::IDENTITY_ACCEPTANCE_EMAIL must be configured on the test environment"
            exit 1
          }
          test -n "${{ secrets.IDENTITY_ACCEPTANCE_PASSWORD }}" || {
            echo "::error::IDENTITY_ACCEPTANCE_PASSWORD must be configured on the test environment"
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/checkout-infra
        with:
          ref: main
          app-id: ${{ vars.INFRA_REPO_APP_ID }}
          private-key: ${{ secrets.INFRA_REPO_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: .infra-config/terraform/ephemeral/test
          spaces-access-key-id: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          spaces-secret-access-key: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      - name: Load masked staging contracts from Terraform state
        run: |
          set -euo pipefail
          declare -A outputs=(
            [DATABASE_URL_OWNER]=postgres_owner_uri
            [DATABASE_URL_AUTH]=database_url_auth
            [DATABASE_URL_API]=database_url_api
            [DATABASE_URL_SHOP]=database_url_shop
            [DATABASE_URL_WORKER]=database_url_worker
            [IDENTITY_MACHINE_CLIENT_SECRET]=identity_machine_client_secret
            [AUTH_METRICS_TOKEN]=auth_metrics_token
            [REFRESH_TEST_CLIENT_SECRET]=oidc_shop_web_client_secret
            [SSF_TEST_CLIENT_SECRET]=oidc_bid_web_client_secret
          )
          for env_name in "${!outputs[@]}"; do
            value="$(terraform -chdir=.infra-config/terraform/ephemeral/test output -raw "${outputs[$env_name]}")"
            test -n "$value"
            echo "::add-mask::$value"
            echo "$env_name=$value" >> "$GITHUB_ENV"
          done
          app_id="$(terraform -chdir=.infra-config/terraform/ephemeral/test output -raw app_id)"
          test -n "$app_id"
          echo "APP_ID=$app_id" >> "$GITHUB_ENV"
      - name: Validate requested Identity release
        run: |
          [[ "${{ inputs.identity_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "$(
            curl --fail --silent https://test-auth.lax.bid/health/ready |
              jq -r '.release // .version // empty'
          )" = "${{ inputs.identity_sha }}"
          echo "ACCEPTANCE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_SSF_MODE=${{ inputs.ssf_mode }}" >> "$GITHUB_ENV"
      - name: Discovery, JWKS, HTTPS, headers, and retired API routes
        run: node scripts/ci/verify-identity-boundary.mjs --live
      - name: Bid BFF login, callback, exchanged resource token, and scopes
        run: node scripts/ci/verify-bid-web-bff-roundtrip.mjs
      - name: Shop cold login, SSO, session, and logout isolation
        run: node scripts/ci/verify-shop-oidc-roundtrip.mjs
      - name: Refresh rotation and reuse rejection
        run: node scripts/ci/verify-refresh-reuse.mjs
      - name: Machine token lifecycle, forged origin, and rate limit
        run: node scripts/ci/verify-identity-machine-live.mjs
      - name: Bid and Shop back-channel logout delivery
        run: node scripts/ci/verify-backchannel-logout-live.mjs
      - name: SSF durable delivery and replay contract (Bid receiver)
        if: inputs.ssf_mode == 'ssf_enabled'
        env:
          SSF_TEST_CLIENT_ID: lax-bid-web
          SSF_TEST_CLIENT_SECRET: ${{ env.SSF_TEST_CLIENT_SECRET }}
          SSF_TEST_ENDPOINT: https://test-api.lax.bid/ssf/events
        run: node scripts/ci/verify-identity-ssf-live.mjs
      - name: SSF durable delivery and replay contract (Shop receiver)
        if: inputs.ssf_mode == 'ssf_enabled'
        env:
          SSF_TEST_CLIENT_ID: lax-shop-web
          SSF_TEST_CLIENT_SECRET: ${{ env.REFRESH_TEST_CLIENT_SECRET }}
          SSF_TEST_ENDPOINT: https://test-shop.lax.bid/api/ssf/events
        run: node scripts/ci/verify-identity-ssf-live.mjs
      - name: Directory and profile reconciliation
        run: |
          node scripts/ci/verify-identity-directory-drift.mjs
          pnpm --filter @auction/db db:reconcile-identity-profiles
      - name: Lifecycle outbox lag
        run: node scripts/ci/verify-identity-outbox-live.mjs
      - name: JWKS snapshot encryption and metrics visibility
        run: |
          pnpm tsx scripts/jwks-snapshot.ts test --verify
          test "$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              https://test-auth.lax.bid/metrics
          )" = "401"
          curl --fail --silent \
            --header "Authorization: Bearer $AUTH_METRICS_TOKEN" \
            https://test-auth.lax.bid/metrics > "$RUNNER_TEMP/auth-metrics.txt"
          rg -q '^# (HELP|TYPE) ' "$RUNNER_TEMP/auth-metrics.txt"
      - name: Live database role contracts
        run: |
          pnpm --filter @auction/db test:auth-role-contract
          pnpm --filter @auction/db test:api-role-contract
          pnpm --filter @auction/db test:shop-role-contract
          pnpm --filter @auction/db test:worker-role-contract
