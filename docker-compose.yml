# PostgreSQL + Redis + canonical Identity, Bid API, Shop Identity app, and WS.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auction
    # Default 5432. On Ubuntu, system Postgres often uses 5432 already — set in .env:
    #   POSTGRES_PUBLISH_PORT=5433
    # and use the same port in DATABASE_URL for host-side migrate/seed.
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Applies packages/db/drizzle migrations to the compose Postgres volume (same DATABASE_URL as api).
  # Runs automatically before api starts; re-run manually with: pnpm db:migrate:docker
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auction
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "packages/db/dist/migrate.js"]
    restart: "no"

  configure-oidc:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL_OWNER: postgresql://postgres:postgres@postgres:5432/auction
      OIDC_CLIENT_IDS: lax-shop-web
      OIDC_CLIENT_SECRET_LAX_SHOP_WEB: ${OIDC_CLIENT_SECRET:-local-shop-identity-client-secret-32}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "packages/db/dist/scripts/configure-oidc-clients.js"]
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: "3003"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auction
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-docker-dev-secret-min-16-chars}
      OIDC_ISSUER_URL: http://localhost:3003
      JWT_AUDIENCE: lax-bid-api
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      IDENTITY_MACHINE_CLIENT_ID: ${IDENTITY_MACHINE_CLIENT_ID:-api-service}
      IDENTITY_MACHINE_CLIENT_SECRET: ${IDENTITY_MACHINE_CLIENT_SECRET:-local-identity-machine-secret-32}
      SSF_DELIVERY_ENABLED: ${SSF_DELIVERY_ENABLED:-false}
      SSF_DELIVERY_TIMEOUT_MS: ${SSF_DELIVERY_TIMEOUT_MS:-5000}
      SSF_DELIVERY_MAX_ATTEMPTS: ${SSF_DELIVERY_MAX_ATTEMPTS:-8}
      WEB_ORIGIN: http://localhost:3000
      ALLOW_HTTP_COOKIES: "true"
    depends_on:
      redis:
        condition: service_healthy
      configure-oidc:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      # Local compose stack — use development so localhost URLs and short dev secrets are allowed.
      # Real production: docker-compose.prod.yml + .env (NODE_ENV=production, 48+ char secrets, AUTH_DEK_KEY).
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auction
      REDIS_URL: redis://redis:6379
      CHECK_IN_TOKEN_SECRET: ${CHECK_IN_TOKEN_SECRET:-local-api-token-secret-min-16-chars}
      API_PUBLIC_URL: http://localhost:3001
      OIDC_ISSUER_URL: http://localhost:3003
      OIDC_INTERNAL_BASE_URL: http://auth:3003
      JWT_AUDIENCE: lax-bid-api
      IDENTITY_MACHINE_CLIENT_ID: ${IDENTITY_MACHINE_CLIENT_ID:-api-service}
      IDENTITY_MACHINE_CLIENT_SECRET: ${IDENTITY_MACHINE_CLIENT_SECRET:-local-identity-machine-secret-32}
      WEB_ORIGIN: http://localhost:3000
      VERIFY_ORIGIN: "false"
      POSTMARK_WEBHOOK_BASIC_AUTH: ${POSTMARK_WEBHOOK_BASIC_AUTH:-local-docker-dev}
      ENGLISH_ONLY_AUCTIONS: ${ENGLISH_ONLY_AUCTIONS:-true}
      PLATFORM_CATALOG_LEGAL_ENTITY_ID: ${PLATFORM_CATALOG_LEGAL_ENTITY_ID:-30000000-0000-4000-9000-000000000001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_started

  shop-identity:
    build:
      context: .
      dockerfile: apps/shop-identity/Dockerfile
    ports:
      - "${SHOP_IDENTITY_PORT:-3010}:3010"
    environment:
      NODE_ENV: development
      PORT: "3010"
      DATABASE_URL_SHOP: postgresql://postgres:postgres@postgres:5432/auction
      OIDC_ISSUER_URL: http://localhost:3003
      OIDC_INTERNAL_BASE_URL: http://auth:3003
      OIDC_CLIENT_ID: lax-shop-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-shop-identity-client-secret-32}
      OIDC_REDIRECT_URI: http://localhost:3010/auth/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:3010/
      SESSION_SECRET: ${SESSION_SECRET:-local-shop-identity-session-secret-32}
    depends_on:
      auth:
        condition: service_started
      configure-oidc:
        condition: service_completed_successfully

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    ports:
      # If host 3002 is taken, set WS_PUBLISH_PORT (e.g. 3022) in .env or the shell.
      - "${WS_PUBLISH_PORT:-3002}:3002"
    environment:
      NODE_ENV: development
      PORT: "3002"
      REDIS_URL: redis://redis:6379
      API_URL: http://api:3001
      OIDC_ISSUER: http://localhost:3003
      JWKS_URL: http://auth:3003/.well-known/jwks.json
      WS_JWT_AUDIENCE: lax-ws
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - redis
      - api

volumes:
  postgres_data:
