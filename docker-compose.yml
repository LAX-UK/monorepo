# PostgreSQL + Redis + optional Node services (API, WS)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auction
    # Default 5432. On Ubuntu, system Postgres often uses 5432 already — set in .env:
    #   POSTGRES_PUBLISH_PORT=5433
    # and use the same port in DATABASE_URL for host-side migrate/seed.
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Applies packages/db/drizzle migrations to the compose Postgres volume (same DATABASE_URL as api).
  # Runs automatically before api starts; re-run manually with: pnpm db:migrate:docker
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auction
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "packages/db/dist/migrate.js"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/auction
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production-min-16-chars}
      API_PUBLIC_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      REDIS_URL: redis://redis:6379
      API_URL: http://api:3001
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - redis
      - api

volumes:
  postgres_data:
